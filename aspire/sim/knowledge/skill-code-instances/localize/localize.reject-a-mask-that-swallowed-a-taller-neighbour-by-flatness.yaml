  "code": "def flat_cloud(prompt, min_pts=150):\n    \"\"\"Best-scoring mask whose cloud is actually flat and table-low.\n\n    Guards against SAM3 merging the shallow metal bowl (0.12 m tall) into the\n    'plate' mask, which silently mis-aims the whole grasp.\n    \"\"\"\n    cands = seg_all(prompt, min_pts)\n    ok = []\n    for pts, sc in cands:\n        z_hi = float(np.percentile(pts[:, 2], 99))\n        span = z_hi - float(np.percentile(pts[:, 2], 2))\n        if z_hi < Z_MAX_FLAT and span < SPAN_FLAT:\n            ok.append((pts, sc, z_hi, span))\n    if not ok:\n        return None\n    pts, sc, z_hi, span = ok[0]\n    print(f\"  flat mask for {prompt!r}: n={len(pts)} score={sc:.3f} \"\n          f\"z_hi={z_hi:.4f} span={span:.4f} ({len(ok)}/{len(cands)} flat)\",\n          flush=True)\n    return pts, sc",
