  "code": "def pick_goal_bowl(bowls, plate, ramekin):\n    \"\"\"The bowl lying between the plate and the ramekin.\n\n    Distance to the *midpoint* of the plate-ramekin pair, which is the sampled\n    form of \"between\": it is minimised by the object sitting on the segment\n    joining them and is insensitive to how far along that segment it sits\n    (a perpendicular-distance-to-segment metric would need endpoint clamping).\n    \"\"\"\n    mx = 0.5 * (plate[\"cx\"] + ramekin[\"cx\"])\n    my = 0.5 * (plate[\"cy\"] + ramekin[\"cy\"])\n    ranked = sorted(bowls, key=lambda b: math.hypot(b[\"cx\"] - mx, b[\"cy\"] - my))\n    for b in ranked:\n        print(f\"    bowl ({b['cx']:.3f},{b['cy']:.3f}) fp={b['footprint']:.3f} \"\n              f\"score={b['score']:.3f} -> d_mid={math.hypot(b['cx']-mx, b['cy']-my):.3f}\",\n              flush=True)\n    return ranked[0], ranked",
