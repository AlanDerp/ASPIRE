  "code": "def pick_target_bowl(bowls, ramekin, ramekin_top):\n    \"\"\"The bowl sitting ON the ramekin.\n\n    \"On the ramekin\" is a *physical* relation and the two bowls are the same\n    class and the same size, so neither SAM3 score nor image size separates\n    them.  What separates them is where their own cloud bottoms out: the\n    stacked bowl is held up by the ramekin's rim, so its lowest visible points\n    sit AT the ramekin's rim height, while the decoy's cloud runs to the table,\n    a good 3 cm lower.\n\n    The reference is the ramekin's own measured rim - NOT a table estimate.\n    A table estimate that takes a `min` over all candidates is fooled by any\n    dark side object whose mask bottom-z runs below the table (the wooden\n    cabinet here reads zlo = -0.049 and drags a min-based \"table\" 6 cm down,\n    which then marks the decoy bowl \"elevated\" as well and sends the whole\n    episode's grasps to the wrong bowl).\n\n    Primary key  : bottom-z at/above the ramekin's rim (supported by it).\n    Tie-break    : in-plane distance to the ramekin centre - this is what\n                   carries the choice once an earlier failed attempt has\n                   knocked the bowl down onto the table and nothing is\n                   elevated any more.\n    \"\"\"\n    def key(b):\n        on_ramekin = 1 if b[\"lo\"][2] > ramekin_top - ON_RAMEKIN_SLACK else 0\n        d_ram = math.hypot(b[\"cx\"] - ramekin[\"cx\"], b[\"cy\"] - ramekin[\"cy\"])\n        return (-on_ramekin, d_ram)\n\n    ranked = sorted(bowls, key=key)\n    for b in ranked:\n        print(f\"    bowl ({b['cx']:.3f},{b['cy']:.3f}) zlo={b['lo'][2]:+.3f} \"\n              f\"zhi={b['hi'][2]:+.3f} fp={b['footprint']:.3f} score={b['score']:.3f} \"\n              f\"on_ramekin={int(b['lo'][2] > ramekin_top - ON_RAMEKIN_SLACK)} \"\n              f\"d_ramekin={math.hypot(b['cx']-ramekin['cx'], b['cy']-ramekin['cy']):.3f}\",\n              flush=True)\n    return ranked[0], ranked",
