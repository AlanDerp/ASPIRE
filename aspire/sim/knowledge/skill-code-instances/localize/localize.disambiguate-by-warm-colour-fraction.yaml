  "code": "def find_box(rgb, depth, K, E, prompts, warm_min=WARM_MIN, want_warm=True, relaxed=False):\n    \"\"\"Screen text-prompt candidates down to 'a small flat box on the table'.\n\n    `relaxed` drops the footprint/height screen and keeps only 'must not be a\n    tall thing'.  It is the second-pass fallback and never runs when the\n    primary screen produced a candidate, so it cannot change the happy path.\n    \"\"\"\n    cands = []\n    for prompt in prompts:\n        masks = segment_sam3_text_prompt(rgb, prompt)\n        if not masks:\n            continue\n        for m in sorted(masks, key=lambda z: -z[\"score\"])[:12]:\n            mask = np.asarray(m[\"mask\"]).astype(np.uint8)\n            pts = mask_to_world_points(mask, depth, K, E)\n            if pts is None or len(pts) < 120:\n                continue\n            c = np.median(pts, axis=0)\n            keep = downsample(pts, 0.09, c)\n            xr = np.percentile(keep[:, 0], [2, 98])\n            yr = np.percentile(keep[:, 1], [2, 98])\n            zr = np.percentile(keep[:, 2], [2, 98])\n            dx, dy, dz = xr[1] - xr[0], yr[1] - yr[0], zr[1] - zr[0]\n            if relaxed:\n                if dz > 0.12 or zr[1] > 0.15:\n                    continue\n            else:\n                if not (BOX_MIN_SIDE <= dx <= BOX_MAX_SIDE and BOX_MIN_SIDE <= dy <= BOX_MAX_SIDE):\n                    continue\n                if dz > BOX_MAX_HEIGHT or zr[1] > BOX_MAX_TOP_Z:\n                    continue\n            px = rgb[mask.astype(bool)].astype(np.float64)\n            warm = 0.0\n            if len(px):\n                warm = float(((px[:, 0] > 1.4 * px[:, 1]) & (px[:, 0] > 1.4 * px[:, 2])\n                              & (px[:, 0] > 90)).mean())\n            cands.append({\"c\": np.array([c[0], c[1]]), \"pts\": keep, \"warm\": warm,\n                          \"n\": len(keep), \"score\": float(m[\"score\"]),\n                          \"prompt\": prompt, \"top\": float(zr[1]), \"bot\": float(zr[0])})\n        if cands:\n            break\n    if not cands:\n        return None\n    warm_c = [k for k in cands if k[\"warm\"] >= warm_min]\n    pool = warm_c if (want_warm and warm_c) else cands\n    pool.sort(key=lambda k: (-k[\"warm\"], -k[\"score\"]))\n    for k in cands:\n        print(f\"    cand prompt={k['prompt']!r} score={k['score']:.3f} n={k['n']} \"\n              f\"c={np.round(k['c'],3).tolist()} top={k['top']:.3f} warm={k['warm']:.3f}\",\n              flush=True)\n    return pool[0]",
