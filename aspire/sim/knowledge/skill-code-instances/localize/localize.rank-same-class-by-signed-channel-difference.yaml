  "code": "def find_cans():\n    \"\"\"Cylindrical can candidates with their mask colour statistics.\n\n    Two cans share the scene and SAM3 scores them by apparent size, so the target\n    is chosen by label colour (blue) rather than by score.\n    \"\"\"\n    o = get_observation()\n    rgb, dep, K, E = view(o)\n    found = []\n    for prompt in (\"tin can\", \"can\"):\n        for m in segment_sam3_text_prompt(rgb, prompt):\n            if float(m[\"score\"]) < 0.45:\n                continue\n            mask = np.asarray(m[\"mask\"]).astype(bool)\n            pts = mask_to_world_points(mask.astype(np.uint8), dep, K, E)\n            if pts is None:\n                continue\n            pts = pts[(pts[:, 2] > -0.02) & (pts[:, 2] < 0.14)]\n            if len(pts) < 300:\n                continue\n            xl, xh = np.percentile(pts[:, 0], [2, 98])\n            yl, yh = np.percentile(pts[:, 1], [2, 98])\n            zl, zh = np.percentile(pts[:, 2], [2, 98])\n            width, depth, height = xh - xl, yh - yl, zh - zl\n            # a soup can: 4-9 cm across, 5-12 cm tall (rejects carton / flat boxes)\n            if not (0.040 <= width <= 0.100 and 0.040 <= depth <= 0.100):\n                continue\n            if not (0.045 <= height <= 0.130):\n                continue\n            px = rgb[mask].astype(np.float64)\n            if len(px) < 50:\n                continue\n            blueness = float(px[:, 2].mean() - px[:, 0].mean())\n            found.append({\"cx\": float(0.5 * (xl + xh)), \"cy\": float(0.5 * (yl + yh)),\n                          \"base\": float(zl), \"top\": float(zh),\n                          \"score\": float(m[\"score\"]), \"blueness\": blueness,\n                          \"n\": int(len(pts))})\n    keep = []\n    for f in sorted(found, key=lambda d: (d[\"cx\"], d[\"cy\"])):\n        if all(np.hypot(f[\"cx\"] - k[\"cx\"], f[\"cy\"] - k[\"cy\"]) > 0.035 for k in keep):\n            keep.append(f)\n    return keep",
