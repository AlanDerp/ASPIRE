  "code": "def bowl_geometry(pts):\n    \"\"\"Robust bowl pose: 2/98-percentile *extent midpoint*, not the median.\n\n    Measured on this scene: the bowl's visible cloud is biased toward the\n    camera by the far inner wall, so its median sits ~2 cm off the true centre\n    (median 0.640 vs extent-midpoint 0.659 on seed 51).  A wall pinch commanded\n    from the median therefore lands *inside* the mouth, where closing the\n    fingers shoves the bowl sideways instead of gripping it.\n    \"\"\"\n    c = np.median(pts, axis=0)\n    m = (np.abs(pts[:, 0] - c[0]) < 0.075) & (np.abs(pts[:, 1] - c[1]) < 0.075)\n    if m.sum() >= 40:\n        pts = pts[m]\n    xlo, xhi = np.percentile(pts[:, 0], [2, 98])\n    ylo, yhi = np.percentile(pts[:, 1], [2, 98])\n    return float(0.5 * (xlo + xhi)), float(0.5 * (ylo + yhi)), \\\n        float(np.percentile(pts[:, 2], 2)), float(np.percentile(pts[:, 2], 98)), pts",
