  "code": "def find_box(rgb, d, K, E):\n    \"\"\"The cookie box: the only RED object on the table.\n\n    The FIRST mask that passes the screen wins, and the total number of cloud\n    extractions is capped.  The colour screen is the real discriminator here\n    (the box is the only red thing on the table, and SAM3 scores it 0.05-0.12 -\n    below the plate, both bowls and the ramekin), so ranking the five prompts x\n    eight masks by score buys nothing but costs up to 40 perception calls.\n    \"\"\"\n    tries = 0\n    for p in BOX_PROMPTS:\n        masks = segment_sam3_text_prompt(rgb, p)\n        if not masks:\n            continue\n        for m in sorted(masks, key=lambda x: -x[\"score\"])[:4]:\n            if tries >= 8:\n                return None\n            tries += 1\n            mask = m[\"mask\"].astype(np.uint8)\n            pts = mask_to_world_points(mask, d, K, E)\n            if pts is None or len(pts) < 100 or len(pts) > 20000:\n                continue\n            zlo, zhi = np.percentile(pts[:, 2], [2, 98])\n            if zhi - zlo > 0.035 or zhi > 0.10:\n                continue\n            sx, sy = extent_xy(pts)\n            if max(sx, sy) > 0.11 or min(sx, sy) < 0.025:\n                continue\n            col = median_rgb(rgb, mask)\n            # The box is strongly red-dominant (R-B ~53, R-G ~28).  The PLATE is\n            # white with thin red rings - its median RGB is ~[130,113,110], so\n            # R-B is only ~20 - and it carries MORE points than the box, so any\n            # point-count or score tiebreak hands back the plate.  Seeds 61, 62\n            # and 65 localised the \"box\" at (0.39,-0.13) with ext (0.13,0.12)\n            # and rgb [128,110,108] - the plate.  Both the colour margin here\n            # and the 0.11 m footprint cap above keep the plate out.\n            if col[0] < 60 or (col[0] - col[2]) < 35 or (col[0] - col[1]) < 18:\n                continue\n            c = np.median(pts, axis=0)\n            print(f\"  cookie box prompt={p!r} xy=({c[0]:.3f},{c[1]:.3f}) \"\n                  f\"ext=({sx:.3f},{sy:.3f}) rgb={np.round(col, 1).tolist()}\", flush=True)\n            return (float(c[0]), float(c[1]))\n    return None",
