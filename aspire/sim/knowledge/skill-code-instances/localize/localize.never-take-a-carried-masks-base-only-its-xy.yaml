  "observed_effect": "On seed 51 the carried carton's SAM3 mask reported base z 0.205 against a true 0.131 - 0.074 m too high - while its xy (0.499, 0.057) matched an independent colour+depth centre (0.500, 0.063) to 6 mm. Same prompt, same object: on seeds 54/55 the mask returned the full carton (base 0.123-0.124 vs true ~0.128). So the mask is never used for the hang, which comes from hang = pinch_z_cmd - target_zlo with BOTH terms in the commanded frame (obs[robot_cartesian_pos] reports a point ~0.105 m above the position handed to solve_ik, which is what inflated the baseline's hang on the 12/15 seeds where the carried-mask lookup latched onto a table object)",
