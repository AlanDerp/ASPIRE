  "code": "# Two numbers are needed to place the CARTON rather than the gripper.\n#\n#   hang  -- how far the payload base sits below the commanded hand point.\n#            Both terms of the estimate are in the COMMANDED hand frame\n#            (obs[\"robot_cartesian_pos\"] reports a point ~0.105 m above the\n#            position handed to solve_ik), so it needs no second observation.\n#            A SAM3 mask of a carried carton is often only its top flap and\n#            reports a base up to 0.10 m too high, so the mask is never used\n#            for this.\n#   off   -- how far the payload sits laterally from the hand axis.  The same\n#            truncated mask gets this right: its xy was cross-checked against an\n#            independent colour+depth localisation and agreed to 1 mm.  So the\n#            lateral term is taken from the mask even when its base is not.\nhang = float(pos[2] - target[\"zlo\"])\noff = np.zeros(2)\ncarried = find_carried(rgb2, d2, K2, E2, np.array([pos[0], pos[1]]), cw, language)\nif carried is not None:\n    off_meas = carried[\"xy\"] - np.array([pos[0], pos[1]])\n    off = np.clip(off_meas, -MAX_LATERAL_FIX, MAX_LATERAL_FIX)\n    print(\"  carried prompt=%s frac=%.2f zlo=%.3f xy=(%.3f,%.3f) hang_from_mask=%.3f\"\n          % (carried[\"prompt\"], carried[\"frac\"], carried[\"zlo\"], carried[\"xy\"][0],\n             carried[\"xy\"][1], float(LIFT_Z - carried[\"zlo\"])), flush=True)\n    print(\"  hang taken from the pre-lift estimate %.3f; lateral offset from the mask\"\n          % hang, flush=True)\nelse:\n    print(\"  carried not seen - no lateral offset available\", flush=True)\nprint(\"  hang=%.3f  hand-to-payload xy offset=(%.3f,%.3f)\" % (hang, off[0], off[1]),\n      flush=True)",
