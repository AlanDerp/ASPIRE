  "code": "def pick_reference_and_target(cands, cloud):\n    \"\"\"The ramekin (reference) and the akita bowl the instruction means.\n\n    The ramekin is the smallest bowl-like object that is *not* an akita and\n    rests on the table; the target is the akita nearest to it.  Product words\n    carry no signal here (`ramekin` scores ~0.001 scene-wide) and neither does\n    bare size, because the stove crank is bowl-sized too.\n    \"\"\"\n    pool = black_class_pool(cands)\n    if not pool:\n        return None, None\n    rest = [c for c in cands if not any(c is p for p in pool)]\n    if not rest:\n        return None, None\n    rows = []\n    for c in rest:\n        rz = ring_height(cloud, c[\"c\"], c[\"e\"])\n        rows.append((0 if (rz is None or rz < RING_Z_TABLE) else 1,\n                     round(max(c[\"e\"][0], c[\"e\"][1]), 4), c, rz))\n    rows.sort(key=lambda t: (t[0], t[1]))\n    for off_table, fp, c, rz in rows:\n        print(f\"  ref cand c=({c['c'][0]:.3f},{c['c'][1]:.3f}) diam={fp:.3f} \"\n              f\"z-ext={c['e'][2]:.3f} black={c['black']:.3f} ring_z=\"\n              f\"{'None' if rz is None else format(rz, '.3f')} \"\n              f\"{'OFF-TABLE' if off_table else ''} prompt={c['prompt']!r}\", flush=True)\n    ram = rows[0][2]\n    print(f\"  RAMEKIN ~= ({ram['c'][0]:.3f},{ram['c'][1]:.3f}) diam=\"\n          f\"{max(ram['e'][0], ram['e'][1]):.3f} (no prompt grounds it; geometry rule)\",\n          flush=True)\n    for c in pool:\n        c[\"dist\"] = math.hypot(c[\"c\"][0] - ram[\"c\"][0], c[\"c\"][1] - ram[\"c\"][1])\n    pool = sorted(pool, key=lambda c: c[\"dist\"])\n    for c in cands:\n        print(f\"  cand c=({c['c'][0]:.3f},{c['c'][1]:.3f},{c['c'][2]:.3f}) \"\n              f\"diam={max(c['e'][0], c['e'][1]):.3f} z-ext={c['e'][2]:.3f} \"\n              f\"black={c['black']:.3f} dist_to_ramekin={c.get('dist', float('nan')):.3f} \"\n              f\"{'<-- TARGET' if c is pool[0] else ''} prompt={c['prompt']!r}\", flush=True)\n    return ram, pool[0]",
