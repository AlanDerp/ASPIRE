  "code": "def bowl_cloud(obs, z_top=0.13):\n    \"\"\"Point cloud of the bowl (world frame), or None.\n\n    The top-scoring SAM3 mask for \"metal bowl\" is not always the bowl: with the\n    drawer open it can be a mask that also covers the drawer, whose highest\n    points sit 9 cm above the bowl's rim (a grasp aimed from that cloud closes\n    on air).  Candidates are therefore screened until one looks like a bowl\n    resting on the table, and the cloud is trimmed to a cylinder around its own\n    (robust) centre so a neighbouring plate or drawer cannot skew the extents.\n    \"\"\"\n    rgb, depth, K, E = _obs_parts(obs)\n    try:\n        masks = segment_sam3_text_prompt(rgb, \"metal bowl\")\n        if not masks:\n            masks = segment_sam3_text_prompt(rgb, \"bowl\")\n    except Exception:\n        return None\n    if not masks:\n        return None\n    for m in sorted(masks, key=lambda mm: -mm[\"score\"])[:12]:\n        pts = _points_in_mask(m[\"mask\"], depth, K, E, 300)\n        if pts is None:\n            continue\n        c = np.median(pts, axis=0)\n        keep = pts[np.linalg.norm(pts[:, :2] - c[:2], axis=1) < 0.075]\n        if len(keep) < 250:\n            continue\n        c = np.median(keep, axis=0)\n        cloud = keep[np.linalg.norm(keep[:, :2] - c[:2], axis=1) < 0.075]\n        z_hi = np.percentile(cloud[:, 2], [2, 98])\n        x_hi = np.percentile(cloud[:, 0], [2, 98])\n        y_hi = np.percentile(cloud[:, 1], [2, 98])\n        # a bowl on the table: low, compact, and taller than a flat shadow\n        if z_hi[1] > z_top or (z_hi[1] - z_hi[0]) < 0.030:\n            continue\n        if (x_hi[1] - x_hi[0]) > 0.20 or (y_hi[1] - y_hi[0]) > 0.20:\n            continue\n        _log(\"bowl mask score %.3f n %d z[%.3f %.3f]\" % (m[\"score\"], len(cloud), z_hi[0], z_hi[1]))\n        return cloud\n    return None",
