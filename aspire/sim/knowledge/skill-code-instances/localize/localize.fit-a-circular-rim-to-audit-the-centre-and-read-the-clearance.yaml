  "observed_effect": "On the final keyframes of 15 dev seeds the point-mean and the circle centre differ by 1.2-2.4 cm, and the sign of that difference follows the camera pose, so comparing means across seeds looks like scatter. The fitted radius is a free self-check: it is stable at 0.065-0.067 m for the plate and 0.054 m for the bowl across seeds 57/60/64. The OBB centre is already good (get_oriented_bounding_box_from_3d_points agrees with the circle centre to ~2 mm: seed 57 (0.711,0.210) vs (0.710,0.212), seed 60 (0.720,0.189) vs (0.719,0.191), seed 64 (0.723,0.195) vs (0.723,0.197)), so use the fit to AUDIT the OBB and to read clearance (0.065-0.054 = 1.1 cm of margin), never to replace it",
