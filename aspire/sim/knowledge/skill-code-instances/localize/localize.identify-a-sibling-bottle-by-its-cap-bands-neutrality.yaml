  "code": "def mask_colour(rgb, ys, xs, top_row):\n    \"\"\"Mean body colour and top-band colour/saturation of a mask.\"\"\"\n    px = rgb[ys, xs].astype(np.float64)\n    mx, mn = px.max(axis=1), px.min(axis=1)\n    sat = np.where(mx > 0, (mx - mn) / np.maximum(mx, 1.0), 0.0)\n    top = ys < top_row\n    tb = px[top] if top.any() else px\n    tmx, tmn = tb.max(axis=1), tb.min(axis=1)\n    tsat = np.where(tmx > 0, (tmx - tmn) / np.maximum(tmx, 1.0), 0.0)\n    return dict(\n        mr=float(px[:, 0].mean()), mg=float(px[:, 1].mean()), mb=float(px[:, 2].mean()),\n        sat=float(sat.mean()), val=float((mx / 255.0).mean()),\n        tmr=float(tb[:, 0].mean()), tmg=float(tb[:, 1].mean()), tmb=float(tb[:, 2].mean()),\n        tsat=float(tsat.mean()), tval=float((tmx / 255.0).mean()),\n    )\n\n\ndef bottle_candidates(rgb, dep, K, E, per_prompt=10):\n    \"\"\"Grouped bottle-class candidates, deduped by centroid.\"\"\"\n    out = []\n    for prompt in BOTTLE_PROMPTS:\n        masks = segment_sam3_text_prompt(rgb, prompt)\n        if not masks:\n            continue\n        for m in sorted(masks, key=lambda d: -float(d[\"score\"]))[:per_prompt]:\n            mask = m[\"mask\"].astype(np.uint8)\n            n = int(mask.sum())\n            if n < 120:\n                continue\n            pts = mask_to_world_points(mask, dep, K, E)\n            if pts is None or len(pts) < 120:\n                continue\n            lo = np.percentile(pts, 2, axis=0)\n            hi = np.percentile(pts, 98, axis=0)\n            c = 0.5 * (lo + hi)\n            if any(math.hypot(*(c[:2] - o[\"c\"][:2])) < 0.030 for o in out):\n                continue\n            ys, xs = np.where(mask > 0)\n            box = m[\"box\"]\n            col = mask_colour(rgb, ys, xs, box[1] + 0.25 * (box[3] - box[1]))\n            out.append(dict(\n                sc=float(m[\"score\"]), mask=mask, n=n, pts=pts, c=c, lo=lo, hi=hi,\n                h=float(hi[2] - lo[2]), dx=float(hi[0] - lo[0]), dy=float(hi[1] - lo[1]),\n                body_xy=np.array([0.5 * (lo[0] + hi[0]), 0.5 * (lo[1] + hi[1])]),\n                **col))\n    return out\n\n\ndef pick_ketchup(cands, language):\n    \"\"\"The goal bottle: warm body + neutral (grey) cap + bottle-sized footprint.\"\"\"\n    print(\"  language=%r  (%d bottle candidates)\" % (language, len(cands)), flush=True)\n    for c in sorted(cands, key=lambda c: -c[\"sc\"]):\n        print(\"    sc=%.3f c=(%.3f,%.3f,%.3f) h=%.3f dx=%.3f dy=%.3f body=(%.0f,%.0f,%.0f) \"\n              \"R-B=%.1f sat=%.2f top=(%.0f,%.0f,%.0f) tsat=%.2f\"\n              % (c[\"sc\"], c[\"c\"][0], c[\"c\"][1], c[\"c\"][2], c[\"h\"], c[\"dx\"], c[\"dy\"],\n                 c[\"mr\"], c[\"mg\"], c[\"mb\"], c[\"mr\"] - c[\"mb\"], c[\"sat\"],\n                 c[\"tmr\"], c[\"tmg\"], c[\"tmb\"], c[\"tsat\"]), flush=True)\n    if not cands:\n        return None\n    sized = [c for c in cands if H_MIN <= c[\"h\"] <= H_MAX and max(c[\"dx\"], c[\"dy\"]) <= FOOT_MAX]\n    for pool, why in ((sized, \"sized\"),\n                      (cands, \"all\")):\n        warm = [c for c in pool\n                if (c[\"mr\"] - c[\"mb\"]) > WARM_MIN and c[\"tsat\"] < TOP_NEUTRAL]\n        if warm:\n            best = max(warm, key=lambda c: c[\"sc\"])\n            print(\"  -> ketchup (%s pool) sc=%.3f c=(%.3f,%.3f)\" % (why, best[\"sc\"], best[\"c\"][0], best[\"c\"][1]),\n                  flush=True)\n            return best\n    best = max(cands, key=lambda c: c[\"sc\"])\n    print(\"  -> FALLBACK top score sc=%.3f\" % best[\"sc\"], flush=True)\n    return best",
