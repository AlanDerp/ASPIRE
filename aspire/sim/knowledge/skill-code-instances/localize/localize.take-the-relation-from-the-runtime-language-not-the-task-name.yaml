  "code": "def pick_ramekin_and_target(cands, akitas):\n    \"\"\"The instruction's relation decides between the two equal-score twins:\n    class first (the akita pool), then the akita NEAREST the ramekin.\n\n    The ramekin itself has no usable prompt (`ramekin` -> 0.003), so it is found\n    geometrically -- the smallest on-table bowl-like candidate that is not an\n    akita.\n    \"\"\"\n    if not cands:\n        return None, None\n    ak_idx = set()\n    for a in akitas:\n        for i, c in enumerate(cands):\n            if float(np.linalg.norm(a[\"c\"] - c[\"c\"])) < 0.045:\n                ak_idx.add(i)\n    if not ak_idx:\n        ak_idx = {i for i, c in enumerate(cands) if c[\"score\"] >= 0.85}\n    rest = [c for i, c in enumerate(cands) if i not in ak_idx]\n    if rest:\n        ramekin = min(rest, key=lambda c: max(c[\"ext\"][0], c[\"ext\"][1]))\n    else:                                        # no reference found: smallest overall\n        ramekin = min(cands, key=lambda c: max(c[\"ext\"][0], c[\"ext\"][1]))\n    pool = [c for i, c in enumerate(cands) if i in ak_idx and c is not ramekin]\n    if not pool:\n        pool = [c for c in cands if c is not ramekin] or list(cands)\n    if ramekin is None:\n        return None, None\n    target = min(pool, key=lambda c: float(np.linalg.norm(c[\"c\"] - ramekin[\"c\"])))\n    return ramekin, target",
