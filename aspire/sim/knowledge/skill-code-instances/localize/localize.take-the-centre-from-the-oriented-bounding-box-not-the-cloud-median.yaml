  "code": "def obb_center_xy(pts):\n    \"\"\"Robust XY centre of a free-standing object from its silhouette.\n\n    The point-cloud median is not usable here: the depth-projected points are\n    much denser on the camera side, which pulls the median 2.3 cm off centre on\n    the bowl sitting on the cookie box.  The OBB centre (and the extent\n    midpoint of the upper z bands) agrees with the independent occlusion\n    evidence, so it is used for anything that has to be physically placed.\n    Falls back to the median if the OBB helper fails.\n    \"\"\"\n    try:\n        obb = get_oriented_bounding_box_from_3d_points(pts)\n        c = np.asarray(obb[\"center\"], dtype=float)\n        if np.all(np.isfinite(c)) and math.hypot(c[0], c[1]) < 3.0:\n            return (float(c[0]), float(c[1]))\n    except Exception:\n        pass\n    c = np.median(pts, axis=0)\n    return (float(c[0]), float(c[1]))",
