  "code": "def pick_on_stove(cands, stove, table_z=None):\n    \"\"\"The bowl resting on the stove: inside its footprint AND at its top height.\n\n    Falls back, in order, to (a) the lowest-base candidate that is clearly NOT on the\n    table (a raised support) when the stove could not be localized, and (b) the largest\n    candidate.  Every fallback is printed so a failure is visible in the trace.\n    \"\"\"\n    if not cands:\n        return None\n    if stove is not None:\n        lo, hi = stove[\"lo\"], stove[\"hi\"]\n        pool = [c for c in cands\n                if lo[0] - FOOT_PAD <= c[\"cx\"] <= hi[0] + FOOT_PAD\n                and lo[1] - FOOT_PAD <= c[\"cy\"] <= hi[1] + FOOT_PAD]\n        if pool:\n            return min(pool, key=lambda c: abs(c[\"base\"] - stove[\"top\"]))\n        print(\"  no bowl inside the stove footprint\", flush=True)\n    if table_z is not None:\n        raised = [c for c in cands if c[\"base\"] > table_z + 0.008]\n        if raised:\n            return min(raised, key=lambda c: c[\"base\"])\n    return max(cands, key=lambda c: c[\"n\"])",
