  "kind": "skill-code-instance",
  "observed_effect": "Localize the support the instruction names, then take the object whose centre lies INSIDE that support footprint AND whose base rests at the support top height. The two-test conjunction is load-bearing: the footprint test alone would accept any object that happens to sit there, and the abs(base - support_top) test alone would accept a small object resting on the table inside that footprint -- and would never accept the elevated decoy anyway. Use a slack pad (FOOT_PAD = 0.05) so an object hanging slightly over the support edge still counts; the decoys sat 0.16 m and 0.30 m outside the padded footprint on every seed. Fallback chain: footprint+height, then raised objects sorted by base, then largest cloud. Correct object on 15/15 seeds (printed target base z 0.026-0.027 vs the decoy 0.224, support top 0.020)",
