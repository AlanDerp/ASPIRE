  "code": "def bowl_candidates(rgb, d, K, E):\n    \"\"\"World geometry of every bowl-like object on the table, deduplicated.\n\n    Bowl shape gate: some depth (z-extent >= 3 cm), a diameter between 4.5 and\n    20 cm, and resting at table level.  Each candidate also carries the best\n    `black bowl` mask score of a mask sitting on the same spot, which is what\n    separates the two dark akita bowls from the lighter look-alike dish.\n    \"\"\"\n    black = [(float(m[\"score\"]), m[\"mask\"].astype(bool))\n             for m in segment_sam3_text_prompt(rgb, BLACK_PROMPT)]\n    cands = []\n    for p in BOWL_PROMPTS:\n        masks = segment_sam3_text_prompt(rgb, p)\n        if not masks:\n            continue\n        for m in sorted(masks, key=lambda x: -x[\"score\"])[:8]:\n            r, pts = obb_of(m[\"mask\"], d, K, E, min_pts=150)\n            if r is None:\n                continue\n            c, e = r\n            if not (0.030 <= e[2] <= 0.12):\n                continue\n            if not (0.045 <= min(e[0], e[1]) and max(e[0], e[1]) <= 0.20):\n                continue\n            if c[2] > 0.12:\n                continue\n            mk = m[\"mask\"].astype(bool)\n            if any(np.hypot(c[0] - o[\"c\"][0], c[1] - o[\"c\"][1]) < 0.05 for o in cands):\n                continue\n            bs = 0.0\n            for sc, bmask in black:\n                if bmask.shape == mk.shape and np.logical_and(bmask, mk).sum() \\\n                        > 0.5 * min(bmask.sum(), mk.sum()):\n                    bs = max(bs, sc)\n            cands.append({\"c\": c, \"e\": e, \"pts\": pts, \"mask\": mk, \"prompt\": p,\n                          \"score\": float(m[\"score\"]), \"black\": bs})\n    return cands\n\n\ndef black_class_pool(cands):\n    \"\"\"The akita-black-bowl class: the `black bowl` prompt separates the pair\n    (~0.81) from the lighter look-alike dish (~0.28); the measured diameter\n    (>= 9.5 cm against the dish's 8.5 cm) is the redundant back-up.\"\"\"\n    if not cands:\n        return []\n    best = max(c[\"black\"] for c in cands)\n    pool = [c for c in cands if c[\"black\"] >= BLACK_CLASS_FRAC * best] if best > 0.3 else []\n    if not pool:\n        big = [c for c in cands if max(c[\"e\"][0], c[\"e\"][1]) >= BIG_BOWL_DIAM]\n        pool = big if big else cands\n    return pool\n\n\ndef pick_target_bowl(cands, plate_xy):\n    \"\"\"Class first, then the spatial relation picks between the twins.\"\"\"\n    pool = black_class_pool(cands)\n    if not pool:\n        return None\n    for c in cands:\n        c[\"dist\"] = math.hypot(c[\"c\"][0] - plate_xy[0], c[\"c\"][1] - plate_xy[1])\n    pool = sorted(pool, key=lambda c: c[\"dist\"])\n    for c in cands:\n        print(f\"  cand c=({c['c'][0]:.3f},{c['c'][1]:.3f},{c['c'][2]:.3f}) \"\n              f\"diam={max(c['e'][0], c['e'][1]):.3f} z-ext={c['e'][2]:.3f} \"\n              f\"black={c['black']:.3f} dist={c['dist']:.3f} \"\n              f\"{'<-- TARGET' if c is pool[0] else ''} prompt={c['prompt']!r}\", flush=True)\n    return pool[0]",
