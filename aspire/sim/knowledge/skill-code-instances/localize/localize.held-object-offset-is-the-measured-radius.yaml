  "code": "def attempt(quat, tcp, place, plate_top, r_bowl, bx, by, b_lo, bw):\n    \"\"\"One pick-and-place attempt onto `place`.\n\n    Returns True if the bowl is verified resting on the plate, otherwise a\n    reason string: \"air\", \"slip\", \"unreachable\" or \"noplace\".\n    \"\"\"\n    tcp = np.asarray(tcp, dtype=float)\n    place = np.asarray(place, dtype=float)[:2]\n    open_gripper()\n    goto_pose(tcp + np.array([0.0, 0.0, 0.10]), quat)\n    goto_pose(tcp, quat)\n    gz = fingertip_z()\n    close_gripper()\n    width = gripper_width()\n    print(f\"  grasp tcp={np.round(tcp, 3).tolist()} fingertip_z={gz:.3f} width={width:.3f}\",\n          flush=True)\n    if width < AIR_GRASP_WIDTH:\n        # fingers met nothing: the pinch missed the bowl.  Retreat without\n        # disturbing the scene and let the caller try another orientation.\n        print(\"  air grasp\", flush=True)\n        retreat(tcp, quat, 0.25)\n        return \"air\"\n\n    # lift straight up - no lateral motion and no wrist rotation\n    goto_pose(tcp + np.array([0.0, 0.0, 0.06]), quat)\n    goto_pose(tcp + np.array([0.0, 0.0, 0.20]), quat)\n    if gripper_width() > width + SLIP_DELTA:\n        print(\"  bowl slipped out during lift\", flush=True)\n        retreat(tcp, quat)\n        return \"slip\"\n\n    rgb2, d2, K2, E2 = observe()\n    n_before = 0\n    if bw is not None:\n        n_before = int((np.hypot(bw[:, 0] - bx, bw[:, 1] - by) < 0.05).sum())\n    if still_on_table(rgb2, d2, K2, E2, (bx, by), b_lo, n_before):\n        print(\"  bowl still on table\", flush=True)\n        retreat(tcp, quat)\n        return \"slip\"\n    print(\"  bowl lifted\", flush=True)\n\n    # How far does the bowl hang from the tool centre point?  A radial pinch\n    # leaves the bowl offset by roughly one bowl radius, and that offset has to\n    # be undone when releasing: the *bowl*, not the wrist, must end up on the\n    # plate.  The offset is taken from the observation made just before the\n    # pinch - once the bowl is held, the gripper's own metal lands in the\n    # \"metal bowl\" mask and drags the measured centroid toward the wrist.\n    cur = tcp_xy()\n    off = np.clip(np.array([bx - tcp[0], by - tcp[1]]), -0.08, 0.08)\n    held = bowl_points(rgb2, d2, K2, E2, ref_xy=cur, radius=0.12)\n    if held is not None and len(held) >= 40:\n        hx, hy, _, _, _ = bowl_geometry(held)\n        print(f\"  carried-bowl centroid offset = ({hx - cur[0]:+.3f},{hy - cur[1]:+.3f})\"\n              f\" (mask contaminated by the gripper)\", flush=True)\n    print(f\"  bowl offset from tcp = ({off[0]:+.3f},{off[1]:+.3f})\", flush=True)\n    tcp_to_bottom = float(gz - b_lo)\n\n    # release the *bowl* over `place`: shift the TCP by the measured offset\n    release_xy = np.array([place[0] - off[0], place[1] - off[1]])\n    if not reachable([release_xy[0], release_xy[1], CARRY_Z], quat):\n        print(\"  release pose unreachable\", flush=True)\n        retreat(tcp, quat)\n        return \"unreachable\"\n\n    a = np.array([cur[0], cur[1], CARRY_Z])\n    b = np.array([release_xy[0], release_xy[1], CARRY_Z])\n    for f in [0.0, 0.33, 0.66, 1.0]:\n        goto_pose(a + f * (b - a), quat)\n        if gripper_width() > width + SLIP_DELTA:\n            print(\"  bowl slipped out during transport\", flush=True)\n            open_gripper()\n            goto_pose(np.array([release_xy[0], release_xy[1], CARRY_Z]), quat)\n            goto_home_joint_position()\n            return \"slip\"\n\n    for dz in [0.10, 0.02, 0.006]:\n        goto_pose(np.array([release_xy[0], release_xy[1], plate_top + tcp_to_bottom + dz]),\n                  quat)\n        if gripper_width() > width + SLIP_DELTA:\n            # the bowl has met the plate on the way down and the pinch has\n            # opened - stop descending on top of it and finish the release\n            print(\"  bowl touched down during descent\", flush=True)\n            break\n\n    open_gripper()\n    goto_pose(np.array([release_xy[0], release_xy[1], CARRY_Z]), quat)\n    for _ in range(5):\n        get_observation()\n\n    rgb3, d3, K3, E3 = observe()\n    if placed_on_plate(rgb3, d3, K3, E3, place, plate_top, r_bowl):\n        print(\"  PLACED ON PLATE\", flush=True)\n        return True\n    fin = bowl_points(rgb3, d3, K3, E3)\n    if fin is not None:\n        fc = np.median(fin, axis=0)\n        print(f\"  final bowl=({fc[0]:.3f},{fc[1]:.3f},{fc[2]:.3f}) \"\n              f\"dist_to_place={math.hypot(fc[0]-place[0], fc[1]-place[1]):.3f}\", flush=True)\n    print(\"  placement not confirmed\", flush=True)\n    return \"noplace\"",
