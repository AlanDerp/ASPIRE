  "code": "def bottle_candidates(rgb, dep, K, E):\n    \"\"\"Bottle-shaped SAM3 candidates grouped per physical object.\n\n    SAM3 returns the same bottle under several prompts and also returns partial\n    fragments of it (a cap, a shoulder).  Fragments are 2-3 cm from the whole\n    bottle's centroid while two distinct bottles are >5 cm apart, so the groups\n    are pruned largest-first with a 4 cm exclusion radius.\n    \"\"\"\n    groups = []\n    for prompt in (\"bottle\", \"sauce bottle\", \"sauce\", \"ketchup\"):\n        try:\n            masks = segment_sam3_text_prompt(rgb, prompt)\n        except Exception:\n            continue\n        for m in masks:\n            mk = np.asarray(m[\"mask\"]).astype(np.uint8)\n            if int(mk.sum()) < 250:\n                continue\n            pts = mask_to_world_points(mk, dep, K, E)\n            if pts is None or len(pts) < 250:\n                continue\n            zlo = float(np.percentile(pts[:, 2], 2))\n            zhi = float(np.percentile(pts[:, 2], 98))\n            h = zhi - zlo\n            if h < 0.06 or h > 0.24:                 # bottles are tall, not huge\n                continue\n            c = np.median(pts, axis=0)\n            if float(np.percentile(np.linalg.norm(pts[:, :2] - c[:2], axis=1), 98)) > 0.07:\n                continue                             # too fat to be a bottle\n            groups.append({\"xy\": c[:2].copy(), \"mask\": mk, \"pts\": pts,\n                           \"score\": float(m[\"score\"]), \"prompt\": prompt,\n                           \"zlo\": zlo, \"zhi\": zhi})\n    kept = []\n    for g in sorted(groups, key=lambda d: -int(d[\"mask\"].sum())):\n        if all(float(np.linalg.norm(g[\"xy\"] - k[\"xy\"])) > 0.040 for k in kept):\n            kept.append(g)\n    return kept",
