  "observed_effect": "Measured on 13 of 15 development seeds the stacked bowl bottom-z read -0.005 (table level) against +0.028 on the single natively clean seed. The clip restores the true centre and the true underside (3659 -> 2856 pts on seed 51) and is not an approximation because the real underside IS the support rim. Downstream symptoms that disappeared: a wall pinch aimed 1-2 cm off that shoved the bowl (seed 52 moved 0.434,0.212 to 0.403,0.286 on the first pinch) and a release 3.5 cm above the plate because tcp_to_bottom was derived from the too-low b_lo. After the clip every seed reads zlo = +0.027..+0.029 and the corrected sweep is 15/15. Anchor note: the executed clip is lines 717-727 of fix_code.py inside run(); run() is the only top-level boundary there so the instance code is the whole run() body.",
