  "code": "def run():\n    rgb, d, K, E = observe()\n\n    plate = localize_plate(rgb, d, K, E)\n    if plate is None:\n        print(\"PLATE NOT FOUND\", flush=True)\n        return\n    plate_top = float(np.percentile(plate[\"pts\"][:, 2], 90))\n    pcx, pcy = plate[\"cx\"], plate[\"cy\"]\n    r_plate = 0.5 * max(float(np.percentile(plate[\"pts\"][:, 0], 98) -\n                              np.percentile(plate[\"pts\"][:, 0], 2)),\n                        float(np.percentile(plate[\"pts\"][:, 1], 98) -\n                              np.percentile(plate[\"pts\"][:, 1], 2)))\n\n    cands = bowl_candidates(rgb, d, K, E)\n    print(f\"bowl-like candidates: {len(cands)}\", flush=True)\n    for c in cands:\n        print(f\"    c=({c['cx']:.3f},{c['cy']:.3f}) ext=({c['ext'][0]:.3f},{c['ext'][1]:.3f},\"\n              f\"{c['ext'][2]:.3f}) n={c['n']} score={c['score']:.3f} p={c['prompt']!r}\",\n              flush=True)\n    if len(cands) < 3:\n        print(\"TOO FEW BOWL-LIKE OBJECTS (need plate + ramekin + two bowls)\", flush=True)\n        return\n\n    # The ramekin is the smallest bowl-like object; the two black bowls are the\n    # larger, identical pair.\n    by_size = sorted(cands, key=lambda c: c[\"footprint\"])\n    ramekin = by_size[0]\n    # Table level, read off the scene itself: nothing here sinks below the table,\n    # so the lowest bottom-z of any candidate IS the table.\n    table_z = min([float(c[\"lo\"][2]) for c in cands] +\n                  [float(np.percentile(plate[\"pts\"][:, 2], 2))])\n    ramekin_top = float(np.percentile(ramekin[\"pts\"][:, 2], 90))\n    print(f\"plate=({pcx:.3f},{pcy:.3f}) top={plate_top:.3f} r_plate={r_plate:.3f}; \"\n          f\"ramekin=({ramekin['cx']:.3f},{ramekin['cy']:.3f}) fp={ramekin['footprint']:.3f} \"\n          f\"top={ramekin_top:.3f}; table_z={table_z:.3f}\", flush=True)\n\n    # --- measure the workspace wall that made the +x pinch's release land short\n    x_max = probe_reach_x(pcy, plate_top + PROBE_DZ)\n    print(f\"measured reach at (y={pcy:.3f}, z={plate_top + PROBE_DZ:.3f}): \"\n          f\"x_max={x_max:.3f}\", flush=True)\n\n    place_idx = 0\n    idx = 0\n    carries = 0\n    for n in range(MAX_ITERS):\n        # Re-observe and re-localize on EVERY attempt: after a failed release the\n        # bowl has moved (or tipped), and frozen candidates would send the next\n        # pinch to where the bowl used to be.\n        rgb, d, K, E = observe()\n        cs = bowl_candidates(rgb, d, K, E)\n        if len(cs) < 3:\n            print(f\"attempt {n}: only {len(cs)} bowl-like objects left\", flush=True)\n            break\n        by_size = sorted(cs, key=lambda c: c[\"footprint\"])\n        ramekin = by_size[0]\n        bowls = by_size[1:]\n        r_top = float(np.percentile(ramekin[\"pts\"][:, 2], 90))\n        goal, _ = pick_target_bowl(bowls, ramekin, r_top)\n        bx, by = goal[\"cx\"], goal[\"cy\"]\n        # --- Clip a STACKED bowl's cloud at the support's measured top --------\n        # SAM3's mask for the stacked bowl runs down THROUGH the ramekin (it is\n        # the same class of object) and out onto the table: measured zlo = -0.005\n        # on seeds 52-57, 59, 60 against zlo = +0.028 on seed 58 and +0.028 in\n        # the clean seed-51 observation.  Two things break when it bleeds:\n        #   * the in-plane median centre is dragged toward the ramekin/table\n        #     points, so the wall pinch is aimed a centimetre or two off and the\n        #     fingers land on the bowl and shove it (seed 52: bowl jumped\n        #     0.434,0.212 -> 0.403,0.286 after the first pinch);\n        #   * b_lo under-reports the underside by ~3.5 cm, so `tcp_to_bottom`\n        #     is ~3.5 cm too large and the release happens 3.5 cm ABOVE the\n        #     plate - the bowl is dropped instead of set down, and lands\n        #     0.030-0.041 m off (seeds 51, 56, 60) instead of 0.013-0.025 m.\n        # The bowl's real underside IS the ramekin's rim, so clipping there is\n        # not an approximation - it is the measurement.\n        sup = float(np.percentile(ramekin[\"pts\"][:, 2], 90))\n        d_ram = math.hypot(goal[\"cx\"] - ramekin[\"cx\"], goal[\"cy\"] - ramekin[\"cy\"])\n        bowl = goal[\"pts\"]\n        if d_ram < 0.09 and goal[\"lo\"][2] < sup - 0.004:\n            cut = bowl[bowl[:, 2] > sup - 0.004]\n            if len(cut) >= BOWL_MIN_PTS:\n                bowl = cut\n                print(f\"  stacked bowl: clipped cloud at support top {sup:.3f} \"\n                      f\"({len(goal['pts'])} -> {len(bowl)} pts)\", flush=True)\n        bx, by, lo, hi, bowl = cloud_geom(bowl)\n        b_lo, b_hi = float(lo[2]), float(hi[2])\n\n        def outer_radius(pts, z):\n            band = pts[np.abs(pts[:, 2] - z) < 0.010]\n            if len(band) < 15:\n                band = pts\n            return 0.5 * max(float(np.percentile(band[:, 0], 98) -\n                                   np.percentile(band[:, 0], 2)),\n                             float(np.percentile(band[:, 1], 98) -\n                                   np.percentile(band[:, 1], 2)))\n\n        zr = b_lo + 0.62 * (b_hi - b_lo)\n        zr_lo = b_lo + 0.35 * (b_hi - b_lo)\n        Rw = outer_radius(bowl, zr)\n        Rw_lo = outer_radius(bowl, zr_lo)\n        r_bowl = max(0.04, outer_radius(bowl, b_lo + 0.5 * (b_hi - b_lo)))\n        h_bowl = b_hi - b_lo\n        print(f\"attempt {n}: bowl=({bx:.3f},{by:.3f}) z=[{b_lo:.3f},{b_hi:.3f}] \"\n              f\"Rw={Rw:.3f} Rw_lo={Rw_lo:.3f} r_bowl={r_bowl:.3f}\", flush=True)\n\n        places = choose_places(world_cloud(d, K, E), pcx, pcy, plate_top,\n                               r_bowl + 0.006, h_bowl,\n                               tol=min(0.04, max(0.02, r_plate - r_bowl)))\n        if not places:\n            print(\"NO PLACE FOUND\", flush=True)\n            return\n\n        cands_g = candidates(bx, by, b_lo, b_hi, Rw, Rw_lo, zr, zr_lo, rgb, d, K, E)\n        place = places[min(place_idx, len(places) - 1)]\n        print(f\" release target=({place[0]:.3f},{place[1]:.3f})\", flush=True)\n        cands_g = order_candidates(cands_g, bx, by, place, x_max, Rw)\n        if idx >= len(cands_g):\n            print(\"NO CANDIDATES LEFT\", flush=True)\n            break\n        tag, q, tcp = cands_g[idx]\n        print(f\" try {tag} -> tcp={np.round(np.asarray(tcp), 3).tolist()}\", flush=True)\n        try:\n            res = attempt(q, tcp, place, plate_top, r_bowl, bx, by, b_lo, bowl)\n        except Exception as e:\n            print(f\"  {tag} failed: {type(e).__name__} {str(e)[:80]}\", flush=True)\n            try:\n                goto_home_joint_position()\n            except Exception:\n                pass\n            res = \"slip\"\n        if res is True:\n            print(\"SUCCESS\", flush=True)\n            return\n        idx += 1\n        if res == \"noplace\" or res == \"unreachable\":\n            place_idx += 1\n        if res != \"air\":\n            carries += 1\n            if carries >= MAX_CARRY_ATTEMPTS:\n                print(f\"carry budget spent ({carries})\", flush=True)\n                break\n    print(\"NO ATTEMPT SUCCEEDED\", flush=True)",
