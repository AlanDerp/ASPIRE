  "code": "def cap_signature(rgb, cand):\n    \"\"\"Colour of the candidate's cap band (top 25% of its mask rows).\"\"\"\n    mk = cand[\"mask\"] > 0\n    ys = np.where(mk.any(axis=1))[0]\n    y0, y1 = int(ys.min()), int(ys.max())\n    cut = y0 + int(0.25 * (y1 - y0)) + 1\n    cap = np.zeros_like(mk)\n    cap[y0:cut, :] = mk[y0:cut, :]\n    cpx = rgb[cap].astype(np.float64)\n    if len(cpx) < 30:\n        cand[\"cap_rgb\"] = None\n        cand[\"cap_green\"] = -999.0\n        return cand\n    med = np.median(cpx, axis=0)\n    cand[\"cap_rgb\"] = med\n    cand[\"cap_green\"] = float(med[1] - max(med[0], med[2]))\n    return cand",
