  "observed_effect": "Select the top 25 percent of the candidate mask's image rows (the cap band), take the median RGB of the ORIGINAL image over that band, and use the signed channel difference median(G) - max(median(R), median(B)). Because the descriptor is a difference of two channel medians over the candidate's own pixels, the scene's absolute lighting level cancels and there is no tuned constant beyond the admission threshold (CAP_GREEN_MIN = 12 grey levels). Measured: target +21.0 on all 15 development seeds against best sibling <= -1.0, a >= 22 grey-level margin with no seed within 20 of flipping. A negative probe forcing max(score) grasped the sibling at (0.497,-0.237) and placed it cleanly in the basket (release tcp [0.600,0.259,0.233] against a rim of 0.142, no error raised) yet scored 0.000 on seeds 51 and 52 - so the 0.000 is the goal predicate rejecting the wrong OBJECT, i.e. the task is genuinely identity-sensitive and this rank is what solves it. The region is selected by IMAGE ROW inside the mask, so it transfers across camera poses with no world-frame calibration. Keep the same-class geometry screen (tall and narrow) as the outer gate so a coloured non-bottle cannot win",
