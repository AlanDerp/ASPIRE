  "code": "def screen_candidates(rgb, dimg, K, E, prompts, max_per_prompt=3, verbose=False):\n    \"\"\"Ground each prompt, keep masks that look like a small object resting on the table.\"\"\"\n    out = []\n    for pi, prompt in enumerate(prompts):\n        try:\n            masks = segment_sam3_text_prompt(rgb, prompt)\n        except Exception as exc:  # noqa: BLE001\n            print(f\"  [sam3] {prompt!r} failed: {exc}\", flush=True)\n            continue\n        for m in sorted(masks, key=lambda x: -float(x[\"score\"]))[:max_per_prompt]:\n            pts = mask_to_world_points(m[\"mask\"].astype(np.uint8), dimg, K, E)\n            if pts is None or len(pts) < 40:\n                continue\n            obb = get_oriented_bounding_box_from_3d_points(pts)\n            centre = np.asarray(obb[\"center\"], float)\n            extent = np.asarray(obb[\"extent\"], float)\n            base = float(np.percentile(pts[:, 2], 2))\n            top = float(np.percentile(pts[:, 2], 98))\n            ys, xs = np.where(m[\"mask\"])\n            px = rgb[ys, xs].astype(float)\n            blue = float(px[:, 2].mean() - max(px[:, 0].mean(), px[:, 1].mean()))\n            if verbose:\n                print(f\"  [cand] {prompt!r} pi={pi} score={float(m['score']):.3f} \"\n                      f\"c={np.round(centre, 3).tolist()} ext={np.round(extent, 3).tolist()} \"\n                      f\"z=[{base:.3f},{top:.3f}] blue={blue:.1f} n={len(pts)}\", flush=True)\n            if top - base > 0.06 or top > 0.07 or float(np.max(extent)) > 0.16:\n                continue          # not a small flat object on the table\n            out.append(dict(prompt=prompt, pi=pi, score=float(m[\"score\"]), pts=pts, centre=centre,\n                            extent=extent, R=np.asarray(obb[\"R\"], float), blue=blue,\n                            top=top, base=base))\n    return out",
