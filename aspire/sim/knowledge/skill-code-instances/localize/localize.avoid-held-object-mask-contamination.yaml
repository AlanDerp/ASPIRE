  "code": "def bowl_points(rgb, d, K, E, ref_xy=None, radius=0.12):\n    \"\"\"World points of the metal bowl (optionally restricted near ref_xy).\"\"\"\n    for p in [\"metal bowl\", \"silver bowl\", \"bowl\"]:\n        masks = segment_sam3_text_prompt(rgb, p)\n        if not masks:\n            continue\n        for m in sorted(masks, key=lambda x: -x[\"score\"])[:3]:\n            pts = mask_to_world_points(m[\"mask\"].astype(np.uint8), d, K, E)\n            if pts is None or len(pts) < 40:\n                continue\n            if ref_xy is not None:\n                near = np.linalg.norm(pts[:, :2] - np.asarray(ref_xy), axis=1) < radius\n                if near.sum() < 40:\n                    continue\n                pts = pts[near]\n            return pts\n    return None",
