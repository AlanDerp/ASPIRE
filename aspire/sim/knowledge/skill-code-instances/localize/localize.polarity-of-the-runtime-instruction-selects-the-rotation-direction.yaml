  "code": "def stove_off_requested(text):\n    \"\"\"True when the runtime instruction asks for the off polarity.\n\n    The runtime string, not the identifier, is the only statement of the goal\n    in this suite.  A knob rotation is signed in the world frame (its axis is\n    vertical), so the instruction's polarity maps directly onto one direction:\n    off is clockwise (negative yaw), on is counter-clockwise.  Unrecognised\n    wording falls back to the off polarity, which is the payload this suite\n    currently dispatches for this identifier.\n    \"\"\"\n    words = set(\"\".join(c if c.isalpha() else \" \" for c in text.lower()).split())\n    if \"off\" in words:\n        return True\n    if \"on\" in words:\n        return False\n    return True\n\n\nSWEEP_SIGN = -1.0 if stove_off_requested(TASK_LANGUAGE) else 1.0\nprint(\"  goal polarity: off=%s -> sweep sign %+.0f\"\n      % (stove_off_requested(TASK_LANGUAGE), SWEEP_SIGN), flush=True)",
