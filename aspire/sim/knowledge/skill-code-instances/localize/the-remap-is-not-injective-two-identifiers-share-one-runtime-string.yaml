  "code": "def run():\n    lang = str(getattr(env.handle, \"task_language\", \"\") or \"\")\n    print(\"TASK_LANGUAGE: %r\" % lang, flush=True)\n    low = lang.lower()\n\n    mobj = re.search(r\"put the (.+?) (?:on top of|onto|on|in|into|inside) (?:the )?(.+?)\\s*$\", low)\n    if not mobj:\n        raise RuntimeError(\"unparsed task language: %r\" % lang)\n    obj_phrase = mobj.group(1).strip()\n    rel = \"in\" if re.search(r\"\\b(in|into|inside)\\b\", mobj.group(0)) else \"on\"\n    tgt_phrase = re.sub(r\"^(top of the|front of the)\\s*\", \"\", mobj.group(2).strip()).strip()\n    print(\"parsed: object=%r relation=%r target=%r\" % (obj_phrase, rel, tgt_phrase), flush=True)\n\n    obj_prompts = OBJ_PROMPTS.get(obj_phrase) or [obj_phrase, obj_phrase.split()[-1]]\n    tgt_prompts = TGT_PROMPTS.get(tgt_phrase) or [tgt_phrase, tgt_phrase.split()[-1]]",
