  "observed_effect": "Evidence: on libero_object_task/pick_up_the_salad_dressing_and_place_it_in_the_basket find_can_candidates runs EVERY prompt (loop at 158-196) and merges masks whose centroids are within 2.5 cm (198-201). Verified a NO-OP on this scene: both prompts agree, so the union produced the same exactly-2 groups on all 15 development seeds -- it ships as insurance for the held-out sweep, not as a repair, because a silent wrong-object pick costs the whole seed and the extra prompts cost perception only (no sim steps). Two ordering rules make the wider prompt set safe: screen before merging, so a larger but geometrically invalid mask cannot displace a good one by out-ranking it on point count; and keep the merge radius small BECAUSE the screen has already run -- 2.5 cm suffices here and the wider ~4 cm radius used on the ketchup scene is unnecessary once cap and shoulder fragments are rejected by the height gate",
