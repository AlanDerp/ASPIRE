  "code": "def is_trustworthy(cd, expect_z=None):\n    \"\"\"Does this segmentation really look like the bowl alone?\n\n    SAM3 keeps hallucinating the drawer bowl at its original location after it\n    has been picked up (measured: c=(0.727,-0.139) z_lo=0.159 score=0.95), and\n    while the bowl is carried it also returns phantom masks of the bowl at its\n    OLD resting place: measured c=(0.679,-0.028) z_lo=0.009 score=0.85 while\n    that bowl was gripped 4 cm higher - the score screen accepts it, and the\n    8 cm nudge it drives throws the bowl 4.5 cm past the plate.  A bowl that\n    is really there is a 3-9 cm tall object whose underside is above the\n    table top.\n    \"\"\"\n    if not (0.004 <= cd[\"z_lo\"] <= 0.42\n            and 0.025 <= (cd[\"z_hi\"] - cd[\"z_lo\"]) <= 0.090):\n        return False\n    if expect_z is not None:\n        # The bowl is in the fingers: its underside must be where the grip\n        # geometry puts it (tcp_z - bottom_gap).\n        return abs(cd[\"z_lo\"] - expect_z) <= 0.035\n    return cd[\"score\"] >= 0.30",
