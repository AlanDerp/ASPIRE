  "observed_effect": "Gate on PHYSICAL SANITY of the held object, not on confidence. Two checks: (a) an absolute plausibility band on the object underside z and its height (0.004 <= z_lo <= 0.42 and 0.025 <= z_hi - z_lo <= 0.090); (b) when the object is known to be clamped, its underside must be where THIS grip geometry puts it, abs(z_lo - (tcp_z - bottom_gap)) <= 0.035. CRITICAL ASYMMETRY: apply the depth check ONLY while the object is held, and leave the score-only path as the DEFAULT for free-space measurements -- an in-drawer or pre-grasp measurement can legitimately fall outside the expected-depth band, and applying the gate there REGRESSED seed 52 (offset went from [0.039,0.006] to [-0.008,0.024], wedging the descent at x=0.728). Rejected the phantom masks on seeds 51 and 56 (c=(0.680,-0.028) z_lo=0.009 score=0.86 REJECT), converting two silent 4 cm throws into honest misses while leaving the 12 passing seeds unchanged",
