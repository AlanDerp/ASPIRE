  "code": "def find_basket(rgb, depth, K, E):\n    \"\"\"Basket MOUTH centre from the top-rim percentile box (not the cloud median).\"\"\"\n    for prompt in BASKET_PROMPTS:\n        masks = segment_sam3_text_prompt(rgb, prompt)\n        if not masks:\n            continue\n        best = max(\n            masks[:10],\n            key=lambda m: (float(m[\"box\"][2]) - float(m[\"box\"][0]))\n            * (float(m[\"box\"][3]) - float(m[\"box\"][1])),\n        )\n        mask = np.asarray(best[\"mask\"]).astype(bool)\n        pts = mask_to_world_points(mask.astype(np.uint8), depth, K, E)\n        if pts is None or len(pts) < 300:\n            continue\n        zhi = float(np.percentile(pts[:, 2], 98))\n        rim = pts[pts[:, 2] > zhi - 0.02]\n        if len(rim) < 30:\n            continue\n        cx = 0.5 * (np.percentile(rim[:, 0], 5) + np.percentile(rim[:, 0], 95))\n        cy = 0.5 * (np.percentile(rim[:, 1], 5) + np.percentile(rim[:, 1], 95))\n        print(\n            f\"  basket prompt={prompt!r} score={float(best['score']):.3f} \"\n            f\"mouth=({cx:.3f},{cy:.3f}) rim_z={zhi:.3f} n={len(pts)}\",\n            flush=True,\n        )\n        return np.array([cx, cy]), zhi\n    return None, None",
