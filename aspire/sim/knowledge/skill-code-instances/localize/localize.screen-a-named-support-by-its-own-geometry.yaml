  "code": "def find_stove(rgb, d, K, E):\n    \"\"\"The stove: a low, wide, flat slab resting on the table.\n\n    The scene also answers `stove` with the 0.21 m-tall drawer cabinet (and with its own\n    burner disc), so the screen is what does the work: a slab is at most 10 cm tall, sits\n    at table level, and is at least 10 cm across.\n    \"\"\"\n    for prompt in STOVE_PROMPTS:\n        masks = segment_sam3_text_prompt(rgb, prompt)\n        if not masks:\n            continue\n        for m in sorted(masks, key=lambda x: -float(x[\"score\"]))[:6]:\n            pts = cloud(mask_to_world_points(\n                np.asarray(m[\"mask\"]).astype(np.uint8), d, K, E), min_pts=200)\n            if pts is None:\n                continue\n            lo = np.percentile(pts, 2, axis=0)\n            hi = np.percentile(pts, 98, axis=0)\n            w, dp, h = hi - lo\n            if h > 0.10:                    # the cabinet is 0.21 m tall\n                continue\n            if float(lo[2]) > 0.020:        # resting on the table\n                continue\n            if max(w, dp) < 0.10:           # a slab, not a fragment or the burner\n                continue\n            return dict(lo=lo, hi=hi, top=float(np.percentile(pts[:, 2], 95)),\n                        cx=float(0.5 * (lo[0] + hi[0])), cy=float(0.5 * (lo[1] + hi[1])),\n                        score=float(m[\"score\"]), prompt=prompt)\n    return None",
