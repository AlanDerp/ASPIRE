  "kind": "skill-code-instance",
  "observed_effect": "Screen the support candidates by THREE physical gates with measured margins rather than by score ranking: (1) height -- the support must be flat, h <= 0.10 (stove 0.028 vs cabinet 0.209); (2) base level -- it must rest on the table, base z <= 0.020 (stove -0.008 vs table -0.011); (3) width -- it must be a slab, max(w,dp) >= 0.10 (stove 0.176-0.182 vs the burner 0.090 which is a fragment not the support). Take the support TOP from the 95th percentile of its own points so downstream grasp height and release drop are computed from the support, not from the table. The gate triple, not the score ranking, is what makes the lookup deterministic: returned the true slab on 15/15 seeds and never selected the cabinet",
