  "code": "def pick_on_cabinet(cands, cabinet, table_z=None):\n    \"\"\"The bowl resting on the cabinet: inside its footprint AND at its top height.\n\n    Falls back, in order, to (a) the lowest-base candidate that is clearly NOT on the\n    table (a raised support) when the cabinet could not be localized, and (b) the\n    largest candidate.  Every fallback is printed so a failure is visible in the trace.\n    \"\"\"\n    if not cands:\n        return None\n    if cabinet is not None:\n        lo, hi = cabinet[\"lo\"], cabinet[\"hi\"]\n        pool = [c for c in cands\n                if lo[0] - FOOT_PAD <= c[\"cx\"] <= hi[0] + FOOT_PAD\n                and lo[1] - FOOT_PAD <= c[\"cy\"] <= hi[1] + FOOT_PAD]\n        if pool:\n            return min(pool, key=lambda c: abs(c[\"base\"] - cabinet[\"top\"]))\n        print(\"  no bowl inside the cabinet footprint\", flush=True)\n    if table_z is not None:\n        # The instruction names the TALL support (\"on the wooden cabinet\", 0.216 m), so if\n        # the cabinet lookup ever fails the raised candidate to keep is the HIGHEST one,\n        # not the lowest: on this scene the lowest raised candidate is the identical decoy\n        # bowl on the 0.020 m stove slab, i.e. `min` would hand back exactly the wrong\n        # object.  (The direction is task-specific - the sibling stove task's target IS the\n        # low bowl - so this fallback is written for the support this task names.)\n        raised = [c for c in cands if c[\"base\"] > table_z + 0.008]\n        if raised:\n            return max(raised, key=lambda c: c[\"base\"])\n    return max(cands, key=lambda c: c[\"n\"])",
