    "what_the_code_does_establish": "The localisation this instance records is validated by a strong internal consistency check that does not depend on reward. The baseline took the handle-bar centre from its visible bounding-box centre and read z = 0.0164 with z-extent 0.0546, because the 'handle' mask leaks downward onto the drawer face behind the bar; the true bar centre is 0.0420, so the baseline was aiming 2.6 cm low. Taking the front face instead (96th percentile of the mask cloud's y, centre set 8 mm behind it) returns all three drawer bars at 0.0419-0.0421 / 0.1107-0.1108 / 0.1839-0.1840 on all fifteen seeds of the single-revision sweep - a uniform 0.069 m pitch across three independently segmented bars, which is the object's own known spacing and therefore a self-check on the estimator.",
