  "code": "def _bar_from_points(pts, mask=None, check_shape=True, min_pts=150, max_pts=None):\n    \"\"\"Recognise a handle bar in a mask's world points: short cylinder along x.\n\n    `check_shape` is dropped for point-prompted masks, which are aimed at a specific\n    pixel: there the useful test is that the recovered bar sits at the hypothesised z,\n    not that the silhouette matches a cylinder (a point prompt often returns the bar\n    together with some of the drawer face behind it).  Such a mask must still be\n    bar-sized, so `max_pts` rejects the whole-cabinet masks a point prompt can return.\n    \"\"\"\n    if pts is None or len(pts) < min_pts:\n        return None\n    if max_pts is not None and len(pts) > max_pts:\n        return None\n    front_y = float(np.percentile(pts[:, 1], 96))       # the protruding front face\n    front = pts[pts[:, 1] > front_y - 0.008]\n    if len(front) < 40:\n        return None\n    x_lo, x_hi = np.percentile(pts[:, 0], [2, 98])\n    z_lo, z_hi = np.percentile(pts[:, 2], [2, 98])\n    if check_shape and not (BAR_LEN_BAND[0] < float(x_hi - x_lo) < BAR_LEN_BAND[1]):\n        return None\n    if check_shape and float(z_hi - z_lo) > BAR_Z_SPAN_MAX:\n        return None\n    return dict(c=np.array([float(np.median(front[:, 0])), front_y - 0.008,\n                            float(np.median(front[:, 2]))]),\n                front_y=front_y, n=int(len(pts)), mask=mask, _pts=pts)",
