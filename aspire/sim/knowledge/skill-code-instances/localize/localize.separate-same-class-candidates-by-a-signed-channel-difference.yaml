  "code": "def find_can_candidates(rgb, depth, K, E):\n    \"\"\"Can-shaped, table-resting candidates, each with a mask colour signature.\n\n    Product words do not ground on this scene ('alphabet soup' ~0.13) while the\n    packaging word 'can' grounds both cans at 0.90+, so the prompt only produces\n    candidates; identity comes from the label colour measured on the mask.\n    \"\"\"\n    cands = []\n    for prompt in CAN_PROMPTS:\n        masks = segment_sam3_text_prompt(rgb, prompt)\n        if not masks:\n            continue\n        for m in masks[:12]:\n            mask = np.asarray(m[\"mask\"]).astype(bool)\n            n = int(mask.sum())\n            if n < 150 or n > 9000:\n                continue\n            pts = mask_to_world_points(mask.astype(np.uint8), depth, K, E)\n            if pts is None or len(pts) < 100:\n                continue\n            zlo = float(np.percentile(pts[:, 2], 2))\n            zhi = float(np.percentile(pts[:, 2], 98))\n            # a can stands on the table, is short, and has vertical extent\n            if zlo > 0.045 or zhi > 0.15 or (zhi - zlo) < 0.03:\n                continue\n            obb = get_oriented_bounding_box_from_3d_points(pts)\n            ext = np.sort(np.asarray(obb[\"extent\"], dtype=np.float64))\n            if ext[2] > 0.14 or ext[0] < 0.025 or ext[1] < 0.025:\n                continue\n            px = rgb[mask].astype(np.float64)\n            if len(px) < 50:\n                continue\n            cands.append(\n                dict(\n                    prompt=prompt,\n                    score=float(m[\"score\"]),\n                    center=np.asarray(obb[\"center\"], dtype=np.float64),\n                    extent=ext,\n                    n=n,\n                    zlo=zlo,\n                    zhi=zhi,\n                    blue=float(px[:, 2].mean() - px[:, 0].mean()),\n                    red=float(px[:, 0].mean() - px[:, 2].mean()),\n                )\n            )\n        if cands:\n            break\n    merged = []                      # collapse the same can found under two prompts\n    for c in sorted(cands, key=lambda k: -k[\"n\"]):\n        if all(np.linalg.norm(c[\"center\"][:2] - m[\"center\"][:2]) > 0.025 for m in merged):\n            merged.append(c)\n    for c in merged:\n        print(\n            f\"  can cand: prompt={c['prompt']!r} score={c['score']:.3f} n={c['n']} \"\n            f\"c={np.round(c['center'], 3)} ext={np.round(c['extent'], 3)} \"\n            f\"blue={c['blue']:.1f} red={c['red']:.1f}\",\n            flush=True,\n        )\n    return merged",
