  "code": "def find_cans():\n    \"\"\"Can-shaped, table-resting candidates with their mask colour statistics.\n\n    A can is a *cylinder standing on the table*, so the screen is geometric and\n    threefold: a roughly circular footprint, a squat aspect, and a base on the\n    table surface (which rejects every fragment of a taller object - a carton's\n    top-face mask, the milk carton's upper half).\n    \"\"\"\n    o = get_observation()\n    rgb, dep, K, E = view(o)\n    found = []\n    for prompt in (\"tin can\", \"can\", \"soup can\", \"food can\"):\n        for m in segment_sam3_text_prompt(rgb, prompt) or []:\n            if float(m[\"score\"]) < 0.45:\n                continue\n            mask = np.asarray(m[\"mask\"]).astype(bool)\n            pts = mask_to_world_points(mask.astype(np.uint8), dep, K, E)\n            if pts is None:\n                continue\n            pts = pts[(pts[:, 2] > -0.02) & (pts[:, 2] < 0.14)]\n            if len(pts) < 300:\n                continue\n            lo = np.percentile(pts, 2, axis=0)\n            hi = np.percentile(pts, 98, axis=0)\n            width, depth, height = hi[0] - lo[0], hi[1] - lo[1], hi[2] - lo[2]\n            # footprint: a can is ~6 cm across in BOTH axes\n            if not (0.045 <= width <= 0.090 and 0.045 <= depth <= 0.090):\n                continue\n            # barrel: squat, not a carton or a bottle\n            if not (0.045 <= height <= 0.110):\n                continue\n            if min(width, depth) / max(width, depth) < 0.70:\n                continue\n            if height > 1.9 * max(width, depth):\n                continue\n            # resting on the table, not the top of a taller object\n            base = float(lo[2])\n            if base > 0.035:\n                continue\n            px = rgb[mask].astype(np.float64)\n            if len(px) < 50:\n                continue\n            found.append({\"cx\": float(0.5 * (lo[0] + hi[0])),\n                          \"cy\": float(0.5 * (lo[1] + hi[1])),\n                          \"base\": base, \"top\": float(hi[2]),\n                          \"score\": float(m[\"score\"]),\n                          \"warm\": float(px[:, 0].mean() - px[:, 2].mean()),\n                          \"n\": int(len(pts))})\n    keep = []\n    for f in sorted(found, key=lambda d: -d[\"n\"]):\n        if all(np.hypot(f[\"cx\"] - k[\"cx\"], f[\"cy\"] - k[\"cy\"]) > 0.035 for k in keep):\n            keep.append(f)\n    return keep",
