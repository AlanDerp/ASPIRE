  "code": "def bowl_inside_drawer(drawer_face):\n    \"\"\"True if the segmented bowl now sits behind the drawer front panel.\"\"\"\n    # the bowl is now up at drawer height, so the table-top z screen is lifted\n    pts = bowl_cloud(get_observation(), z_top=0.32)\n    if pts is None:\n        return False\n    c = pts.mean(axis=0)\n    _log(\"  verify bowl at\", np.round(c, 3).tolist(), \"face %.3f\" % drawer_face)\n    return bool(c[1] < drawer_face - 0.02 and c[2] > 0.08)",
