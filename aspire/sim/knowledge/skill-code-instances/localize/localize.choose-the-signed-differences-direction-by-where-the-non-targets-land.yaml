  "code": "def pick_candidate(cands, colour_hint=None, verbose=False):\n    \"\"\"Two stages: admit chromatic packaging, then rank by a signed channel difference.\n\n    On this task ``brown box`` ties the goal object and its look-alike at an *identical* score\n    (0.559/0.559, 0.617/0.617), so the prompt rank is not an identity signal at all and the\n    stable sort silently picked whichever mask SAM3 returned first.  The discriminator is the\n    packaging colour: the chocolate pudding's dark maroon box reads ``chroma`` -24 while the\n    bright orange box reads -48, no overlap on any development seed, so ``max(chroma)`` - i.e.\n    the darkest, least-orange chromatic candidate - is the pudding.  The saturation gate keeps\n    a bright neutral mask (basket liner, wall) from holding the extreme of the colour axis.\n    \"\"\"\n    if not cands:\n        return None\n    if colour_hint == \"blue\":\n        return sorted(cands, key=lambda c: (c[\"pi\"], -c[\"chroma\"], -c[\"score\"]))[0]\n    pool = [c for c in cands if c[\"sat\"] > SAT_MIN] or cands     # never rank an empty list\n    if verbose:\n        for c in pool:\n            print(f\"  [rank] pi={c['pi']} {c['prompt']!r} chroma={c['chroma']:.1f} \"\n                  f\"sat={c['sat']:.2f} score={c['score']:.3f} c={np.round(c['centre'], 3).tolist()}\",\n                  flush=True)\n    return sorted(pool, key=lambda c: (c[\"pi\"], -c[\"chroma\"], -c[\"score\"]))[0]",
