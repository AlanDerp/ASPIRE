  "code": "def warm_fraction(rgb, mask):\n    \"\"\"Fraction of the mask that is saturated red/orange (a warm label panel).\"\"\"\n    px = rgb[mask.astype(bool)].astype(np.float64)\n    if len(px) == 0:\n        return -999.0\n    return float(((px[:, 0] > 1.4 * px[:, 1]) & (px[:, 0] > 1.4 * px[:, 2])\n                  & (px[:, 0] > 90)).mean())\n\n\ndef cool_difference(rgb, mask):\n    \"\"\"Signed blue excess of the mask (blue minus the larger of red and green).\n\n    A *difference* of two means over the same pixels, so the scene's lighting\n    level cancels and there is no absolute constant to tune.\n    \"\"\"\n    px = rgb[mask.astype(bool)].astype(np.float64)\n    if len(px) == 0:\n        return -999.0\n    return float(px[:, 2].mean() - np.maximum(px[:, 0], px[:, 1]).mean())\n\n\ndef rank_score(rgb, mask):\n    \"\"\"Descriptor that carries no colour information -> the prompt score decides.\"\"\"\n    return 0.0\n\n\n# Identity registry keyed by the object the *runtime instruction* names (the file\n# name is a decoy on this suite). The prompt list makes the object's candidates\n# *appear* — the packaging word leads, because it is a far stronger visual token\n# than the product word — and the descriptor decides *which* candidate it is.\n# `admit` is an optional floor; when it rejects every candidate the ranking\n# degrades to the prompt score rather than to an unusable list.\nTARGET_SPEC = {\n    \"butter\": dict(prompts=[\"butter box\", \"butter\", \"box\", \"carton\"],\n                   descriptor=warm_fraction, admit=WARM_MIN),\n    \"cream cheese\": dict(prompts=[\"cream cheese box\", \"cream cheese\", \"box\", \"carton\"],\n                         descriptor=cool_difference, admit=None),\n}\nDEFAULT_SPEC = dict(prompts=[\"box\", \"carton\"], descriptor=rank_score, admit=None)",
