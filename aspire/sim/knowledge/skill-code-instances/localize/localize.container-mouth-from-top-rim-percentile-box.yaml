  "code": "def find_basket(rgb, d, K, E, relax=False):\n    \"\"\"Localize the basket mouth: dict(cx, cy, rim_z, span, n, prompt) or None.\"\"\"\n    h_min = 0.06 if relax else 0.09\n    for prompt in BASKET_PROMPTS:\n        masks = segment_sam3_text_prompt(rgb, prompt)\n        if not masks:\n            continue\n        for m in sorted(masks, key=lambda mm: -float(mm[\"score\"]))[:2]:\n            pts = mask_to_world_points(np.asarray(m[\"mask\"]).astype(np.uint8), d, K, E)\n            if pts is None or len(pts) < 1200:\n                continue\n            zlo = float(np.percentile(pts[:, 2], 2))\n            zhi = float(np.percentile(pts[:, 2], 98))\n            _, size = span_of(pts, 2.0, 98.0)\n            # a container: stands tall on the table and spans a wide footprint\n            if not (h_min < (zhi - zlo) < 0.30):\n                continue\n            if not (0.10 < max(size) < 0.32) or min(size) < 0.08:\n                continue\n            # the mouth centre is the xy midpoint of the basket's own top rim\n            rim = pts[pts[:, 2] > zhi - 0.030]\n            if len(rim) < 80:\n                continue\n            (cx, cy), _ = span_of(rim)\n            return {\"cx\": float(cx), \"cy\": float(cy), \"rim_z\": zhi, \"span\": size,\n                    \"n\": len(pts), \"prompt\": prompt}\n    return None",
