  "code": "def find_bbq(rgb, dep, K, E):\n    \"\"\"The bbq sauce bottle = the darkest, most saturated red-brown bottle.\"\"\"\n    groups = bottle_candidates(rgb, dep, K, E)\n    print(f\"  bottle-shaped objects: {len(groups)}\", flush=True)\n    for g in groups:\n        sig = mask_colour(rgb, g[\"union\"])\n        g[\"colour\"] = sig\n        if sig is None:\n            g[\"rank\"] = -9.0\n            continue\n        med, sat, val = sig\n        g[\"rank\"] = sat - val\n        print(f\"    at ({g['xy'][0]:.3f},{g['xy'][1]:.3f}) rgb={np.round(med,0).tolist()} \"\n              f\"sat={sat:.3f} val={val:.3f} rank={g['rank']:.3f}\", flush=True)\n    if not groups:\n        return None\n    best = max(groups, key=lambda g: g[\"rank\"])\n    if best[\"colour\"] is None or best[\"colour\"][1] < 0.85:\n        # appearance signature unavailable -> fall back to the prompt ranking\n        print(\"  colour screen inconclusive; falling back to prompt score\", flush=True)\n        best = max(groups, key=lambda g: g[\"best\"][\"score\"])\n    d = dict(best[\"best\"])\n    d[\"center\"] = np.median(d[\"pts\"], axis=0)\n    return d",
