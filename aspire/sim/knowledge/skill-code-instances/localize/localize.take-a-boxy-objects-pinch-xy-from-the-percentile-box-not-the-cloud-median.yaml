  "code": "def standing_candidates(rgb, dep, K, E, prompts):\n    \"\"\"Tall brick-shaped objects standing on the table, grouped per physical object.\n\n    SAM3 returns 200 masks for every prompt, so the score is the only ranking signal and\n    many of those masks are fragments or distractors.  Candidates are grouped by centroid\n    (fragments sit within a few cm of the whole object) and then screened geometrically.\n    \"\"\"\n    raw = []\n    for pi, prompt in enumerate(prompts):\n        try:\n            masks = segment_sam3_text_prompt(rgb, prompt)\n        except Exception as exc:\n            print(\"  [sam3] %r failed: %s\" % (prompt, exc), flush=True)\n            continue\n        for m in sorted(masks, key=lambda x: -float(x[\"score\"]))[:8]:\n            mk = np.asarray(m[\"mask\"]).astype(bool)\n            pts = mask_to_world_points(mk.astype(np.uint8), dep, K, E)\n            if pts is None or len(pts) < 200:\n                continue\n            xr = np.percentile(pts[:, 0], [2, 98])\n            yr = np.percentile(pts[:, 1], [2, 98])\n            zr = np.percentile(pts[:, 2], [2, 98])\n            raw.append({\"pi\": pi, \"prompt\": prompt, \"score\": float(m[\"score\"]), \"mask\": mk,\n                        \"cx\": float(0.5 * (xr[0] + xr[1])),\n                        \"cy\": float(0.5 * (yr[0] + yr[1]))})\n\n    groups = []\n    for k in sorted(raw, key=lambda d: -d[\"score\"]):\n        hit = None\n        for g in groups:\n            if np.hypot(k[\"cx\"] - g[\"cx\"], k[\"cy\"] - g[\"cy\"]) < 0.035:\n                hit = g\n                break\n        if hit is None:\n            groups.append({\"cx\": k[\"cx\"], \"cy\": k[\"cy\"], \"masks\": [k[\"mask\"]],\n                           \"score\": k[\"score\"], \"prompt\": k[\"prompt\"]})\n        else:\n            hit[\"masks\"].append(k[\"mask\"])\n            hit[\"score\"] = max(hit[\"score\"], k[\"score\"])\n\n    out = []\n    for g in groups:\n        union = np.zeros_like(g[\"masks\"][0])\n        for m in g[\"masks\"]:\n            union |= m\n        if int(union.sum()) < 200:\n            continue\n        pts = mask_to_world_points(union.astype(np.uint8), dep, K, E)\n        if pts is None or len(pts) < 200:\n            continue\n        xr = np.percentile(pts[:, 0], [2, 98])\n        yr = np.percentile(pts[:, 1], [2, 98])\n        fx = float(xr[1] - xr[0])\n        fy = float(yr[1] - yr[0])\n        bot = float(np.percentile(pts[:, 2], 2))\n        top = float(np.percentile(pts[:, 2], 98))\n        h = top - bot\n        feat = mask_features(rgb, union)\n        if feat is None:\n            continue\n        # The pinch xy is the percentile-BOX midpoint, not the point-cloud median: a\n        # single view sees only the camera-facing faces, so the median of the back-\n        # projected cloud sits ~1.3 cm toward the camera on this 2.7 cm-deep carton --\n        # half its width, which is enough to make the pads close on air beside it.\n        out.append({\"cx\": float(0.5 * (xr[0] + xr[1])),\n                    \"cy\": float(0.5 * (yr[0] + yr[1])),\n                    \"bot\": bot, \"top\": top, \"h\": h, \"fx\": fx, \"fy\": fy,\n                    \"score\": float(g[\"score\"]), \"prompt\": g[\"prompt\"], **feat})\n    return out",
