  "code": "def find_pudding(rgb, d, K, E, relax=False):\n    \"\"\"Localize the pudding: dict(center, top_z, base_z, top_pts, prompt) or None.\"\"\"\n    z_max = 0.11 if relax else 0.060              # lifted screen for a moved object\n    size_max = 0.16 if relax else 0.13\n    prompts = PUD_PROMPTS if relax else PUD_PROMPTS[:2]\n    for prompt in prompts:\n        masks = segment_sam3_text_prompt(rgb, prompt)\n        if not masks:\n            continue\n        cand = None\n        for m in sorted(masks, key=lambda mm: -float(mm[\"score\"]))[:MAX_CAND]:\n            pts = mask_to_world_points(np.asarray(m[\"mask\"]).astype(np.uint8), d, K, E)\n            if pts is None or len(pts) < 120:\n                continue\n            zlo = float(np.percentile(pts[:, 2], 2))\n            zhi = float(np.percentile(pts[:, 2], 98))\n            _, size = span_of(pts, 2.0, 98.0)\n            # on the table, flat, and small - rejects the juice carton and the basket\n            if zhi > z_max or not (0.012 < (zhi - zlo) < 0.060):\n                continue\n            if max(size) > size_max:\n                continue\n            # the top face is the flat upper part of the cloud and carries the footprint\n            top = pts[pts[:, 2] > zhi - 0.012]\n            if len(top) < 60:\n                continue\n            c, tsp = span_of(top)\n            if max(tsp) > 0.5 * size_max + 0.04 or len(top) < 0.10 * len(pts):\n                continue\n            score = float(m[\"score\"])\n            if cand is None or score > cand[\"score\"]:\n                cand = {\"score\": score, \"center\": c, \"top_z\": zhi, \"base_z\": zlo,\n                        \"pts\": pts, \"top_pts\": top, \"prompt\": prompt}\n        if cand is not None:\n            return cand\n    return None",
