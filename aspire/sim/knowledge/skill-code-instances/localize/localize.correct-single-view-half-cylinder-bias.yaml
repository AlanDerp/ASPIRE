  "code": "def bottle_axis(pts, E, zlo, zhi):\n    \"\"\"Axis (xy) of the bottle, corrected for the single-view half-cylinder bias.\n\n    The visible-surface centroid of a rounded body sits ~0.64 r toward the\n    camera, so push the estimate back by that much along the view ray.\n    \"\"\"\n    gz = zlo + 0.38 * (zhi - zlo)\n    sel = np.abs(pts[:, 2] - gz) < 0.020\n    if sel.sum() < 25:\n        sel = np.abs(pts[:, 2] - gz) < 0.035\n    if sel.sum() < 10:\n        return np.array([np.median(pts[:, 0]), np.median(pts[:, 1]), gz]), 0.025\n    slab = pts[sel]\n    u, v, w = E[:3, 0], E[:3, 1], E[:3, 2]\n    r = 0.5 * max(float((slab @ u).max() - (slab @ u).min()),\n                  float((slab @ v).max() - (slab @ v).min()))\n    r = float(np.clip(r, 0.012, 0.045))\n    axis = slab.mean(axis=0) - 0.64 * r * (-w)\n    axis[2] = gz\n    return axis, r",
