  "code": "def cabinet_top(rgb, d, K, E):\n    cab = localize(rgb, d, K, E, CAB_PROMPTS)\n    if cab is None:\n        return None\n    cp = cab[\"pts\"]\n    zs = cp[:, 2]\n    hist, edges = np.histogram(zs, bins=50)\n    lo = len(hist) // 3\n    idx = int(np.argmax(hist[lo:])) + lo        # densest upper z plateau\n    z_bin = 0.5 * (edges[idx] + edges[idx + 1])\n    sel = np.abs(zs - z_bin) < 0.02\n    if sel.sum() < 20:\n        sel = zs >= np.percentile(zs, 90)\n    top = cp[sel]\n    return {\"z\": float(np.median(top[:, 2])),\n            \"x\": 0.5 * (np.percentile(top[:, 0], 5) + np.percentile(top[:, 0], 95)),\n            \"y\": 0.5 * (np.percentile(top[:, 1], 5) + np.percentile(top[:, 1], 95)),\n            \"n\": len(top), \"prompt\": cab[\"prompt\"], \"score\": cab[\"score\"]}",
