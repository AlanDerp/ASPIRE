  "code": "def mask_features(rgb, mk):\n    \"\"\"White-label content and warm-pixel fraction of a boolean mask.\"\"\"\n    ys, xs = np.where(mk)\n    if len(ys) < 100:\n        return None\n    px = rgb[ys, xs].astype(np.float64)\n    white = float((px.min(axis=1) > 120).mean())\n    warm = float((px[:, 0] - px[:, 2] > 20).mean())\n    return {\"white\": white, \"warm\": warm, \"n\": int(len(ys)),\n            \"rgb\": tuple(float(v) for v in px.mean(axis=0))}",
