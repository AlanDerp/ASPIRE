  "code": "def find_basket(rgb, di, K, E):\n    for prompt in (\"basket\", \"wicker basket\", \"woven basket\"):\n        for m in safe_segment(rgb, prompt)[:3]:\n            if float(m[\"score\"]) < 0.3:\n                continue\n            pts = mask_to_world_points(m[\"mask\"].astype(np.uint8), di, K, E)\n            if pts is None or len(pts) < 500:\n                continue\n            z = pts[:, 2]\n            zlo, zhi = float(np.percentile(z, 2)), float(np.percentile(z, 98))\n            if zhi - zlo < 0.06:\n                continue\n            rim = pts[z > zlo + 0.85 * (zhi - zlo)]\n            if len(rim) < 200:\n                continue\n            # Mouth axis = midpoint of the rim ring's extent.  The rim point\n            # mean/median is biased toward the camera-facing wall, whose points\n            # are denser: on seed 51 the two differ by 2.1 cm.\n            xlo, xhi = np.percentile(rim[:, 0], [2, 98])\n            ylo, yhi = np.percentile(rim[:, 1], [2, 98])\n            return dict(mouth=np.array([0.5 * (xlo + xhi), 0.5 * (ylo + yhi)]),\n                        rim_z=float(np.percentile(rim[:, 2], 50)),\n                        xspan=float(xhi - xlo), yspan=float(yhi - ylo),\n                        score=float(m[\"score\"]), prompt=prompt)\n    return None",
