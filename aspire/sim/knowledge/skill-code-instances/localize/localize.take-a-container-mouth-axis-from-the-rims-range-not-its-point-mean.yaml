  "kind": "skill-code-instance",
  "observed_effect": "On seed 51 the rim point median gives x = 0.621 and the 2/98 percentile midpoint gives x = 0.599 - a 2.1 cm difference against a 0.151 m mouth, which is the whole placement tolerance. The shipped program takes the top ~15% z-band of the container cloud as the rim, then the 2/98 percentile midpoint on each horizontal axis, and uses the span as the tolerance; the span (0.151 x 0.165 m) was stable to 1 mm across all 15 dev seeds",
