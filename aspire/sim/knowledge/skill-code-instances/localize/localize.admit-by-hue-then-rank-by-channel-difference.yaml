  "code": "def pick_milk(cands):\n    \"\"\"The milk brick: warm packaging that is NOT fully-saturated orange.\n\n    Admit red/orange packaging (R - B > 20), which rejects the bright grey mask\n    SAM3 also puts on the basket liner, then take the largest B - R -- the brick\n    with white on its label rather than the near-fully-saturated juice brick.\n    \"\"\"\n    if not cands:\n        return None\n    for c in cands:\n        print(\"  carton cand c=(%.3f,%.3f) bot=%.3f top=%.3f n=%d score=%.3f \"\n              \"R=%.1f B=%.1f R-B=%.1f B-R=%.1f white=%.3f\"\n              % (c[\"cx\"], c[\"cy\"], c[\"bot\"], c[\"top\"], c[\"n\"], c[\"score\"],\n                 c[\"R\"], c[\"B\"], c[\"R\"] - c[\"B\"], c[\"B\"] - c[\"R\"], c[\"white\"]),\n              flush=True)\n    warm = [c for c in cands if c[\"R\"] - c[\"B\"] > WARM_MIN]\n    pool = warm if warm else cands\n    return max(pool, key=lambda c: c[\"B\"] - c[\"R\"])",
