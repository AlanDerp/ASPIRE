  "code": "def find_basket(rgb, depth, K, E):\n    \"\"\"Container: rim = 98th pct z; mouth centre = midpoint of the top-rim footprint.\"\"\"\n    best = None\n    for p in [\"basket\", \"wicker basket\", \"woven basket\"]:\n        masks = segment_sam3_text_prompt(rgb, p)\n        print(\"    basket prompt %-14s num_masks=%d\" % (p, len(masks)), flush=True)\n        for m in sorted(masks, key=lambda d: -d[\"score\"])[:6]:\n            mk = np.asarray(m[\"mask\"]) > 0\n            n = int(mk.sum())\n            if n < 2500 or n > 20000:\n                continue\n            pts = see(rgb, depth, K, E, mk)\n            if pts.shape[0] < 1500:\n                continue\n            zlo = float(np.percentile(pts[:, 2], 2))\n            zhi = float(np.percentile(pts[:, 2], 98))\n            h = zhi - zlo\n            if h < 0.060 or zhi < 0.09:\n                continue\n            rim_pts = pts[pts[:, 2] > zlo + 0.55 * h]\n            if rim_pts.shape[0] < 40:\n                rim_pts = pts\n            fx = np.percentile(rim_pts[:, 0], [1, 99])\n            fy = np.percentile(rim_pts[:, 1], [1, 99])\n            cand = dict(prompt=p, score=float(m[\"score\"]), n=n, zlo=zlo, zhi=zhi, h=h,\n                        rim=zhi, mx=0.5 * (fx[0] + fx[1]), my=0.5 * (fy[0] + fy[1]),\n                        wid=float(fx[1] - fx[0]), dep=float(fy[1] - fy[0]))\n            print(\"      basket cand prompt=%-10s score=%.3f n=%5d zlo=%.3f zhi=%.3f \"\n                  \"mouth=(%.3f,%.3f) fp=%.3f x %.3f\"\n                  % (p, cand[\"score\"], n, zlo, zhi, cand[\"mx\"], cand[\"my\"],\n                     cand[\"wid\"], cand[\"dep\"]), flush=True)\n            if best is None or cand[\"rim\"] > best[\"rim\"]:\n                best = cand\n    return best",
