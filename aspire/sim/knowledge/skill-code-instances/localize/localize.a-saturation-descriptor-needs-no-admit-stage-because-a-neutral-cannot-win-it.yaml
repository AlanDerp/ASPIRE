  "code": "def mask_colour(rgb, mask):\n    \"\"\"Median body colour -> (sat, val, signed descriptor).\"\"\"\n    px = rgb[mask > 0].astype(np.float64)\n    if len(px) < 50:\n        return None\n    med = np.median(px, axis=0)\n    mx = float(med.max())\n    if mx <= 1e-6:\n        return None\n    sat = (mx - float(med.min())) / mx\n    val = mx / 255.0\n    return dict(med=med, sat=sat, val=val, desc=sat - val)",
