  "code": "def select_target(rgb, d, K, E, anchor=None):\n    \"\"\"Locate the bowl named by the language.\n\n    First pick: the bowl closest to the cookie box (the language's relation -\n    at seed 51 that is the bowl touching the box at 0.086 m against 0.175 m for\n    its look-alike).  Afterwards: the bowl closest to `anchor`, the position\n    where the target was last measured.  The anchor is what keeps hold of the\n    SAME bowl - once the target has been carried away from the box the relation\n    itself flips to the other bowl, so re-deriving identity from the box after\n    a failed attempt grabs the wrong one.\n    \"\"\"\n    cont = find_containers(rgb, d, K, E)\n    if not cont:\n        return None, None\n    if anchor is not None:\n        cont.sort(key=lambda c: math.hypot(c[1][0] - anchor[0], c[1][1] - anchor[1]))\n        d0 = math.hypot(cont[0][1][0] - anchor[0], cont[0][1][1] - anchor[1])\n        if d0 < 0.30:\n            print(f\"  target locked to anchor ({anchor[0]:.3f},{anchor[1]:.3f}) \"\n                  f\"-> ({cont[0][1][0]:.3f},{cont[0][1][1]:.3f}) d={d0:.3f}\", flush=True)\n            return cont[0], None\n        print(f\"  anchor lost (nearest {d0:.3f}); re-deriving from the box\", flush=True)\n    box = find_box(rgb, d, K, E)\n    if box is None:\n        print(\"  WARNING: cookie box not found; using the first container\", flush=True)\n        return cont[0], box\n    cont.sort(key=lambda c: math.hypot(c[1][0] - box[0], c[1][1] - box[1]))\n    for i, c in enumerate(cont):\n        print(f\"  container[{i}] prompt={c[2]!r} xy=({c[1][0]:.3f},{c[1][1]:.3f}) \"\n              f\"dist_to_box={math.hypot(c[1][0]-box[0], c[1][1]-box[1]):.3f}\", flush=True)\n    return cont[0], box",
