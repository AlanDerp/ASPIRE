  "observed_effect": "The claim is verified in the API source, not inferred: cap/integrations/franka/libero_reduced.py:383 is 'pos = np.clip(pos, [-0.1, -0.5, 0.005], [0.75, 0.5, 0.9])', so commanded x is capped at 0.75 and commanded z floored at 0.005 for EVERY task; cap/integrations/franka/common.py:29 is 'DEFAULT_TCP_OFFSET = np.array([0.0, 0.0, -0.107])', which is where the empirically measured 0.107 hand-to-TCP offset on the chocolate-pudding task actually comes from -- an API constant, not a per-task measurement. solve_ik also retries a four-step orientation ladder (requested -> top-down -> 45-tilt -> side-approach, libero_reduced.py:389-400) and returns on the first that converges, logging only a warning, so a successful solve_ik does NOT mean the requested orientation was honoured. Evidence for the clamp reading: the butter sits at x 0.708-0.717, inside the clamp, and a plain top-down command reaches it with gap after close 0.0388-0.0392 on all 15 seeds and no tilt; the sibling chocolate-pudding task's object sat at x 0.763 > 0.75 and needed a wrist-tilt ladder",
