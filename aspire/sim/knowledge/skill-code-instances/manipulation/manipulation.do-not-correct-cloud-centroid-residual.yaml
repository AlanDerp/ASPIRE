  "code": "def placed_on_plate(rgb, d, K, E, place_xy, plate_top, r_bowl):\n    \"\"\"Strict placement check: bowl points near the goal XY *and* resting at the\n    plate surface height.  A bowl still held in the gripper fails the height\n    test; a bowl left on the table beside the plate fails the XY test.\"\"\"\n    pts = bowl_points(rgb, d, K, E, ref_xy=place_xy, radius=max(0.07, r_bowl + 0.04))\n    if pts is None:\n        return False\n    c = np.median(pts, axis=0)\n    zlo = float(np.percentile(pts[:, 2], 2))\n    dist = math.hypot(c[0] - place_xy[0], c[1] - place_xy[1])\n    print(f\"  place check n={len(pts)} centre=({c[0]:.3f},{c[1]:.3f},{c[2]:.3f}) \"\n          f\"z2={zlo:.3f} dist={dist:.3f} (plate_top={plate_top:.3f})\", flush=True)\n    return dist < PLACE_TOL and (plate_top - 0.03) < zlo < (plate_top + 0.07)",
