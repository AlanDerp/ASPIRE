  "code": "def open_top_drawer():\n    \"\"\"Grasp the top handle bar and pull the drawer open.\"\"\"\n    obs = get_observation()\n    bar = find_top_handle(obs)\n    if bar is None:\n        return\n    x_bar, y_bar, z_bar = bar\n    open_gripper()\n    move_tcp([x_bar, y_bar + 0.12, z_bar], SIDE_QUAT, axis=SIDE_AXIS)\n    move_tcp([x_bar, y_bar - 0.008, z_bar], SIDE_QUAT, axis=SIDE_AXIS)\n    close_gripper()\n    _log(\"open grip %.4f\" % _gap())\n    # closed-loop, incremental pulls: a single raw goto_pose leaves the drawer\n    # only partly open when the IK falls short of the commanded pose\n    for dy in (0.05, 0.12, 0.17):\n        move_tcp([x_bar, y_bar - 0.008 + dy, z_bar], SIDE_QUAT, iters=3, axis=SIDE_AXIS)\n        front = drawer_front(get_observation())\n        _log(\"  pull to +%.2f front\" % dy, None if front is None else [round(v, 3) for v in front])\n        if front is not None and front[1] > -0.045:      # already well out\n            break\n    open_gripper()\n    # straight up: the home motion drags the open drawer back in\n    try:\n        move_tcp([x_bar, y_bar + 0.16, z_bar + 0.26], SIDE_QUAT, iters=3, axis=SIDE_AXIS)\n    except Exception:\n        pass",
