  "observed_effect": "Ladder every long Cartesian move in MEASURED-TCP space with a step size inside a realised bracket. Two measured facts bound the hop size. (1) Below the bracket a command is not executed at all: 0.020 m moved the TCP only 0.0079 m, 0.045 -> 0.033, 0.10 -> 0.10, so USE 0.05-0.12 m commands. This is the counterpart to the widely-quoted <=30 mm hopping rule: small hops are safe only because you re-measure every hop, and a ladder built from tiny commands crawls or exhausts the episode. (2) Stop on lack of progress TOWARD THE TARGET, not on raw motion: at a kinematic limit the arm oscillates +-3 mm, so every hop still 'moves' ~0.0065 m and a did-it-move test never fires. The budget is finite too: ~4000 control steps ~= 108 hops of ~37 steps each. Evidence: hops per trial 109 -> 32-39, the two Truncated:True seeds (51, 52) became normal terminations, 15/15 dev seeds pass. The pre-fix single 0.5 m lunge from home stalled ~25 cm short, which killed 10/15 dev seeds",
