  "code": "def hop_to(px, py, pz, q, step=0.100, eps=0.008, budget=14, stall=2):\n    \"\"\"Ladder a Cartesian move in measured-TCP space, <=`step` per command.\n\n    Two measured facts from the traces drive this:\n      * A SMALL commanded step is not realised.  Commanding 0.020 m moved the measured TCP\n        only 0.0079 m per hop (the joint controller stops inside its 0.01 rad tolerance),\n        so the 0.16 m descent to the pinch burned 24 hops; a 0.045 m command realised\n        0.033 m and a 0.10 m command realised the full 0.10 m.  Big steps, few hops.\n      * Stop on lack of progress TOWARD the target, not on raw motion.  At a kinematic\n        limit the arm oscillates +-3 mm between two IK branches: each hop still moves\n        ~0.0065 m, so a \"did it move\" test never fires (seed-51 trace: 13 hops and 18 s\n        spent hovering at tcp z = 0.224).  Distance-to-target shrinking by <2 mm for two\n        consecutive hops is the real stall.\n\n    The episode step budget is also finite (~4000 control steps ~= 108 hops of ~37 steps\n    each): 109 hops truncated the episode and the trial scored 0 however good the motion\n    was.  Keep the ladder short.\n    \"\"\"\n    tgt = np.array([px, py, pz], dtype=np.float64)\n    c = tcp()\n    dn = float(np.linalg.norm(tgt - c))\n    bad = 0\n    for _ in range(budget):\n        if dn <= eps:\n            break\n        goto_pose(c + (tgt - c) * (min(step, dn) / dn), q)\n        HOPS[0] += 1\n        c = tcp()\n        n2 = float(np.linalg.norm(tgt - c))\n        if dn - n2 < 0.002:\n            bad += 1\n            if bad >= stall:\n                break\n        else:\n            bad = 0\n        dn = n2\n    return c",
