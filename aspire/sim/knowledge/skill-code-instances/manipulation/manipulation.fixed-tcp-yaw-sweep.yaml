  "code": "def sweep(tx, ty, gz, yaw0, direction):\n    \"\"\"Sweep the wrist about the vertical axis, tool centre point fixed.\"\"\"\n    swept = 0.0\n    misses = 0\n    while swept < SWEEP_DEG:\n        swept += SWEEP_STEP\n        try:\n            goto_pose(np.array([tx, ty, gz]), topdown(yaw0 + direction * swept))\n        except Exception as exc:                # noqa: BLE001 - IK branch miss\n            misses += 1\n            print(\"    sweep step %.0f deg failed: %s\" % (swept, exc), flush=True)\n            if misses >= 4:\n                break\n            continue\n        misses = 0\n    print(\"  swept %.0f deg (dir %+.0f), gap %.4f\" % (swept, direction, gap()), flush=True)\n    return swept",
