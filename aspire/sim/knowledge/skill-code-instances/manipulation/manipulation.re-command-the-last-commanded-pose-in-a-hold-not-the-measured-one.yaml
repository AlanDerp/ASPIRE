  "code": "_CMD = {\"p\": None}\n\n\ndef go(p, quat):\n    \"\"\"Every Cartesian command goes through here, so the last COMMANDED grip-site\n    pose is always known.  `settle` needs it: holding a pose by re-commanding the\n    MEASURED one is a closed loop through a servo that overshoots, so every hold\n    ratchets the tool a few mm and the release height drifts with the number of\n    holds (measured on seed 53: +3 mm with two holds, +11 mm with three -- and 11 mm\n    is the difference between landing on the plate and dropping onto it).\"\"\"\n    p = np.asarray(p, dtype=np.float64).copy()\n    _CMD[\"p\"] = p\n    goto_pose(p, quat)\n    return p\n\n\ndef settle(quat, repeats=2):\n    \"\"\"A redundant re-command at the SAME pose buys sim time; an observation does not.\n    The re-command must be (a) expressed in the grip-site frame, or each call lifts the\n    tool by GZ, and (b) the last COMMANDED pose, or each call ratchets the tool.\"\"\"\n    for _ in range(repeats):\n        p = _CMD[\"p\"]\n        if p is None:                      # nothing commanded yet: hold what we measure\n            cur = tcp()\n            p = np.array([float(cur[0]), float(cur[1]), float(cur[2]) - GZ])\n        go(p, quat)\n        _charge(\"pose\")",
