  "observed_effect": "A hold that reads the tool pose back and re-commands it is a closed loop through a joint servo that lands short of its own target, so every redundant hold moves the tool and the payload is released from a height that depends on how many holds happened to run -- invisible, because the trace reports the ACHIEVED height as if it were the commanded one. Measured on the same descent and payload, varying only the number of post-release holds: release at gripz=0.053 (cmd 0.049, +4 mm, passed), then gripz=0.062 (cmd 0.051, +11 mm, failed), then gripz=0.053 (cmd 0.051, +2 mm, passed). Eleven millimetres above a 12 cm plate is a drop, not a placement. The candidate fix in this instance routes EVERY Cartesian command through go(p, quat), which records the commanded grip-site pose in _CMD, and has settle() re-command _CMD[p]; before anything is commanded it falls back to the measured pose converted once into grip-site space (tcp()[2] - GZ); goto_home_joint_position() invalidates _CMD. Result: holds become idempotent with respect to the hold -- the release lands within 0-2 mm of its command on seeds 51/53/58/62 and after-release equals release. HONEST COST, MEASURED: this variant is NOT an outcome win. Two full 15-seed dev sweeps of each variant -- 4 draws in total -- gave the commanded-pose variant 13/15 and 10/15 (23/30) against the shipped measured-pose variant 14/15 and 12/15 (26/30). It wins the seed whose failure the ratchet explains (seed 53: 1 of 2 draws vs 0 of 2) and loses seed 59 outright (0,0 vs 1,1) plus one draw of seed 56. Plausible reason: a hold that re-asserts a COMMAND keeps driving the tool toward it, so where the command itself is slightly wrong -- and the release command is rest_z + measured hang + drop, derived from a measurement -- the servo shortfall that the measured-pose hold accidentally absorbed is gone. Neither number is separated from the noise this task has (identical code scored between 10 and 14 over four draws; seeds 53/55/56/59/64 each flip in at least one draw). CONCLUSION: prefer the commanded pose when you need holds to be COUNTABLE or when the command is known-good; do not adopt it expecting a score gain. This instance CORRECTS transport.pass-sim-time-with-a-command-not-an-observation (whose settle is the measured-pose form) on the ratchet, while declining to correct the episode-level recommendation in the other direction. development_outcomes.successes lists the 13 seeds that passed in the first of the two draws.",
