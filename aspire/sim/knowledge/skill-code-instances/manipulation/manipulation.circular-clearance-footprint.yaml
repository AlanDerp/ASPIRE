  "code": "def choose_places(cloud, scx, scy, stove_top, r_bowl, h_bowl, x_tol=0.10, y_tol=0.05):\n    \"\"\"Rank release spots over the stove for a bowl of radius `r_bowl` and\n    height `h_bowl`.\n\n    Each 1 cm grid cell gets a circular footprint of the bowl's radius; the\n    lowest obstacle inside that footprint above the stove surface is the cell's\n    clearance (1.0 = nothing at all).  Cells the bowl cannot descend into are\n    dropped, and of the rest the one *closest to the burner* wins: the goal test\n    only accepts a small offset around the burner, so proximity matters far more\n    than extra head-room.  The leaning board usually runs across the plate just\n    above bowl height, and the bowl simply passes underneath it.\n    \"\"\"\n    need = h_bowl + 0.04\n    cands = []\n    for dx in np.arange(-x_tol, x_tol + 1e-6, 0.01):\n        for dy in np.arange(-y_tol, y_tol + 1e-6, 0.01):\n            gx, gy = scx + dx, scy + dy\n            # circular footprint: a square one also sweeps up geometry that the\n            # bowl itself would never touch (e.g. the plate's raised right edge)\n            m = np.hypot(cloud[:, 0] - gx, cloud[:, 1] - gy) < r_bowl\n            col = cloud[m]\n            above = col[col[:, 2] > stove_top + 0.02]\n            clear = 1.0 if len(above) == 0 else float(above[:, 2].min() - stove_top)\n            score = (clear >= need, -math.hypot(dx, dy))\n            cands.append((score, float(gx), float(gy), clear))\n    cands.sort(key=lambda c: c[0], reverse=True)\n    out = []\n    for sc, gx, gy, cl in cands:\n        if all(math.hypot(gx - ox, gy - oy) > 0.03 for ox, oy, _ in out):\n            out.append((gx, gy, cl))\n    return out[:6]",
