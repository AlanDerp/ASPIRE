  "kind": "skill-code-instance",
  "observed_effect": "Cap the masks considered per prompt (top 5 by score), break out of the prompt loop on the first feasible hit (never keep scanning for a 'better' one), and bound the total attempts. Combined with dropping padding get_observation() settle calls (the climb back to carry height is itself the settling time) and keeping transport interpolation to 3 waypoints instead of 4: the same seed-51 episode cost 154 API calls before (mask_to_world_points 89, segment_sam3_text_prompt 17) and 70-72 after (18 and 9), with identical success. This is what makes a second carry attempt affordable within the horizon",
