  "code": "def find_containers(rgb, d, K, E):\n    \"\"\"Bowl-sized open containers sitting on the table.\n\n    A container has depth (z-extent >= 0.030 rejects the flat plate at 0.024)\n    and a bounded footprint at least 0.088 m across (rejects the 0.082 m\n    ramekin, keeps the 0.101 m bowls).  Anything already lifted off the table\n    (z_hi > 0.12) is rejected so a bowl in the gripper is never re-detected as\n    a fresh candidate.\n    \"\"\"\n    found = []\n    tries = 0\n    for p in BOWL_PROMPTS:\n        if len(found) >= 2:\n            break\n        masks = segment_sam3_text_prompt(rgb, p)\n        if not masks:\n            continue\n        for m in sorted(masks, key=lambda x: -x[\"score\"])[:5]:\n            if len(found) >= 2 or tries >= 8:\n                break\n            tries += 1\n            pts = mask_to_world_points(m[\"mask\"].astype(np.uint8), d, K, E)\n            if pts is None or len(pts) < 200 or len(pts) > 30000:\n                continue\n            zlo, zhi = np.percentile(pts[:, 2], [2, 98])\n            if zhi - zlo < 0.030 or zhi > 0.12:\n                continue\n            sx, sy = extent_xy(pts)\n            if max(sx, sy) < 0.088 or max(sx, sy) > 0.16 or min(sx, sy) < 0.055:\n                continue\n            cxy = np.median(pts, axis=0)[:2]\n            if any(math.hypot(cxy[0] - f[1][0], cxy[1] - f[1][1]) < 0.05 for f in found):\n                continue\n            found.append((pts, (float(cxy[0]), float(cxy[1])), p))\n    return found",
