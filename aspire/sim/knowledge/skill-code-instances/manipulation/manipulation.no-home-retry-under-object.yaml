  "code": "def move_tcp(pos, quat, tol=MOVE_TOL, retries=0):\n    \"\"\"Move the TCP toward pos.  Returns (ok, err).\n\n    With retries == 0 a bad IK solve is reported but left in place: re-solving\n    from home can produce a strained pose that sweeps into the object.\n    \"\"\"\n    pos = np.asarray(pos, dtype=np.float64)\n    err = np.inf\n    for attempt in range(retries + 1):\n        j = None\n        try:\n            j = solve_ik(pos, quat)\n        except Exception:\n            j = None\n        if j is not None:\n            move_to_joints(j)\n            err = float(np.linalg.norm(achieved_tcp() - pos))\n            if err < tol:\n                return True, err\n            print(f\"  move_tcp miss {err:.4f} at {np.round(pos, 3).tolist()} \"\n                  f\"attempt {attempt}\", flush=True)\n        if attempt < retries:\n            goto_home_joint_position()\n    return False, err",
