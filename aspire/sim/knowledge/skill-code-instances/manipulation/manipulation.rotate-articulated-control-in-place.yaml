  "code": "def attempt(rgb, d, K, E, drop, direction=1.0):\n    \"\"\"Pinch the control's upper band, then sweep the wrist.  Returns the gap.\"\"\"\n    st = locate_knob(rgb, d, K, E)\n    if st is None:\n        raise RuntimeError(\"control not localized\")\n    tx, ty = float(st[\"top_xy\"][0]), float(st[\"top_xy\"][1])\n    gz = max(st[\"top_z\"] - drop, st[\"zlo\"] + 0.010)\n    yaw0 = closing_yaw(st[\"band\"][:, :2])\n    q = topdown(yaw0)\n    print(\"  control top=(%.3f, %.3f) top_z=%.3f band_n=%d -> pinch z=%.3f yaw=%.0f\"\n          % (tx, ty, st[\"top_z\"], len(st[\"band\"]), gz, yaw0), flush=True)\n\n    open_gripper()\n    goto_pose(np.array([tx, ty, gz + APPROACH_Z]), q)\n    goto_pose(np.array([tx, ty, gz]), q)\n    close_gripper()\n    g = gap()\n    print(\"  gap after pinch %.4f\" % g, flush=True)\n    if g <= AIR_GAP:                            # closed on air: nothing to turn\n        goto_pose(np.array([tx, ty, gz + APPROACH_Z + 0.02]), q)\n        return g\n\n    sweep(tx, ty, gz, yaw0, direction)\n    open_gripper()\n    for _ in range(3):\n        get_observation()                       # let the physics settle\n    return g",
