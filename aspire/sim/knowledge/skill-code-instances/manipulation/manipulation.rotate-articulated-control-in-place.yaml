  "observed_effect": "Take the pinch point as the MEDIAN XY of the control's raised band (z above zlo + BAND_FRAC*(zhi-zlo)), not the whole cloud's centre, which the base drags down. Set the pinch z PINCH_DROP (8 mm) below the band's own median z so the fingers clear the base. Close, then verify by the measured gap: a gap at or below AIR_GAP (0.004 m) means the fingers closed on air and nothing can be rotated, so retreat and retry at a different height rather than sweeping. Verified gap after the pinch: 0.0243 m on all 15 development seeds, matching the band's measured 2.4 cm cross-dimension; 0.0171 m after the sweep.",
