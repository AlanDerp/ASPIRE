  "observed_effect": "Shadow the API entry points to count your own motion, then gate RETRIES with it -- never the first attempt. Measured costs on this scene: goto_pose ~= 30 env steps, open_gripper/close_gripper exactly 30 each, one full attempt ~= 1400 steps (a 354-frame pass at _subsample_rate=4 = 1416), so only 2-3 attempts fit in HORIZON=4000. The prior 8-candidate retry died at 3916 of 4000 steps mid-episode. The gate is 'if HORIZON - spent() < ATTEMPT_BUDGET: break', where spent() sums HOP_COST*hops + GRIP_COST*grips -- i.e. the budget is measured from the program's own commands, not estimated per candidate. The transferable discipline: a probe that ran 4 pinches (~76 goto_pose) exhausted the episode; count commands, not intentions",
