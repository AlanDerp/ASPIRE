  "observed_effect": "Roll the hand about world x by ~atan(0.04/0.11) = 20 deg (25 used), the angle that MINIMISES the low fingertip's depth z_hand - (0.11*cos t + 0.04*sin t). The roll keeps the pad-frame offset and swaps which finger is low: the low fingertip lands at (hand_x, hand_y + 0.0103, hand_z - 0.1166), ~6.6 mm below the top-down fingertip, so it slides along the table as a paddle while the other fingertip stays 1.4 cm clear. Verified: a 5.0 cm slide in -x moved the object -0.0501 m with 0.0067 m lateral drift, against 0.0001 m unrolled. The rolled pose carries a constant +0.047 m commanded-y bias that one feedback iteration removes. This CONTRADICTS the goal_swap sibling's finding for the SAME task that a wrist tilt is only useful above ~3 cm: that measurement was of the TCP (EE + 0.1*R[:,2], on the tool axis), which does lose vertical reach. The roll is aimed at the OFF-AXIS low fingertip, which gains it. 15/15 development seeds",
