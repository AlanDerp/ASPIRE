  "code": "def probe_reach_x(pcy, z, quat=TOP_DOWN):\n    \"\"\"Probe the workspace wall along +x at (y=pcy, z=z); returns the achieved\n    x, or nan if the probe itself failed.\n\n    The only honest way to learn where the arm stops is to drive it there and\n    read back the pose.  NOTE this single long lunge is a *conservative lower\n    bound*: lunging straight to x=0.95 measures ~0.696, while laddering out in\n    small hops reaches ~0.750 at the same height (measured on seed 55, fingertip\n    z = 0.125).  The solver converges to a different branch for a 0.35 m jump\n    than for an incremental approach, and the real release descent is\n    incremental.  Treat a \"beyond\" verdict as advisory, never as the wall.\n    \"\"\"\n    got = float(\"nan\")\n    try:\n        goto_pose(np.array([PROBE_X, pcy, z]), quat)\n        got = float(get_observation()[\"robot_cartesian_pos\"][0])\n    except Exception as e:\n        print(f\"  reach probe failed: {type(e).__name__} {str(e)[:60]}\", flush=True)\n    try:\n        goto_home_joint_position()\n    except Exception:\n        pass\n    return got",
