  "code": "def low(x, y, tag=\"slide\"):\n    \"\"\"Horizontal slide at the lowest z the arm can hold, interpolated in <=STEP.\"\"\"\n    cur = ee_tcp()\n    d = np.array([x, y]) - cur[:2]\n    n = max(1, int(np.ceil(float(np.linalg.norm(d)) / STEP)))\n    t = cur\n    for i in range(1, n + 1):\n        q = cur[:2] + d * (i / n)\n        t = cmd([q[0], q[1], Z_LOW], tag)\n    return t\n\n\ndef descend_at(x, y, tag=\"desc\"):\n    t = None\n    for z in (0.30, 0.12, 0.03, Z_LOW, Z_LOW):\n        t = cmd([x, y, z], tag)\n    return t",
