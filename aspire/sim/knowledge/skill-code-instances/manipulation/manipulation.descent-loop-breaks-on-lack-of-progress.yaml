  "code": "def lower_onto(px, py, z_lo, step=0.025, max_iter=18):\n    \"\"\"Hop to (px, py), then lower toward z_lo, stopping at the floor.\n\n    The lateral move is laddered so the TCP really arrives over the target.\n    The vertical loop stops on *lack of progress*, never on a fixed\n    command-vs-measured gap (see the module docstring).\n    \"\"\"\n    hop_to(px, py, tag=\" (place)\")\n    for _ in range(max_iter):\n        cur = achieved_tcp()\n        if cur[2] <= z_lo + 0.004:\n            break\n        tgt = np.array([cur[0], cur[1], max(z_lo, cur[2] - step)])\n        move_tcp(tgt, TOPDOWN, tol=0.020, retries=0)\n        now = achieved_tcp()\n        if now[2] >= cur[2] - 0.004:     # no downward progress -> floor\n            print(f\"  place floor at cmd {tgt[2]:.3f} meas {now[2]:.3f}\",\n                  flush=True)\n            break\n    return achieved_tcp()[2]",
