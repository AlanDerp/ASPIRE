  "code": "def tcp_reaches(xy, quat, z, tol=REACH_TOL, max_iter=5):\n    \"\"\"True if the tool axis can actually BE at (xy, z) in this orientation.\n\n    `goto_pose` and `solve_ik` both report success while the tool stalls short\n    laterally, and on this table the +x side saturates outright - commanding\n    x = 0.768, 0.787, 0.805 and 0.823 all return exactly 0.750.  Closing the\n    gripper there lands the fingers ON the object instead of beside it and drags\n    it, so every pinch is verified before the fingers are allowed to close.\n\n    The correction loop needs room to work: a direction left over from the\n    previous candidate can start tens of mm off, so an under-iterated probe\n    reports a perfectly reachable direction as unreachable (measured: -y read\n    as unreachable after 3 hops but reached with err = 0.0003 once given 6).\n    Callers also park on the target xy from above before probing.\n    \"\"\"\n    cmd = np.array([xy[0], xy[1], z], dtype=float)\n    goto_pose(cmd, quat)\n    for k in range(max_iter):\n        cur = tcp_xy()\n        err = np.asarray(xy, dtype=float)[:2] - cur\n        n = float(np.linalg.norm(err))\n        if n < tol:\n            return True, cmd\n        cmd = np.array([cmd[0] + err[0], cmd[1] + err[1], z])\n        goto_pose(cmd, quat)\n    return False, cmd",
