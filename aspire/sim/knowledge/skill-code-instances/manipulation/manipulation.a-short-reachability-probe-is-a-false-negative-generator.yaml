  "observed_effect": "Seed 65: the -y direction was declared unreachable after 3 probe hops but reached with err 0.0003 after 6. It was the only direction that could grip, so the seed scored 0 with it skipped and 1.0 with it retried. The shipped code parks at b_hi + 0.10 and re-probes with PROBE_RETRY_ITERS = 8 before discarding: ok, cmd = tcp_reaches(descent[:2], q, b_hi + 0.06, max_iter=PROBE_ITERS); if not ok: re-park and tcp_reaches(..., max_iter=PROBE_RETRY_ITERS); only then continue. This is the converse of manipulation.solve-ik-success-is-not-reachability: there the API reports success it did not achieve, here the probe reports failure on a pose the arm can in fact reach.",
