  "code": "def run():\n    print(\"TASK_LANGUAGE: %s\" % getattr(env.handle, \"task_language\", \"\"), flush=True)\n    rgb, d, K, E = view()\n    if locate_knob(rgb, d, K, E) is None:\n        raise RuntimeError(\"control not localized at start\")\n\n    gripped = False\n    for drop in (PINCH_DROP, 0.0, 0.016):\n        try:\n            g = attempt(rgb, d, K, E, drop)\n        except Exception as exc:                # noqa: BLE001\n            print(\"  attempt(drop=%.3f) failed: %s\" % (drop, exc), flush=True)\n            continue\n        if g > AIR_GAP:\n            gripped = True\n            break\n        rgb, d, K, E = view()                   # re-localize after an air pinch\n\n    if not gripped:\n        # Nothing was ever gripped, so nothing has been rotated yet: a mirrored\n        # sweep in the opposite direction is free insurance.\n        print(\"  no grip in either height band - trying the opposite sweep\", flush=True)\n        rgb, d, K, E = view()\n        for drop in (PINCH_DROP, 0.0):\n            try:\n                g = attempt(rgb, d, K, E, drop, direction=-1.0)\n            except Exception as exc:            # noqa: BLE001\n                print(\"  reverse attempt failed: %s\" % exc, flush=True)\n                continue\n            if g > AIR_GAP:\n                break\n            rgb, d, K, E = view()\n\n    print(\"  final gap %.4f\" % gap(), flush=True)",
