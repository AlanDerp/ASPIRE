  "observed_effect": "Call the sweep with a constant direction (+1.0 = world +Z). Retry a failed pinch at different heights in the SAME direction: a bounded joint can only be pushed further toward its limit, so a same-direction retry can never undo a partial turn, while a reversed retry can. Offer the opposite direction at most once, and only after every pinch has closed on air - i.e. only when nothing has been rotated yet, which makes it free insurance. Note solve_ik RAISES on total failure (RuntimeError: IK failed ... with all orientation fallbacks), so no  guard is needed; wrap each sweep step in try/except instead and cap consecutive misses.",
