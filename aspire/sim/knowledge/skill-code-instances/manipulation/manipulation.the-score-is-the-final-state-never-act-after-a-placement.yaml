  "goal": "Preserve a completed placement inside an episode that keeps iterating, when the score is read from the episode's FINAL state",
  "id": "manipulation.the-score-is-the-final-state-never-act-after-a-placement",
  "kind": "skill-code-instance",
  "observed_effect": "The harness scores the goal predicate of the episode's FINAL state: env.step(code) runs the whole block and reward = compute_reward() of the last inner step. Any iteration AFTER a successful release can therefore only DESTROY the score. Add a loop-top rule that refuses to touch a target already resting in the goal region: if carries > 0 and the target's measured centre is inside the goal footprint, settle and break. Measured on seed 64: initial_code.py placed the bowl at release xy=(0.706,0.154) against plate=(0.714,0.209), then attempt 1 targeted the bowl it had just placed, re-grasped it (wall 0 r=0.038 close width=0.0967 -> lift width [0.0856,0.0773,0.0715,0.0667]) and carried it off the plate; the 999-frame video ends with an EMPTY plate. With the rule the carried state is preserved and the same seed scores 1.0. Use a WIDE tolerance (dxy <= 0.045) for the loop-top OBB-centre reading and a STRICT one (dxy <= 0.030) for a raw post-release cloud. CAVEAT for the record: seed 64 still reads 0 in the shipped 9/15 sweep, where it fails on a different signature (horizon/marginal grip), so this pattern's 0->1 demonstration is a development measurement, not a shipped-sweep one",
