  "code": "def on_plate(landed, goal_xy, plate_r, plate_surf):\n    \"\"\"True when the re-measured bowl cloud rests inside the plate footprint.\n\n    The trial is scored on the state it ENDS in, so this is the only feedback\n    channel the program has: once the goal object is verifiably seated, the rest\n    of the episode can only make things worse.\n    \"\"\"\n    if landed is None:\n        return False\n    dxy = float(np.linalg.norm(np.asarray(landed[:2]) - np.asarray(goal_xy)))\n    z = float(landed[2])\n    tol = min(0.045, max(0.030, 0.75 * plate_r))\n    ok = dxy <= tol and (plate_surf - 0.030) <= z <= (plate_surf + 0.045)\n    print(\"   placement check dxy=%.4f (tol %.3f) z=%.4f surf=%.4f -> %s\"\n          % (dxy, tol, z, plate_surf, \"ON PLATE\" if ok else \"off\"), flush=True)\n    return ok",
