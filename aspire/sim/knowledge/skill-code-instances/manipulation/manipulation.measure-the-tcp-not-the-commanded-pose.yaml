  "code": "def tcp():\n    \"\"\"World position the gripper TCP actually reached.\n\n    solve_ik/goto_pose target EE = position + R @ (0, 0, -0.1), so the inverse\n    relation is TCP = EE + 0.1 * R[:, 2].\n    \"\"\"\n    e = np.asarray(get_observation()[\"robot_cartesian_pos\"], dtype=np.float64)\n    q = e[3:7]\n    R = Rotation.from_quat([q[1], q[2], q[3], q[0]]).as_matrix()\n    return e[:3] + 0.1 * R[:, 2]",
