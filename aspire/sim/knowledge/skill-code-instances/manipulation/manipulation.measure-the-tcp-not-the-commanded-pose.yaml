  "observed_effect": "Read the tool centre point from the observation every time control depends on it, inverting the library own offset convention: the solve_ik/goto_pose target EE is p + R @ (0,0,-0.1), so tcp = e[:3] + 0.1 * R[:,2] with R built from the observed quaternion converted from (x,y,z,w) to scipy (w,x,y,z). Probes: cmd (+0.800,+0.100,+0.360) -> tcp (+0.750,+0.099,+0.370) (reach clamp); descent cmd z 0.045 -> meas 0.058 (z lag). Close the release descent on the MEASURED z (loop while measured zc > z_goal, hopping zc = max(z_goal, zc - HOP), 16 iterations) rather than on the commanded depth, releasing ~6 mm above the surface. A commanded-depth release varied the true release height by centimetres between seeds; the measured-depth release gives a flat landing (bowl z-extent 0.044-0.045) on all 15 dev seeds, 12/15 -> 15/15",
