  "observed_effect": "The container is localized with a geometry-screened prompt chain and its centre, rim z, radius and floor z are printed on every seed; the achieved TCP is printed again at contact ('over bowl: tcp=(x,y,z)'). Comparing those two lines across seeds exposes the regime. On this task the bowl sits at y ~= -0.062 on most seeds and y ~= -0.045 on seeds 54/56 - 2 cm nearer. In the far regime the arm stalls at reported z ~= 0.1918 with the pads 3.7 cm above the rim (safe); in the near regime it descends to ~= 0.1205-0.1233 and the pads enter the mouth, where the retreat drags the whole bowl off the table. The outcome flips on a 2.8 mm difference in the final reported z (0.1205 -> reward 1.0, 0.1233 -> reward 0.0) across otherwise-identical controllers, so a single seed's contact outcome is not evidence about the controller: measure the regime, then tune.",
