  "code": "def localize_bowl(rgb, d, K, E):\n    \"\"\"The metal bowl: the goal container.\"\"\"\n    for prompt in [\"metal bowl\", \"bowl\", \"silver bowl\"]:\n        try:\n            masks = segment_sam3_text_prompt(rgb, prompt)\n        except Exception:\n            continue\n        for m in sorted(masks, key=lambda x: -x[\"score\"])[:3]:\n            mask = m[\"mask\"].astype(np.uint8)\n            pts = mask_to_world_points(mask, d, K, E)\n            if pts is None or len(pts) < 200 or len(pts) > 20000:\n                continue\n            c, zlo, zhi, ext = cloud_geom(pts)\n            if zhi - zlo < 0.020:            # a bowl has depth\n                continue\n            if max(ext) > 0.20:\n                continue\n            if not (0.05 < c[0] < 0.75 and -0.45 < c[1] < 0.45):\n                continue\n            print(f\"  bowl: prompt={prompt!r} score={m['score']:.3f} \"\n                  f\"c=({c[0]:.3f},{c[1]:.3f},{c[2]:.3f}) z=[{zlo:.4f},{zhi:.4f}] \"\n                  f\"ext={np.round(ext,4).tolist()} n={len(pts)}\", flush=True)\n            return c, zhi, 0.5 * max(ext), zlo\n    return None, None, None, None",
