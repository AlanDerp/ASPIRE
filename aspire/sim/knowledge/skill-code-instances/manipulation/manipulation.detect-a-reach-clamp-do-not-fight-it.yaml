  "code": "def carry_and_place(place_xy, place_z, grip):\n    quat = grip[\"quat\"]\n    place_xy = np.asarray(place_xy, dtype=np.float64)\n    rel_xy = place_xy - grip[\"offset\"]\n    print(\"  offset_used=%s bottom_gap=%.3f rel_xy=(%.3f,%.3f)\"\n          % (np.round(grip[\"offset\"], 3).tolist(), grip[\"bottom_gap\"], rel_xy[0], rel_xy[1]), flush=True)\n    carry_z = 0.36\n    t = tcp()\n    go([t[0], t[1], carry_z], quat, tag=\"lift2\")\n    if gap() <= AIR_GAP:\n        print(\"  lost on lift\", flush=True)\n        return False\n    go([rel_xy[0], rel_xy[1], carry_z], quat, tag=\"transit\")\n    close_gripper()\n    print(\"  transit gap=%.4f\" % gap(), flush=True)\n    if gap() <= AIR_GAP:\n        print(\"  lost in transit\", flush=True)\n        return False\n    # Hover the bowl a few cm above the plate: the fingers stay clear of the\n    # table and the bowl is still clamped, so it can be steered.\n    hover = float(place_z) + grip[\"bottom_gap\"] + HOVER\n    go([rel_xy[0], rel_xy[1], hover + 0.04], quat, tag=\"above\")\n    z = float(tcp()[2]) + 0.015\n    for _ in range(5):\n        z -= 0.015\n        if z < hover - 0.01:\n            break\n        go([rel_xy[0], rel_xy[1], z], quat, tag=\"down\")\n        if float(tcp()[2]) < hover + 0.004:\n            break\n    # Closed-loop centring: while the bowl hangs clamped, a TCP translation is\n    # a bowl translation, so measure where the bowl actually is and null the\n    # residual instead of trusting the offset measured back at the pinch.\n    for _ in range(3):\n        # The bowl is held, so search close to the plate and only accept a\n        # segmentation that passes the physical sanity screen.\n        cd = bowl_near(place_xy, max_d=0.20, trusted=True,\n                       expect_z=float(tcp()[2]) - grip[\"bottom_gap\"])\n        if cd is None:\n            print(\"  centring: no trustworthy bowl mask, keeping current pose\", flush=True)\n            break\n        err = place_xy - cd[\"c\"]\n        print(\"  centring err=%.4f (%s)\" % (float(np.linalg.norm(err)), np.round(err, 3).tolist()), flush=True)\n        if float(np.linalg.norm(err)) < 0.006:\n            break\n        t = tcp()\n        go([t[0] + err[0], t[1] + err[1], t[2]], quat, tag=\"nudge\")\n    # Set the bowl down instead of dropping it: a short controlled descent in\n    # absolute 6 mm hops keeps the release height at ~1 cm, so the bowl does not\n    # scatter away from the centred spot.\n    t = tcp()\n    kiss = float(place_z) + 0.010\n    z = float(t[2])\n    for _ in range(6):\n        z -= 0.006\n        if z < kiss - 0.012:\n            break\n        go([t[0], t[1], z], quat, tag=\"kiss\")\n        if float(tcp()[2]) < kiss + 0.003:\n            break\n    cd = bowl_near(place_xy, max_d=0.20, trusted=True,\n                   expect_z=float(tcp()[2]) - grip[\"bottom_gap\"])\n    if cd is not None:\n        err = place_xy - cd[\"c\"]\n        if float(np.linalg.norm(err)) > 0.008:\n            t = tcp()\n            go([t[0] + err[0], t[1] + err[1], t[2]], quat, tag=\"nudge2\")\n    t = tcp()\n    print(\"  release tcp=%s\" % np.round(t, 3).tolist(), flush=True)\n    open_gripper()\n    go([t[0], t[1], t[2] + 0.12], quat, tag=\"up\")\n    return True",
