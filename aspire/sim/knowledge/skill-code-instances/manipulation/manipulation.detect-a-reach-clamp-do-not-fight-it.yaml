  "observed_effect": "The transferable content is the DETECTION, which needs no knowledge of the clamp value: after any horizontal goto_pose, compare the commanded xy with the achieved xy; if the magnitude of (cmd - achieved) is essentially CONSTANT across two iterations, the joint is clamped and every further nudge is wasted motion and wasted horizon. Predict the needed TCP x up front as place_x + offset_x and compare against a conservative X_MAX, reporting the residual rather than iterating. Here solve_ik clamps the HAND x to <= 0.75 so TCP stalls at 0.750; seeds 51 and 61 saturate at x=0.748-0.751 for three consecutive nudges and verify at dist=0.040/0.039 -- 3.9-4.2 cm residual against the ~3 cm the sim accepts (dist=0.029 scored reward 1.0). These two seeds are NOT fixable by control on this arm; the honest outcome is to detect and report, not to keep nudging",
