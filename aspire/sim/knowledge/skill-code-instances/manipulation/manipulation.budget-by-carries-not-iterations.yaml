  "code": "def run():\n    rgb, d, K, E = observe()\n    bowl = bowl_points(rgb, d, K, E)\n    if bowl is None:\n        print(\"BOWL NOT FOUND\", flush=True)\n        return\n    bx, by, b_lo, b_hi, bowl = bowl_geometry(bowl)\n    print(f\"bowl centre=({bx:.3f},{by:.3f}) z=[{b_lo:.3f},{b_hi:.3f}]\", flush=True)\n\n    def outer_radius(pts, z):\n        band = pts[np.abs(pts[:, 2] - z) < 0.010]\n        if len(band) < 15:\n            band = pts\n        return 0.5 * max(float(np.percentile(band[:, 0], 98) -\n                               np.percentile(band[:, 0], 2)),\n                         float(np.percentile(band[:, 1], 98) -\n                               np.percentile(band[:, 1], 2)))\n\n    # --- plate surface and the reachable columns above it -------------------\n    plate_m, plate_pts = localize(rgb, d, K, E, [\"plate\", \"dinner plate\", \"red plate\"])\n    if plate_pts is None:\n        print(\"PLATE NOT FOUND\", flush=True)\n        return\n    plate_top = float(np.percentile(plate_pts[:, 2], 90))\n    pcx = float(np.median(plate_pts[:, 0]))\n    pcy = float(np.median(plate_pts[:, 1]))\n    r_plate = 0.5 * max(float(np.percentile(plate_pts[:, 0], 98) -\n                              np.percentile(plate_pts[:, 0], 2)),\n                        float(np.percentile(plate_pts[:, 1], 98) -\n                              np.percentile(plate_pts[:, 1], 2)))\n    r_bowl = max(0.04, outer_radius(bowl, b_lo + 0.5 * (b_hi - b_lo)))\n    h_bowl = b_hi - b_lo\n    places = choose_places(world_cloud(d, K, E), pcx, pcy, plate_top, r_bowl + 0.006,\n                           h_bowl, tol=min(0.04, max(0.02, r_plate - r_bowl)))\n    if not places:\n        print(\"NO PLACE FOUND\", flush=True)\n        return\n    print(f\"plate=({pcx:.3f},{pcy:.3f}) top={plate_top:.3f} r_plate={r_plate:.3f} \"\n          f\"r_bowl={r_bowl:.3f} h_bowl={h_bowl:.3f}\", flush=True)\n    for gx, gy, cl in places:\n        print(f\"  place=({gx:.3f},{gy:.3f}) clearance={cl:.3f}\", flush=True)\n\n    place_idx = 0\n    idx = 0\n    carries = 0\n    for n in range(MAX_ITERS):\n        rgb, d, K, E = observe()\n        bowl = bowl_points(rgb, d, K, E)\n        if bowl is None:\n            print(\"BOWL LOST\", flush=True)\n            return\n        bx, by, b_lo, b_hi, bowl = bowl_geometry(bowl)\n        zr = b_lo + 0.62 * (b_hi - b_lo)\n        zr_lo = b_lo + 0.35 * (b_hi - b_lo)\n        Rw = outer_radius(bowl, zr)\n        Rw_lo = outer_radius(bowl, zr_lo)\n        print(f\"attempt {n}: bowl=({bx:.3f},{by:.3f}) z=[{b_lo:.3f},{b_hi:.3f}] \"\n              f\"Rw={Rw:.3f} Rw_lo={Rw_lo:.3f}\", flush=True)\n        cands = candidates(bx, by, b_lo, b_hi, Rw, Rw_lo, zr, zr_lo, rgb, d, K, E)\n        if idx >= len(cands):\n            print(\"NO CANDIDATES LEFT\", flush=True)\n            break\n        tag, q, tcp = cands[idx]\n        place = places[min(place_idx, len(places) - 1)]\n        print(f\" try {tag} -> place=({place[0]:.3f},{place[1]:.3f})\", flush=True)\n        try:\n            res = attempt(q, tcp, place, plate_top, r_bowl, bx, by, b_lo, bowl)\n        except Exception as e:\n            print(f\"  {tag} failed: {type(e).__name__} {str(e)[:80]}\", flush=True)\n            try:\n                goto_home_joint_position()\n            except Exception:\n                pass\n            res = \"slip\"\n        if res is True:\n            print(\"SUCCESS\", flush=True)\n            return\n        idx += 1\n        if res == \"noplace\" or res == \"unreachable\":\n            # the pinch worked but the release spot did not - try another spot\n            place_idx += 1\n        if res != \"air\":\n            # the pinch took hold of the bowl, so this one really did cost a\n            # full pick-and-place out of the episode budget\n            carries += 1\n            if carries >= MAX_CARRY_ATTEMPTS:\n                print(f\"carry budget spent ({carries})\", flush=True)\n                break\n    print(\"NO ATTEMPT SUCCEEDED\", flush=True)",
