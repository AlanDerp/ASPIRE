  "observed_effect": "Two separate budgets - MAX_CARRY_ATTEMPTS = 3 for attempts that actually took hold, MAX_ITERS = 5 for total sweeps - so an episode can never end having never once carried the object. Measured cost: an air grasp is 16 API calls, a carried attempt ~30, a clean run 53, against a ~160-call horizon; worst case 3*30 + 2*16 + preamble ~= 137. Inert on all 15 seeds (max 2 sweeps used), re-verified 15/15",
