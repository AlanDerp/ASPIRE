  "goal": "Size a retry path against the episode horizon without trimming observations for phantom headroom",
  "id": "manipulation.one-retry-fits-the-episode-budget",
  "kind": "skill-code-instance",
  "observed_effect": "Bound the retry cost empirically rather than by trimming. Measured: a clean run consumes 142 trace steps; injecting ONE guaranteed first-pinch failure (stopped above the bowl, z 0.119 > 0.070) cost 33 extra steps (142 -> 175) and the program then re-localized, pinched the next wall (hold gap 0.0081) and still scored 1.0 with task_completed=1. So ONE full retry fits comfortably and the ~160-call figure is not a hard wall -- only a run that fails several pinches in a row risks the horizon. The transferable discipline: measure the retry cost by injecting the failure, before trimming legitimate observation calls for headroom you may not need",
