  "code": "def run():\n    goto_home_joint_position()\n    rgb, d, K, E = observe()\n    table_z = table_height(rgb, d, K, E)\n    plate = find_plate(rgb, d, K, E)\n    if plate is None:\n        print(\"NO PLATE\", flush=True)\n        return\n    goal_xy = (plate[\"cx\"], plate[\"cy\"])\n    stove = find_stove(rgb, d, K, E)\n    if stove is None:\n        print(\"  no stove found\", flush=True)\n    else:\n        print(\"  stove=(%.3f,%.3f) top=%.3f ext=(%.3f,%.3f,%.3f) [%s]\"\n              % (stove[\"cx\"], stove[\"cy\"], stove[\"top\"],\n                 stove[\"hi\"][0] - stove[\"lo\"][0], stove[\"hi\"][1] - stove[\"lo\"][1],\n                 stove[\"hi\"][2] - stove[\"lo\"][2], stove[\"prompt\"]), flush=True)\n    cands = bowls(rgb, d, K, E)\n    for c in cands:\n        print(\"  bowl cand cen=(%.3f,%.3f) z=(%.3f,%.3f) n=%d score=%.3f [%s]\"\n              % (c[\"cx\"], c[\"cy\"], c[\"base\"], c[\"top\"], c[\"n\"], c[\"score\"], c[\"prompt\"]),\n              flush=True)\n    target = pick_on_stove(cands, stove, table_z)\n    if target is None:\n        print(\"NO BOWL\", flush=True)\n        return\n    print(\"  plate=(%.3f,%.3f) top=%.3f r=%.3f | table_z=%s | target bowl=(%.3f,%.3f) \"\n          \"z=(%.3f,%.3f) n=%d\"\n          % (plate[\"cx\"], plate[\"cy\"], plate[\"top\"], plate[\"r\"],\n             \"?\" if table_z is None else \"%.3f\" % table_z,\n             target[\"cx\"], target[\"cy\"], target[\"base\"], target[\"top\"], target[\"n\"]),\n          flush=True)\n\n    for attempt in range(MAX_CARRY):\n        print(\" -- carry attempt %d, bowl at (%.3f,%.3f)\"\n              % (attempt + 1, target[\"cx\"], target[\"cy\"]), flush=True)\n        carried = False\n        for tag, quat, pos, _r in candidates(target, goal_xy):\n            print(\" try %s at %s\" % (tag, np.round(pos, 3).tolist()), flush=True)\n            res = None\n            try:\n                res = grasp(tag, quat, pos, target)\n            except Exception as exc:\n                print(\"  %s failed: %s %s\" % (tag, type(exc).__name__, str(exc)[:80]),\n                      flush=True)\n                try:\n                    goto_home_joint_position()\n                except Exception:\n                    pass\n            if res is None:\n                # the bowl is still where it was: refresh its pose and try the next wall\n                rgb, d, K, E = observe()\n                t2 = near_bowl(bowls(rgb, d, K, E), (target[\"cx\"], target[\"cy\"]))\n                if t2 is not None:\n                    target = t2\n                continue\n            drop, off = res\n            carried = True\n            try:\n                place(plate, off, drop, quat)\n            except Exception as exc:\n                print(\"  place failed: %s %s\" % (type(exc).__name__, str(exc)[:80]),\n                      flush=True)\n                break\n            ok, c = placed(plate, (plate[\"cx\"] - off[0], plate[\"cy\"] - off[1]))\n            if ok:\n                print(\"PLACED\", flush=True)\n                return\n            if c is None:\n                print(\"NO ATTEMPT SUCCEEDED\", flush=True)\n                return\n            # the bowl is no longer where it started: re-find it there and try again\n            rgb, d, K, E = observe()\n            t2 = near_bowl(bowls(rgb, d, K, E), c, tol=0.14)\n            if t2 is None:\n                print(\"  bowl lost after release\", flush=True)\n                print(\"NO ATTEMPT SUCCEEDED\", flush=True)\n                return\n            if float(np.hypot(t2[\"cx\"] - plate[\"cx\"], t2[\"cy\"] - plate[\"cy\"])) \\\n                    < plate[\"r\"] + 0.02:\n                print(\"  bowl is sitting on the plate but not centred\", flush=True)\n                print(\"NO ATTEMPT SUCCEEDED\", flush=True)\n                return\n            target = t2\n            break\n        if not carried:\n            print(\"  no wall could be pinched\", flush=True)\n            break\n    print(\"NO ATTEMPT SUCCEEDED\", flush=True)",
