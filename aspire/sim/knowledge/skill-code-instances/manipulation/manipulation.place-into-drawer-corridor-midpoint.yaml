  "code": "front = drawer_front(get_observation())\n_log(\"front\", None if front is None else [round(v, 3) for v in front])\nif front is not None and front[1] > -0.105:          # drawer confirmed open\n    x_ref, drawer_face, floor_z = front\n    # aim deeper than the target: the descent into the cavity stops ~2.5 cm\n    # short of the commanded pose (the bowl body meets the drawer front)\n    # the cavity is shallow: the bowl's near edge has to clear the panel's top\n    # edge on the way down, and its far edge must stay in front of the drawer's\n    # back wall (aiming at -0.115 put the bowl past the back wall, on top of\n    # the cabinet; aiming at -0.100 left it hanging on the panel lip)\n    cavity_y = drawer_face - 0.075\n    for _attempt in range(3):\n        grasped = grasp_bowl()\n        if grasped is None:\n            break\n        _, _, bottom_gap = grasped\n        # TCP height that puts the bowl's underside just above the floor\n        place = np.array([x_ref, cavity_y, floor_z + bottom_gap + 0.020])\n        if carry_to(place) and place_and_release(place) is not None:\n            if bowl_inside_drawer(drawer_face):\n                break",
