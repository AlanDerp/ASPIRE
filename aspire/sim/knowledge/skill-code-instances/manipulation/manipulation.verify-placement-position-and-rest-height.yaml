  "code": "def placed_on_stove(rgb, d, K, E, place_xy, stove_top, r_bowl):\n    \"\"\"Strict placement check: bowl points near the goal XY *and* resting at the\n    stove surface height.  A bowl held up in the gripper, or left on the leaning\n    board, fails the height test.\"\"\"\n    pts = bowl_points(rgb, d, K, E, ref_xy=place_xy, radius=max(0.07, r_bowl + 0.04))\n    if pts is None:\n        return False\n    c = np.median(pts, axis=0)\n    zlo = float(np.percentile(pts[:, 2], 2))\n    dist = math.hypot(c[0] - place_xy[0], c[1] - place_xy[1])\n    print(f\"  place check n={len(pts)} centre=({c[0]:.3f},{c[1]:.3f},{c[2]:.3f}) \"\n          f\"z2={zlo:.3f} dist={dist:.3f} (stove_top={stove_top:.3f})\", flush=True)\n    return dist < 0.07 and (stove_top - 0.03) < zlo < (stove_top + 0.07)",
