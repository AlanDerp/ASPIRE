  "code": "def hop_to(px, py, step=0.030, tol=0.016, max_iter=16, tag=\"\"):\n    \"\"\"Translate the TCP to (px, py) at its current height, in small hops.\n\n    See the module docstring: one large Cartesian jump leaves the arm short of\n    its target because solve_ik is warm-started and iterated only a handful of\n    times per call.  Small hops keep it inside its convergence basin.\n    \"\"\"\n    for _ in range(max_iter):\n        cur = achieved_tcp()\n        d = np.array([px - cur[0], py - cur[1], 0.0])\n        n = float(np.linalg.norm(d))\n        if n < tol:\n            return True\n        nxt = cur + d * min(1.0, step / n)\n        move_tcp(nxt, TOPDOWN, tol=0.020, retries=0)\n        a = achieved_tcp()\n        if np.linalg.norm(a[:2] - cur[:2]) < 0.003:\n            print(f\"  lateral stall{tag} at {np.round(a, 3).tolist()}\", flush=True)\n            return False\n    return False",
