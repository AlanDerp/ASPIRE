  "code": "# ---- grasp the bottle -------------------------------------------------\npts = target[\"pts\"]\nzlo = float(np.percentile(pts[:, 2], 2))\nzhi = float(np.percentile(pts[:, 2], 98))\nz_grasp = zlo + GRASP_FRAC * (zhi - zlo)\nfor frac in (0.30, 0.45, 0.55, 0.65, 0.75, 0.82, 0.90):\n    zz = zlo + frac * (zhi - zlo)\n    sl = pts[np.abs(pts[:, 2] - zz) < 0.012]\n    if len(sl) >= 8:\n        e = np.percentile(sl, 98, axis=0) - np.percentile(sl, 2, axis=0)\n        print(\"    profile frac=%.2f z=%.3f n=%3d ext=(%.3f,%.3f)\"\n              % (frac, zz, len(sl), e[0], e[1]), flush=True)\nband = pts[np.abs(pts[:, 2] - z_grasp) < 0.022]\nif len(band) < 20:\n    band = pts\nbxy = 0.5 * (np.percentile(band, 2, axis=0)[:2] + np.percentile(band, 98, axis=0)[:2])\nc2 = band[:, :2] - band[:, :2].mean(axis=0)\nw, v = np.linalg.eigh(c2.T @ c2)\naxis = v[:, int(np.argmax(w))]\nnormal = np.array([-axis[1], axis[0]])\nyaw = float(np.degrees(np.arctan2(normal[0], -normal[1])))\nquat = topdown_quat(yaw)\ngrasp_pos = np.array([bxy[0], bxy[1], z_grasp])\nprint(\"  pinch xy=(%.3f,%.3f) z=%.3f yaw=%.1f band=%d\" % (bxy[0], bxy[1], z_grasp, yaw, len(band)),\n      flush=True)\n\nopen_gripper()\ngoto_pose(grasp_pos, quat, z_approach=PRE_GRASP_H)\ngoto_pose(grasp_pos, quat)\nclose_gripper()\npinch_gap = gap_raw()\npinch_z = float(tcp()[2])\nprint(\"  pinch gap_raw=%.3f (%.4f m) tcp_z=%.4f\" % (pinch_gap, pinch_gap * 0.08, pinch_z), flush=True)\nif pinch_gap <= AIR_GAP_RAW:\n    print(\"  AIR GRASP - aborting\", flush=True)\n    open_gripper()\n    goto_home_joint_position()\n    raise RuntimeError(\"air grasp\")\n\n# ---- lift and verify --------------------------------------------------\nz_lift = z_grasp\nwhile z_lift < CARRY_Z:\n    z_lift = min(CARRY_Z, z_lift + LIFT_STEP)\n    goto_pose(np.array([bxy[0], bxy[1], z_lift]), quat)\nheld_gap = gap_raw()",
