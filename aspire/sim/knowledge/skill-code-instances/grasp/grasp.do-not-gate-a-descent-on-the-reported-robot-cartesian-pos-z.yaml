  "code": "def descend_ladder(xy, quat, z_start, z_target, hop=HOP):\n    \"\"\"Step z down in ABSOLUTE command space all the way to the deep target.\n\n    The target is deliberately below the container floor: the arm's physical\n    stall, not the command, sets where the release happens, and the sustained\n    downward command is what converges the xy onto the container centre.  Do\n    not gate this on `robot_cartesian_pos` -- its xyz is reported in a frame\n    that does not track the `solve_ik` world frame on a constant offset.\n    \"\"\"\n    z_cmd = float(z_start)\n    while z_cmd > z_target:\n        z_cmd = max(z_target, z_cmd - hop)\n        goto_pose(np.array([xy[0], xy[1], z_cmd]), quat)\n    return z_cmd",
