  "code": "def descend_to(px, py, z_goal, quat, step=0.020, tag=\"\"):\n    \"\"\"Stepped descent; stops as soon as a step stops making progress.\"\"\"\n    try:\n        goto_pose(np.array([px, py, max(z_goal, tcp()[2]) + 0.02]), quat)\n    except Exception:\n        pass\n    prev = float(tcp()[2])\n    for _ in range(18):\n        cur = float(tcp()[2])\n        if cur <= z_goal + 0.002:\n            break\n        zcmd = max(z_goal, cur - step)\n        try:\n            goto_pose(np.array([px, py, zcmd]), quat)\n        except Exception as ex:\n            print(f\"  {tag} descent ik fail at {zcmd:.3f}: {ex}\", flush=True)\n            break\n        now = float(tcp()[2])\n        if now > prev - 0.003:\n            print(f\"  {tag} floor at cmd {zcmd:.3f} meas {now:.3f}\", flush=True)\n            break\n        prev = now\n    return tcp()",
