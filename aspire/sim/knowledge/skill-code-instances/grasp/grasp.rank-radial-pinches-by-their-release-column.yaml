  "observed_effect": "Candidates are ranked by the x of their RELEASE column (place - hanging_offset) ascending, not by grasp convenience: pinching the NEAR side of the object keeps the release column about one radius closer to the base. On this scene radial_-x_high (release x 0.686) is chosen over radial_+x_high (release x 0.784, outside the workspace). Ranking is gated first on |tcp - object_centre| <= 1.6*Rw + 0.010 so a planner pose cannot be promoted by a CLAMPED offset manufacturing a plausible-looking release column. Release-column miss 0.034 m -> 0.0003-0.0020 m; bowl-centre residual 0.041-0.052 m -> 0.016-0.026 m; 9 seeds flipped to success with no regression on the 6 already passing. Both azimuths grasp equally well (measured widths 0.0909 and 0.1113, both lifted) - only the release differs",
