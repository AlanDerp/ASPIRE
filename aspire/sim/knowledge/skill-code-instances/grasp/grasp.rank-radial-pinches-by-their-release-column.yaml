  "code": "def order_candidates(cands_g, bx, by, place, x_max, Rw):\n    \"\"\"Prefer pinches whose release TCP is on the near side of the bowl.\n\n    Sorting by the release column's own x does the work: the bowl hangs off the\n    TCP by ~one bowl radius, so a pinch on the far side of the bowl pushes the\n    release TCP ~5 cm further out than a pinch on the near side.  The wall probe\n    only has to disqualify, not rank - and it is a conservative *lower bound* on\n    the wall (a single long lunge reaches ~0.696 where an incremental ladder\n    reaches ~0.750), so a \"beyond\" verdict is advisory: when every candidate is\n    beyond it the ordering still puts the nearest release column first.\n\n    Only genuine wall pinches take part in that ranking.  A candidate whose TCP\n    is nowhere near the object (GraspNet returns poses for whatever mask it was\n    handed) has a meaningless hanging offset - the +-0.08 clamp in\n    hanging_offset turns a 0.19 m miss into a small fake offset, which would\n    otherwise promote it to first place and burn an attempt on an air grasp.\n    \"\"\"\n    rows = []\n    for i, c in enumerate(cands_g):\n        tcp_xy_ = np.asarray(c[2], dtype=float)[:2]\n        d = float(np.linalg.norm(tcp_xy_ - np.array([bx, by])))\n        wall = d <= 1.6 * Rw + 0.010\n        rel, off = release_column(c[2], bx, by, place)\n        if np.isfinite(x_max):\n            viol = max(0.0, float(rel[0]) - (x_max - REACH_MARGIN))\n        else:\n            viol = 0.0\n        rows.append((0 if wall else 1, 1 if viol > 1e-6 else 0,\n                     round(viol, 4), float(rel[0]), i, d, float(off[0]), float(off[1])))\n    rows.sort()\n    for nw, pref, viol, rx, i, d, ox, oy in rows:\n        c = cands_g[i]\n        note = \"not a wall pinch (TCP %.3f m from centre)\" % d if nw else \\\n               (\"beyond wall probe, conservative lower bound\" if pref else \"ok\")\n        print(f\"    {c[0]:16s} release_x={rx:.3f} offset=({ox:+.3f},{oy:+.3f}) \"\n              f\"{note} (x_max={x_max:.3f})\", flush=True)\n    return [cands_g[i] for _, _, _, _, i, _, _, _ in rows]",
