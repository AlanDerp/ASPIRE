  "code": "def attempt_pinch(cx, cy, top, z_pad, tilt_deg, err_dir, tag):\n    \"\"\"One approach + close at the pinch height; the aperture alone says whether it held.\n\n    Top-down cannot reach this object: commanded x 0.763..0.799 all saturate at 0.750, so\n    the pads stop ~13 mm short of a 26 mm-wide bottle and the close reads air (aperture\n    0.0148, gap 1.2 mm). Tipping the wrist 12-32 deg about the horizontal axis\n    perpendicular to that shortfall re-aims the pads (0.747 -> 0.754+) and the same pinch\n    then holds (aperture 0.33-0.47, gap 26-37 mm). Absolute z commands are used, not a\n    fraction ladder: measured holds cluster with the pads 0.08-0.12 up the object whatever\n    the commanded depth, and a fine-stepped ladder walks the IK into a bad basin.\n    \"\"\"\n    q = tilt_toward(err_dir, tilt_deg) if tilt_deg > 0.5 else topdown_quat(0.0)\n    Rz = float((quat_R(q) @ np.array([0.0, 0.0, 1.0]))[2])\n    z_cmd = z_pad - Rz * PAD_FROM_EEF          # pads, not the reported frame, at z_pad\n    open_gripper()\n    go(np.array([cx, cy, top + 0.10]), q)\n    go(np.array([cx, cy, z_cmd]), q)\n    axis_z = float((quat_R(cart()[3:7]) @ np.array([0.0, 0.0, 1.0]))[2])\n    p = pad_point()\n    print(\"    %s tilt=%.0f cmd_z=%.3f pads=(%.3f,%.3f,%.3f) pads_miss=(%+.3f,%+.3f) axis_z=%+.2f\"\n          % (tag, tilt_deg, z_cmd, p[0], p[1], p[2], cx - p[0], cy - p[1], axis_z), flush=True)\n    close_gripper()\n    w = raw_w()\n    print(\"      aperture after close %.4f (gap %.1f mm)\" % (w, 80.0 * w), flush=True)\n    if w < HOLD_MIN or w > HOLD_MAX:\n        print(\"      no hold -> next pinch candidate\", flush=True)\n        return None, np.array([cx - p[0], cy - p[1]])\n    go(eef_point() + np.array([0.0, 0.0, 0.08]), q)\n    go(np.array([cx, cy, top + LIFT_DZ]), q)\n    w2 = raw_w()\n    print(\"      aperture after lift %.4f\" % w2, flush=True)\n    if w2 < HOLD_MIN and w2 < 0.45 * w:\n        print(\"      slipped on the lift -> next pinch candidate\", flush=True)\n        return None, np.array([cx - p[0], cy - p[1]])\n    return dict(quat=q, lifted_w=w2, grasp=(cx, cy)), np.array([cx - p[0], cy - p[1]])",
