  "observed_effect": "Two rules. (1) Put the air threshold in the measured GAP between the populations (AIR_W = 0.030 here), not at the nominal gripper half-opening: a settled one-pad pinch on a 10.5 cm bowl legitimately reads 0.042-0.050, and the 0.05 form classified it as air. (2) Keep the test ONE-SIDED (w2 < AIR_W only). Do NOT also reject on a large post-lift closing delta: on a marginal wall pinch the bowl slides down its own wall until it wedges near the base, so the aperture settles close 0.1034 -> lift 0.0834 -> +0.26 s 0.0430 -- that is settling, not loss, and an upper SLIP_DELTA bound threw away every usable grip on the long-carry seeds. Seed 62 before: 'lost w=0.083 -> 0.050' on every pinch, budget exhausted, reward 0.0; after: 'HELD w=0.083 w_lift=0.050', carry converged err=0.0058, release at bottom=0.001. Passing seeds read 0.070-0.074 post-lift and are unchanged",
