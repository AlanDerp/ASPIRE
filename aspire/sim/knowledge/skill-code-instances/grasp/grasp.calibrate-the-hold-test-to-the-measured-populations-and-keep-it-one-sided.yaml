  "code": "def attempt_grasp(spec, wall_u, r_off):\n    \"\"\"One radial wall pinch at azimuth `wall_u` with radius offset `r_off`.\"\"\"\n    p = spec[\"target\"]\n    pts, c = p[\"pts\"], p[\"c\"]\n    rim_z = float(np.percentile(pts[:, 2], 97))\n    lo_z = float(np.percentile(pts[:, 2], 2))\n    gz = rim_z - 0.014\n    if gz <= lo_z + 0.006:\n        gz = lo_z + 0.5 * (rim_z - lo_z)\n    r_rim = shell_radius(pts, c[:2], gz, 0.014)\n    if r_rim is None:\n        r_rim = 0.5 * max(float(p[\"e\"][0]), float(p[\"e\"][1]))\n    r_g = r_rim + r_off\n    u = np.asarray(wall_u, dtype=np.float64)\n    phi = math.degrees(math.atan2(u[1], u[0]))\n    q = make_topdown_quat(phi + 90.0)\n    tgt = np.array([c[0] + r_g * u[0], c[1] + r_g * u[1], gz])\n    print(f\"    pinch u=({u[0]:.0f},{u[1]:.0f}) off={r_off:+.3f} r_rim={r_rim:.4f} \"\n          f\"gz={gz:.3f} tcp=({tgt[0]:.3f},{tgt[1]:.3f})\", flush=True)\n\n    open_gripper()\n    go(tgt[0], tgt[1], tgt[2] + 0.12, q)\n    z_g = float(tgt[2])\n    go(tgt[0], tgt[1], z_g, q)\n    close_gripper()\n    for _ in range(6):\n        get_observation()\n    w = gap()\n    # A radial wall pinch can miss the wall entirely: both pads end up outside the bowl and the\n    # reading collapses to the empty-gripper value.  Deepen IN PLACE instead of paying for a\n    # fresh approach -- the bowl flares outward below its rim, so a few mm lower finds wall.\n    for extra in (0.010, 0.020):\n        if w >= AIR_W:\n            break\n        print(f\"      air grasp w={w:.3f}; deepening {extra:.3f}\", flush=True)\n        open_gripper()\n        z_g = float(tgt[2]) - extra\n        go(tgt[0], tgt[1], z_g, q)\n        close_gripper()\n        for _ in range(6):\n            get_observation()\n        w = gap()\n    if w < AIR_W:\n        print(f\"      air grasp w={w:.3f}\", flush=True)\n        return None\n    go(tgt[0], tgt[1], z_g + 0.06, q)\n    go(tgt[0], tgt[1], z_g + 0.20, q)\n    # the bowl settles between the pads once it carries its own weight: re-seat the pinch\n    # here rather than travelling on a grip that has already relaxed.\n    close_gripper()\n    for _ in range(8):\n        get_observation()\n    w2 = gap()\n    # The ONLY failure this gate must catch is the object not coming along, and that reads at the\n    # empty-gripper aperture.  Do NOT also reject on a large closing delta: on a marginal pinch\n    # the bowl slides down its own wall until it wedges near the base, so the gap settles from\n    # ~0.11 to ~0.043.  That is settling, not loss, and rejecting it (as an upper SLIP_DELTA\n    # bound did) threw away every usable grip on the long-carry seeds.\n    if w2 < AIR_W:\n        print(f\"      lost w={w:.3f} -> {w2:.3f}\", flush=True)\n        return None\n    print(f\"      HELD w={w:.3f} w_lift={w2:.3f}\", flush=True)\n    return {\"quat\": q, \"w\": w2, \"gz\": z_g, \"r_g\": r_g}",
