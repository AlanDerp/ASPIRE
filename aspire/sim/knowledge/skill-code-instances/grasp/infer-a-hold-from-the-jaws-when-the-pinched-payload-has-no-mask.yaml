  "code": "def hold_rise(noun, zbot):\n    \"\"\"How far the payload rose above its pre-grasp height, and the mask behind it.\n\n    Three signals, strongest first: a payload-sized mask near the hand (relaxed,\n    because the pads occlude a held slab); the payload back on the table, which\n    means the grip slipped; and -- when no mask of it exists anywhere on the\n    table while the jaws read loaded -- the hold is inferred from the jaws.\n    That last case is real: a pinched slab is exactly the object SAM3 struggles\n    to see, and reporting \"not lifted\" there throws away a good grasp.\n    \"\"\"\n    now = payload_now(noun, relaxed=True)\n    if now is not None:\n        return float(now[\"zlo\"] - zbot), now\n    rgb, d, K, E = view()\n    tab = find_payload(rgb, d, K, E, noun, on_table=True)\n    if tab is not None:\n        return float(tab[\"zlo\"] - zbot), tab\n    if float(eef()[7]) >= 0.12:\n        print(\"  hold inferred: payload is off the table and the jaws carry a load\", flush=True)\n        return 9.0, None\n    return -9.0, None",
