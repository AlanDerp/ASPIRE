  "code": "def hop_to(px, py, pz, quat, step=HOP):\n    \"\"\"Walk to a Cartesian target in <=step hops, re-reading the measured TCP.\n\n    A single long hop falls outside the warm-started IK solver's basin and lands\n    short while still reporting success.\n    \"\"\"\n    cur = tcp()\n    d = np.array([px, py, pz]) - cur\n    n = max(1, int(np.ceil(float(np.linalg.norm(d)) / step)))\n    for i in range(1, n + 1):\n        goto_pose(cur + d * (i / n), quat)\n    return tcp()",
