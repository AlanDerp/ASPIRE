  "observed_effect": "Fixes seed 57 (reward 0 -> 1). The grasp-time tcp_to_bottom = fingertip_z - bowl_bottom is measured before the pinch carries the object weight: 0.0249 m on seed 51 against 0.0455 m measured in the air; seed 57 0.0271 vs 0.0385; seed 58 0.0246 vs 0.0588; 0.024-0.027 vs 0.035-0.068 over all 15 seeds - a 1.1-3.4 cm under-estimate that drove the bowl lowest points to z = 0.004-0.011 against a plate top of 0.005, so the light smooth plate squirted out sideways. The measurement needs an xy window AND a z floor (z_floor = gz_now - 0.12): without the floor the window returns a dark table mask and the object-height sanity band rejects everything - measured as a 0.395 m hang on all 15 seeds, i.e. the fix was inert until the floor was added. Shipped revision scores 13/15 on dev seeds.",
