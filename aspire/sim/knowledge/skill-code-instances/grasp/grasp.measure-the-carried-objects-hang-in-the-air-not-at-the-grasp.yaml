  "code": "def hanging_drop(cur_xy, fallback, frames=None):\n    \"\"\"Measure how far the carried bowl's *bottom* hangs below the wrist.\n\n    The grasp-time estimate `gz - b_lo` is taken while the bowl still rests on\n    the table, i.e. before the pinch has taken its weight.  A radial wall pinch\n    is not a form clamp: the bowl settles a centimetre or more deeper between\n    the fingers as soon as it is lifted, so that estimate *understates* the\n    hang, and the release height built from it puts the bowl's bottom at or\n    below the plate's top surface.  The gripper then drives the bowl into the\n    plate for the last centimetre of the descent, and the plate - a light, flat,\n    smooth disc - squirts out sideways from under it.  Measured on this suite:\n    estimate 0.024 m, true hang 0.041 m on both a passing and a failing seed,\n    and the bowl's own points reach z = 0.004-0.011 against a plate top of\n    0.005 at the last descent step.  So measure the hang with the bowl in the\n    air, at the carry column where the only thing in the window is the bowl and\n    the fingers (which stop well above its bottom).  The window needs the\n    `z_floor` too: the table top under the wrist sits inside it at z ~ 0, and a\n    dark table/plate mask can otherwise clear the point count by itself.\n    \"\"\"\n    try:\n        gz_now = float(get_observation()[\"robot_cartesian_pos\"][2]) - REPORT_OFFSET\n        if frames is None:\n            rgb, d, K, E = observe()\n        else:\n            rgb, d, K, E = frames\n        pts = bowl_points_near(rgb, d, K, E, cur_xy, radius=0.12,\n                               z_floor=gz_now - 0.12)\n        if pts is None or len(pts) < 40:\n            return fallback\n        b = float(np.percentile(pts[:, 2], 2))\n        hang = gz_now - b\n        if not (0.005 < hang < 0.10):       # bowl 5-6 cm tall: sanity band\n            return fallback\n        # Only a hard ceiling against a wild measurement - do *not* clamp this\n        # back towards the grasp estimate, which is the very number the fix is\n        # correcting for.  Measured across seeds 51-65 the hang is 0.035-0.062 m\n        # against an estimate of ~0.02: clamping the deepest ones (0.057) to\n        # estimate + 0.025 would put that bowl's bottom back within 3 mm of the\n        # plate and re-run the collision this fix exists to remove.\n        hang = min(hang, 0.070)\n        print(f\"  carried-bowl hang: measured {hang:.4f} vs grasp estimate \"\n              f\"{fallback:.4f}\", flush=True)\n        return max(fallback, hang)\n    except Exception as e:\n        print(f\"  hang measurement failed: {type(e).__name__}\", flush=True)\n        return fallback",
