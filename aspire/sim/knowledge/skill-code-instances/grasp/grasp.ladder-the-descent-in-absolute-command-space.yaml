  "code": "def descend_to(px, py, z_goal, quat, step=0.020, tag=\"\", iters=28):\n    \"\"\"Stepped descent; breaks as soon as a step stops making progress.\n\n    The ladder is ABSOLUTE (`zcmd -= step`), never relative to the measured z:\n    the arm tracks `goto_pose` with a constant ~1.3 cm vertical lag, so a\n    relative ladder nets only ~0.7 cm of real descent per command and runs out\n    of iterations well above the object.  Breaking on LACK OF PROGRESS (rather\n    than on a fixed command-vs-measured gap) is what stops the loop re-issuing\n    the same command forever at the floor.\n    \"\"\"\n    zcmd = max(z_goal, float(tcp()[2]) + 0.02)\n    try:\n        goto_pose(np.array([px, py, zcmd]), quat)\n    except Exception:\n        pass\n    prev = float(tcp()[2])\n    for _ in range(iters):\n        zcmd = max(z_goal, zcmd - step)\n        try:\n            goto_pose(np.array([px, py, zcmd]), quat)\n        except Exception as ex:\n            print(\"  %s descent ik fail at %.3f: %s\" % (tag, zcmd, ex), flush=True)\n            break\n        now = float(tcp()[2])\n        if now > prev - 0.003:\n            print(\"  %s floor at cmd %.3f meas %.3f\" % (tag, zcmd, now), flush=True)\n            break\n        prev = now\n        if zcmd <= z_goal + 1e-9:\n            break\n    return tcp()",
