  "observed_effect": "Subtracting the step from the previous COMMAND rather than from the measured z nets the full step per command instead of step minus the tracking lag. On seed 51 the arm tracked each goto_pose with a constant 1.27-1.34 cm vertical lag (cmd 0.278 -> meas 0.2914, cmd 0.271 -> meas 0.2841, cmd 0.264 -> meas 0.2768), so the relative ladder travelled only ~0.007 m per 0.020 m command and the 18-iteration budget expired at z 0.161-0.165 with the bottle top at 0.148 and the true floor at 0.122-0.123. Every yaw candidate was then rejected by the relative height gate and the program raised 'could not grasp the dressing'. With the absolute ladder (plus break-on-no-progress and a budget of 28) every seed logs 'floor at cmd 0.088-0.089 meas 0.122-0.123', closes at 0.122-0.123, and takes the task from 0/15 to 15/15. This is NOT the kinematic floor: the floor pattern stops on genuine loss of progress and prints its diagnostic, this one stalls on budget exhaustion and prints nothing. It also CORRECTS the relative form promoted from bbq_sauce (grasp.position-dependent-kinematic-floor-lateral-drift), where the same relative ladder happened to reach its floor inside 18 iterations",
