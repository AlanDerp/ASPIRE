  "observed_effect": "Pinch the wall AWAY from the goal so the payload hangs on the GOAL side of the tool. A payload pinched on the goal-facing wall hangs BEHIND the tool, so dropping it on the goal centre requires driving the tool one payload radius PAST the goal; a payload pinched on the far wall hangs goal-side and the release column is one radius SHORT of the goal. Concretely: sort the four wall normals u by float(np.array(u) @ d) ascending, so the normal most anti-aligned with the goal direction d is tried first (walls.sort(key=lambda u: float(np.array(u) @ d))). Here the goal-facing-wall version commanded release columns x=0.764-0.789 against a hard clamp the arm never exceeds (x~0.750), stalling 2-4 cm short and leaving the bowl on the near edge; the away-wall version commands x~0.685, comfortably inside. Drop accuracy 0.028-0.051 m -> 0.003-0.008 m; dev reward 12/15 -> 15/15 (seeds 58,59,63 fixed)",
