  "code": "def profile(tcp_xy, quat, zr, label, bowl):\n    print(\"  --- %s tcp_xy=(%.3f,%.3f) zr=%.3f\" % (label, tcp_xy[0], tcp_xy[1], zr), flush=True)\n    open_gripper()\n    go([tcp_xy[0], tcp_xy[1], zr + 0.11], quat, tag=\"approach\")\n    # The arm tracks ~1 cm HIGH of each commanded height, so a 6-hop descent\n    # from the zr+0.11 approach bottoms out around zr+0.02 - above the bowl's\n    # rim - and the pinch then closes on air (measured gap 0.0010-0.0020 on\n    # seeds 62/63/64, every candidate).  Keep hopping until the TCP has really\n    # reached the pinch height, and give up as soon as the achieved height\n    # stops dropping (drawer floor or bowl wall blocks the fingers).\n    z = float(tcp()[2]) + 0.02\n    last = None\n    for _ in range(14):\n        z -= 0.02\n        if z < zr - 0.05:\n            break\n        go([tcp_xy[0], tcp_xy[1], z], quat, tag=\"hop\")\n        zc = float(tcp()[2])\n        if zc < zr + 0.004:\n            break\n        if last is not None and zc > last - 0.004:\n            print(\"      descent blocked at z=%.3f\" % zc, flush=True)\n            break\n        last = zc\n    pinch_z = float(tcp()[2])\n    print(\"      reached z=%.3f (target %.3f)\" % (pinch_z, zr), flush=True)\n    close_gripper()\n    close_gripper()\n    g = gap()\n    print(\"      gap=%.4f\" % g, flush=True)\n    if AIR_GAP < g < BLOCK_GAP:\n        go([tcp_xy[0], tcp_xy[1], zr + 0.11], quat, tag=\"lift\")\n        held = gap()\n        t = tcp()\n        print(\"      lift gap=%.4f tcp=%s\" % (held, np.round(t, 3).tolist()), flush=True)\n        if held > AIR_GAP:\n            pinch_off = bowl[\"c\"] - np.array([tcp_xy[0], tcp_xy[1]], dtype=np.float64)\n            cd = bowl_near(t[:2])\n            lift_off = None if cd is None else cd[\"c\"] - t[:2]\n            print(\"      offset pinch=%s lift=%s\" % (np.round(pinch_off, 3).tolist(),\n                                                     \"None\" if lift_off is None else np.round(lift_off, 3).tolist()),\n                  flush=True)\n            return {\"quat\": quat, \"tcp\": t, \"pinch_offset\": pinch_off,\n                    \"offset\": lift_off if lift_off is not None else pinch_off,\n                    \"bottom_gap\": float(pinch_z - bowl[\"z_lo\"])}\n    open_gripper()\n    go([tcp_xy[0], tcp_xy[1], zr + 0.15], quat, tag=\"retreat\")\n    return None",
