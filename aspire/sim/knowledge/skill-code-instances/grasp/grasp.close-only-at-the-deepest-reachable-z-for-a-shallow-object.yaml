  "code": "def pinch(target, yaw, tag):\n    \"\"\"Monotone descent to the deepest reachable z, then close there.\"\"\"\n    bx, by = float(target[\"centre\"][0]), float(target[\"centre\"][1])\n    quat = td_quat(yaw)\n    open_gripper()\n    z = HOVER + 0.06\n    move([bx, by, z], quat)\n    meas = float(eef()[2])\n    while z > FLOOR:\n        z = max(FLOOR, z - STEP)\n        move([bx, by, z], quat)\n        now = float(eef()[2])\n        if now > meas - 0.004:                       # stalled -> fingers are on something\n            print(f\"  [{tag}] floor at cmd {z:.3f} meas_z {now:.4f}\", flush=True)\n            break\n        meas = now\n    close_gripper()\n    width = grip_width()\n    print(f\"  [{tag}] yaw={yaw:.1f} xy=({bx:.3f},{by:.3f}) meas_z={float(eef()[2]):.4f} width={width:.4f}\",\n          flush=True)\n    return width >= GRIP_MIN, quat, bx, by",
