  "code": "def grasp_box(bx, by, quat):\n    \"\"\"Top-down pinch of the box.  Returns the gap held after the lift, or None.\"\"\"\n    open_gripper()\n    if not move_to(np.array([bx, by, CARRY_Z]), quat):\n        return None\n    # deepest the IK clamp allows: the pads straddle the box and catch its top\n    descend_to(bx, by, IK_MIN_Z + Z_CMD_REP_OFFSET, quat)\n    # descend_to stops once its step budget is met and the arm is often still\n    # lagging a millimetre above the IK clamp.  That lag is the difference\n    # between the pads straddling the box and the pads skating off its top\n    # face and closing on air, so press until the reported z stops moving.\n    prev = float(tcp()[2])\n    for _ in range(8):\n        press_cmd(cmd_of([bx, by, IK_MIN_Z + Z_CMD_REP_OFFSET]), quat)\n        cur = float(tcp()[2])\n        if prev - cur < 0.0005:\n            break\n        prev = cur\n    z_deep = tcp()[2]\n    print(f\"  pinch tcp=({tcp()[0]:.3f},{tcp()[1]:.3f},{z_deep:.4f})\", flush=True)\n    close_gripper()\n    held = gap()\n    print(f\"  gap after close = {held:.4f} m\", flush=True)\n    if not (GRASP_MIN_GAP < held < GRASP_MAX_GAP):\n        print(\"  AIR GRASP - nothing between the fingers\", flush=True)\n        open_gripper()\n        move_to(np.array([bx, by, CARRY_Z]), quat)\n        return None\n    move_to(np.array([bx, by, CARRY_Z]), quat)\n    after = gap()\n    print(f\"  gap after lift  = {after:.4f} m\", flush=True)\n    if abs(after - held) > 0.02:\n        print(\"  box slipped out during the lift\", flush=True)\n        return None\n    return z_deep",
