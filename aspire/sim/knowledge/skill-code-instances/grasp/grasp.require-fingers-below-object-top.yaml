  "code": "def grasp(bx, by, gz, top_z, quat, step=0.015):\n    \"\"\"Stepped descent toward gz, closing at the lowest height actually reached.\n\n    Returns the measured TCP z at the moment of closing, or None if the finger\n    never got below the bottle's top.\n    \"\"\"\n    goto_home_joint_position()\n    open_gripper()\n    zcmd = gz + 0.10\n    move_tcp([bx, by, zcmd], quat, tol=0.030, retries=1)\n    meas = achieved_tcp()[2]\n    while zcmd > gz:\n        zcmd = max(gz, zcmd - step)\n        move_tcp([bx, by, zcmd], quat, tol=0.030, retries=0)\n        now = achieved_tcp()[2]\n        if now > meas - 0.004:            # no further progress -> kinematic floor\n            print(f\"  descent floor at cmd {zcmd:.3f} meas {now:.3f}\", flush=True)\n            break\n        meas = now\n    if meas > top_z - 0.005:              # fingers still above the bottle\n        print(f\"  gripper above bottle (meas {meas:.3f} vs top {top_z:.3f})\",\n              flush=True)\n        return None\n    close_gripper()\n    ap = float(ee_pose()[7])\n    print(f\"  closed at tcp_z {meas:.3f} aperture {ap:.3f}\", flush=True)\n    if ap <= 0.05:\n        return None\n    lift_err = move_tcp([bx, by, meas + 0.06], quat, tol=0.030, retries=0)[1]\n    ap2 = float(ee_pose()[7])\n    print(f\"  lift check aperture {ap2:.3f} (move err {lift_err:.3f})\", flush=True)\n    if ap2 <= 0.05:\n        return None\n    return meas",
