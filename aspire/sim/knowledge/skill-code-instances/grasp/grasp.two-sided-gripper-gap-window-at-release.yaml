  "code": "def place(basket_xy, quat):\n    bx, by = float(basket_xy[0]), float(basket_xy[1])\n    cur = tcp()\n    goto_pose(np.array([cur[0], cur[1], CARRY_Z]), quat)\n    hop_to(bx, by, CARRY_Z, quat)\n    # over-command the descent well below the basket floor: the physical stall, not\n    # the commanded depth, sets the release height and converges the xy.\n    below(bx, by, CARRY_Z, 0.06, quat)\n    print(\"  release tcp=%s\" % np.round(tcp(), 3), flush=True)\n    open_gripper()\n    for _ in range(10):\n        get_observation()\n    # A released object leaves the fingers fully open (~0.080 m).  A gap that is open\n    # but short of full means something is still wedged between the pads - note this is\n    # an upper bound as well as a lower one: a naive `gap() > AIR_GAP` test is true for\n    # a *successfully released* can, because 0.080 > 0.030.\n    g = gap()\n    if AIR_GAP < g < 0.075:\n        print(\"  release blocked gap=%.4f\" % g, flush=True)\n        cur = tcp()\n        below(cur[0], cur[1], cur[2], cur[2] - 0.03, quat)\n        open_gripper()\n        for _ in range(6):\n            get_observation()\n    goto_pose(np.array([bx, by, 0.40]), quat)\n    for _ in range(4):\n        get_observation()",
