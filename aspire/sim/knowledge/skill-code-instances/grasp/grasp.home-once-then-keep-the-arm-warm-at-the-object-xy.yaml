  "code": "def grasp_target(obj):\n    bot, top = float(obj[\"lo\"][2]), float(obj[\"hi\"][2])\n    cx, cy = float(obj[\"c\"][0]), float(obj[\"c\"][1])\n    print(\"  grasp: c=(%.3f,%.3f) bot=%.3f top=%.3f h=%.3f\" % (cx, cy, bot, top, top - bot),\n          flush=True)\n    z_pad = bot + PINCH_LEVEL * (top - bot)\n    goto_home_joint_position()\n    err_dir = np.array([1.0, 0.0])\n    for i, th in enumerate(TILT_LADDER):\n        hold, miss = attempt_pinch(cx, cy, top, z_pad, th, err_dir, \"cand%d\" % i)\n        if hold is not None:\n            return hold\n        if float(np.linalg.norm(miss)) > 0.004:\n            err_dir = miss / float(np.linalg.norm(miss))\n    return None",
