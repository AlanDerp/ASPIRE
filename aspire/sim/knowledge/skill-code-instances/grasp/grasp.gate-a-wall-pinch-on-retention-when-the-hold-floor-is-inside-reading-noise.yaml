  "goal": "Decide whether a one-pad radial wall pinch actually holds, when the aperture reading after the lift floors only a few counts above the air threshold.",
  "id": "grasp.gate-a-wall-pinch-on-retention-when-the-hold-floor-is-inside-reading-noise",
