  "code": "def grasp_bowl(bowl, goal_xy):\n    \"\"\"Radial wall pinch: the object is wider than the gripper, so pinch one wall.\"\"\"\n    lo, hi = bowl[\"lo\"], bowl[\"hi\"]\n    h = float(hi[2] - lo[2])\n    zr = float(lo[2]) + 0.62 * h\n    pts = bowl[\"pts\"]\n    slab = pts[np.abs(pts[:, 2] - zr) < 0.014]\n    if len(slab) < 25:\n        slab = pts[np.abs(pts[:, 2] - (lo[2] + 0.5 * h)) < 0.020]\n    if len(slab) < 25:\n        slab = pts\n    slo = np.percentile(slab, 2, axis=0)\n    shi = np.percentile(slab, 98, axis=0)\n    cxy = 0.5 * (slo + shi)\n    Rw = 0.5 * max(float(shi[0] - slo[0]), float(shi[1] - slo[1]))\n    Rw = float(np.clip(Rw, 0.025, 0.070))\n    print(\"  grasp bowl: c=(%.3f,%.3f) base=%.4f top=%.4f zr=%.4f Rw=%.4f\"\n          % (cxy[0], cxy[1], lo[2], hi[2], zr, Rw), flush=True)\n\n    dvec = np.array([goal_xy[0] - cxy[0], goal_xy[1] - cxy[1]], dtype=float)\n    n = float(np.linalg.norm(dvec))\n    dvec = dvec / n if n > 1e-6 else np.array([1.0, 0.0])\n    walls = [np.array([1.0, 0.0]), np.array([-1.0, 0.0]),\n             np.array([0.0, 1.0]), np.array([0.0, -1.0])]\n    # pinch the wall AWAY from the goal: the payload then hangs goal-side and the\n    # release column is one radius SHORT of the goal instead of past the reach clamp.\n    walls.sort(key=lambda u: float(u @ dvec))\n\n    closes = 0\n    for u in walls:\n        phi = math.degrees(math.atan2(float(u[1]), float(u[0])))\n        q = make_topdown_quat(phi + 90.0)\n        airs = 0\n        for off in PINCH_OFFSETS:\n            if closes >= MAX_CLOSES:\n                return None\n            R2 = Rw + off\n            tx = float(cxy[0] + R2 * u[0])\n            ty = float(cxy[1] + R2 * u[1])\n            cur = tcp()\n            hop_to(cur[0], cur[1], zr + 0.12, q)\n            hop_to(tx, ty, zr + 0.12, q)\n            # descend, re-reading the achieved z; break on lack of progress\n            zcmd = zr + 0.12\n            prev = None\n            floor = None\n            for _ in range(14):\n                zcmd = max(zr - 0.02, zcmd - HOP)\n                goto_pose(np.array([tx, ty, zcmd]), q)\n                now = float(tcp()[2])\n                if prev is not None and now > prev - 0.004:\n                    floor = now\n                    break\n                prev = now\n                if now <= zr + 0.004:\n                    break\n            if floor is not None:\n                print(\"    descent floor at cmd %.3f meas %.3f\" % (zcmd, floor), flush=True)\n            close_gripper()\n            closes += 1\n            w = raw_w()\n            print(\"    wall=%s off=%+.3f tcp=(%.3f,%.3f) close w=%.4f\"\n                  % (np.round(u, 2).tolist(), off, tx, ty, w), flush=True)\n            if w >= AIR_W:\n                cur = tcp()\n                goto_pose(np.array([cur[0], cur[1], cur[2] + 0.06]), q)\n                goto_pose(np.array([cur[0], cur[1], cur[2] + 0.16]), q)\n                w2 = raw_w()\n                # accept on retention, not on an absolute floor: a wedged wall pinch\n                # legitimately re-reads as low as 0.052 raw (measured across 15 seeds),\n                # which is only 2 counts above the air threshold.\n                held = (w2 >= AIR_W) or (w2 >= 0.45 * w)\n                print(\"    lift w=%.4f held=%s\" % (w2, held), flush=True)\n                if held:\n                    return dict(quat=q, wall=u, Rw=R2, cxy=np.array([cxy[0], cxy[1]]),\n                                width=w, width2=w2, grasp_tcp=tcp(), base=float(lo[2]))\n                goto_pose(np.array([tx, ty, zr + 0.12]), q)\n            open_gripper()\n            airs += 1\n            if airs >= 2:\n                break                        # this wall's radius estimate is bad\n    return None",
