  "observed_effect": "Accept on retention: held = (w2 >= AIR_W) or (w2 >= 0.45 * w), keeping both terms. An air close collapses toward 0 on the lift (ratio about 1.0 of a value already below the threshold); a real wedge pinch holds a ratio of 0.45-0.60. The absolute term still rejects the air close at close time, the ratio protects the lift check. Trigger rule: add the ratio term when AIR_W and the hold floor are within a few counts; when they are far apart the absolute test alone suffices.",
