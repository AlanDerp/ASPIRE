  "code": "def hop_to(px, py, pz, quat, step=HOP, tol=0.010, max_iter=30):\n    \"\"\"Walk to a Cartesian target in <=step hops, re-reading the MEASURED TCP every hop.\n\n    A SINGLE large goto_pose falls outside the solver's warm-started basin even when the\n    target is plainly reachable.  Measured on this scene: a command from home to\n    (0.703,-0.289,0.42) landed at (0.453,-0.208,0.227) - 25 cm away in x - and another to\n    (0.653,-0.239,0.42) landed at (0.756,-0.279,0.473), with move_to_joints reporting\n    success both times.  Re-reading the achieved TCP each hop keeps every step inside the\n    basin and stops the error accumulating, because the next command is derived from where\n    the tool actually is rather than from the original snapshot.\n    \"\"\"\n    for _ in range(max_iter):\n        cur = tcp()\n        d = np.array([px, py, pz], dtype=float) - cur\n        nd = float(np.linalg.norm(d))\n        if nd < tol:\n            break\n        nxt = cur + d * min(1.0, step / max(nd, 1e-6))\n        try:\n            goto_pose(nxt, quat)\n        except Exception:\n            break\n    return tcp()",
