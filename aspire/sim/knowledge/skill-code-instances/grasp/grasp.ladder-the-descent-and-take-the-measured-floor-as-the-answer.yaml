  "code": "def descend_to(target_world, quat, label=\"\", budget=DESC_BUDGET):\n    \"\"\"Descend in <=MAX_HOP steps, holding the target xy; stop on loss of progress.\"\"\"\n    meas = tcp_world()\n    prev = None\n    stall = 0\n    for i in range(budget):\n        cur = tcp_world()\n        nxt = cur.copy()\n        nxt[2] = max(float(target_world[2]), cur[2] - MAX_HOP)\n        nxt[0] = float(target_world[0])\n        nxt[1] = float(target_world[1])\n        try:\n            goto_pose(nxt, quat)\n        except Exception as exc:\n            print(f\"  {label} hop {i}: motion failed ({type(exc).__name__})\", flush=True)\n            break\n        meas = tcp_world()\n        if i % 3 == 0 or meas[2] < 0.12:\n            print(\n                f\"  {label} hop {i}: cmd z={nxt[2]:.4f} \"\n                f\"meas=({meas[0]:.3f},{meas[1]:.3f},{meas[2]:.4f})\",\n                flush=True,\n            )\n        if meas[2] <= float(target_world[2]) + 0.004:\n            break\n        if prev is not None and abs(meas[2] - prev) < STALL_EPS:\n            stall += 1\n            if stall >= STALL_HOPS:\n                print(f\"  {label} stalled at z={meas[2]:.4f}\", flush=True)\n                break\n        else:\n            stall = 0\n        prev = meas[2]\n    xy_err = float(np.linalg.norm(meas[:2] - np.asarray(target_world[:2], dtype=float)))\n    print(f\"  {label} floor z={meas[2]:.4f} xy_err={xy_err:.4f}\", flush=True)\n    return meas",
