  "observed_effect": "Approach laterally instead. Q_LAT = (0, 0.8660254, 0, -0.5) puts the tool axis 60 deg off vertical (tool z = (-0.866, 0, -0.5)) while the fingers STILL close along +-y -- the rotation is about the closing axis, and that is what preserves the grasp: the two contact faces are the same ones a successful top-down pinch uses. The hand body then sits 5 cm above and 8.7 cm +x of the pad point, so the only gripper part near the table is the tilted finger and the pads can be centred on the slab's own mid-height; the vertical floor stops mattering because the pads are placed by the COMMAND rather than by where the tips stall. Seat to tgt + 0.085*axis first so the IK finds a branch from outside, close, climb out along the tool axis, then re-orient to TOP_DOWN in free space. Judge the returned pose by its CLOSING AXIS and its tool-z tilt (|tool_z[2]| >= 0.30 and |R[:,1][1]| >= 0.85), never by the commanded quaternion: the IK returned a functionally usable fallback branch (tool z (-0.6, 0.09, -0.8)) that an exact-quaternion gate rejected at the margin. Load-bearing on 4 of 15 development seeds (55, 61, 62, 65), each with a full pinch 0.0421-0.0425 where the top-down ladder came up empty on every rung; seeds 55 and 62 scored 0.0 before this existed and 61 and 65 reached 1.0 only with it",
