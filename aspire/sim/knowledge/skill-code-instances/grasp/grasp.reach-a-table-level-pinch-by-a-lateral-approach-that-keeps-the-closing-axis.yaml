  "code": "def lateral_grasp(b):\n    \"\"\"Second chance: come at the slab from the side instead of from above.\n\n    With the tool axis 60 deg off vertical (pointing down-and-+x) the pads are\n    placed by the COMMAND, not by where the finger tips happen to stall: the\n    hand body is 5 cm above and 8.7 cm +x of the pad point, so the only part of\n    the gripper near the table is the tilted finger, and the pads can be centred\n    on the slab's own mid-height.  The fingers still close along +-y, so the two\n    contact faces are the same ones a successful top-down pinch uses.  Once\n    gripped, the wrist is re-oriented to TOP_DOWN in free space with the slab\n    well clear of the table.\n    \"\"\"\n    c, top = b[\"c\"], b[\"top\"]\n    z_pinch = top - 0.5 * float(b[\"span\"][2])          # the slab's mid-height\n    axis = np.array([0.8660254, 0.0, 0.5])             # from the pad point back to the hand\n    tgt = np.array([c[0], c[1], z_pinch])\n    print(\"  lateral: pad point (%.3f, %.3f, %.3f)\" % (c[0], c[1], z_pinch), flush=True)\n    seat(tgt + 0.085 * axis, Q_LAT, iters=3, tol=0.010, tag=\"lat-far\")\n    c_ok = seat(tgt, Q_LAT, tag=\"lat-pinch\")\n    short = float(np.linalg.norm(c_ok - tgt))\n    if short > 0.018:\n        # the seat saturates when the IK picks another branch (or the reach clamp\n        # stops the hand): the pad point then never gets near the slab at all.\n        # Measured on seed 54: the first seat parked 0.169 high, and re-seating\n        # through a descending ladder put the pads within 0.026 of the pad line.\n        print(\"  lateral: pad point short by %.3f -- re-seating from high\" % short,\n              flush=True)\n        for h in (0.22, 0.14, 0.06):\n            goto_pose(tgt + np.array([0.0, 0.0, h]) + 0.02 * axis, Q_LAT)\n        c_ok = seat(tgt, Q_LAT, tag=\"lat-retry\")\n        short = float(np.linalg.norm(c_ok - tgt))\n        if short > 0.032:\n            print(\"  lateral: still short by %.3f -- giving up on this approach\" % short,\n                  flush=True)\n            return False\n        print(\"  lateral: closing %.3f off the pad line\" % short, flush=True)\n    tz = tool_z(raw()[3:7])\n    closing = quat_to_R(raw()[3:7])[:, 1]\n    if abs(float(tz[2])) < 0.30 or abs(float(closing[1])) < 0.85:\n        print(\"  lateral: bad pose (tool z %s, closing axis %s)\"\n              % (np.round(tz, 2).tolist(), np.round(closing, 2).tolist()), flush=True)\n        return False\n    close_gripper()\n    g = gap()\n    print(\"  lateral gap=%.4f %s\" % (g, \"GRIP\" if bite_ok(g) else \"no bite\"), flush=True)\n    if not bite_ok(g):\n        return False\n    for s in (0.05, 0.10):                             # climb out along the tool axis\n        go(np.array([c[0], c[1], z_pinch]) + s * axis, Q_LAT)\n        close_gripper()\n    if not bite_ok():\n        print(\"  lateral: lost on the climb-out\", flush=True)\n        return False\n    seat(np.array([c[0], c[1], z_pinch + 0.15]), TOP_DOWN, iters=3, tol=0.012,\n         tag=\"lat-flip\")\n    if not bite_ok():\n        print(\"  lateral: lost on the re-orient to top-down\", flush=True)\n        return False\n    for z in (z_pinch + 0.22, z_pinch + 0.30):\n        go(np.array([c[0], c[1], z]), TOP_DOWN)\n        close_gripper()\n    return bite_ok()",
