  "code": "for k, dphi in enumerate((0.0, 90.0, 180.0, 270.0, 45.0, 225.0)):\n        obs = get_observation()\n        st = bowl_state(obs)\n        if st is None:\n            continue\n        c, rim_z = st[\"xy\"], st[\"rim_z\"]\n        gz = rim_z - 0.014\n        r_g = shell_radius(st[\"pts\"], c, gz, 0.014)\n        if r_g is None:\n            r_g = shell_radius(st[\"pts\"], c, rim_z - 0.006, 0.012)\n        if r_g is None:\n            r_g = 0.045\n        if k >= 4:\n            r_g *= 0.88\n        phi = phi0 + dphi\n        d = np.array([np.cos(np.radians(phi)), np.sin(np.radians(phi))])\n        cand = np.array([c[0] + r_g * d[0], c[1] + r_g * d[1], gz])\n        q = make_topdown_quat(phi + 90.0)      # closing axis radial to the bowl\n        print(\"try %d phi=%.0f gz=%.3f r_g=%.4f tcp=%s\"\n              % (k, phi, gz, r_g, np.round(cand, 3)), flush=True)\n        open_gripper()\n        goto_pose(cand, q, z_approach=0.09)\n        close_gripper()\n        w = gripper_norm(get_observation())\n        up = np.array([cand[0], cand[1], cand[2] + 0.16])\n        goto_pose(up, q)\n        st2 = bowl_state(get_observation())\n        zmax = st2[\"zmax\"] if st2 is not None else -9.0\n        print(\"   gripper=%.4f bowl_zmax=%.3f (was %.3f)\" % (w, zmax, base_zmax), flush=True)\n        if zmax > base_zmax + 0.04:\n            tcp, quat = cand, q\n            break\n        open_gripper()\n        goto_pose(np.array([cand[0], cand[1], cand[2] + 0.10]), q)",
