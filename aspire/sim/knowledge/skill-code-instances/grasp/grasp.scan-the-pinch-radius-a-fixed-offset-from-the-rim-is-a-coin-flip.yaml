  "code": "def pinch_directions(cx, cy, b_lo, b_hi, r_rim, zr):\n    \"\"\"Pinch directions as (tag, quat, uz, uy, descent_tcp, pinch_tcp).\n\n    Two radii matter, and they are different:\n\n    * `descent` = r_rim + PINCH_CLEAR, comfortably OUTSIDE the whole\n      silhouette.  Descending at the wall radius clips the rim on the way down\n      and shoves the bowl sideways (measured: the tool axis walked 4 cm in y).\n    * `pinch` = r_rim + PINCH_OFFSETS, a SCAN of tool-axis radii.  Closing\n      reduces the finger separation *towards the tool axis*, so the wall is\n      only caught if the axis ends up where one finger can come down on its\n      outside while the other presses its inside; the gripper then stops with\n      the wall held between the fingers (measured opening 4.7-6.2 mm, i.e.\n      exactly the wall) instead of meeting in free air (measured 1.2-3.4 mm).\n      Which radius achieves that is NOT constant: it depends on how far the\n      measured rim radius sits from the true wall, which moves with the OBB\n      centre error and with the direction.  Measured across the suite,\n      +0.012 gripped on 12 of 15 seeds while -0.003 / -0.008 / -0.013 were the\n      only ones that gripped on the other three, so the scan tries the common\n      case first and falls back to the straddle radii.\n    \"\"\"\n    out = []\n    for tag, deg, ux, uy in ((\"-x\", 90, -1.0, 0.0), (\"-y\", 0, 0.0, -1.0),\n                             (\"+x\", 90, 1.0, 0.0), (\"+y\", 0, 0.0, 1.0)):\n        q = yaw_quat(deg)\n        Rd = r_rim + PINCH_CLEAR\n        descent = (cx + Rd * ux, cy + Rd * uy, zr)\n        pinches = [(r_rim + dR, (cx + (r_rim + dR) * ux, cy + (r_rim + dR) * uy, zr))\n                   for dR in PINCH_OFFSETS]\n        out.append((tag, q, ux, uy, descent, pinches))\n    return out",
