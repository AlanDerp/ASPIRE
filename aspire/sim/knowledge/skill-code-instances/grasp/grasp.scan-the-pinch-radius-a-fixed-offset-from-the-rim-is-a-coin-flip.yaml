  "observed_effect": "Every lift that worked left an opening of 0.058-0.077 and every close that did not left 0.015-0.043, so the post-close opening is a reliable judge. The fixed offset r_rim + 0.012 gripped 12 of 15 development seeds; the rest needed r_rim - 0.013 (seed 53), r_rim - 0.008 (seed 60) or r_rim + 0.002 (seed 65). The shipped revision scans PINCH_OFFSETS = (0.012, -0.003, -0.008, -0.013, 0.002) from r_rim, with one measured correction hop before a direction is abandoned, and scores 13/15 on dev seeds with each direction attempt costing one close.",
