  "code": "def yaw_for(target, mode=0):\n    \"\"\"Pinch azimuth: close across the object's narrowest horizontal axis (mode 0),\n    its widest (mode 1), or the mirrored narrow axis (mode 2).\"\"\"\n    horiz = sorted([i for i in range(3) if abs(target[\"R\"][2, i]) < 0.5],\n                   key=lambda i: float(target[\"extent\"][i]))\n    if not horiz:\n        return 0.0\n    idx = horiz[-1] if mode == 1 else horiz[0]\n    axis = target[\"R\"][:, idx]\n    yaw = float(np.degrees(np.arctan2(axis[0], -axis[1])))\n    return yaw + 180.0 if mode == 2 else yaw",
