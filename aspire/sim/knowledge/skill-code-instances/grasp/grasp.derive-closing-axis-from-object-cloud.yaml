  "kind": "skill-code-instance",
  "observed_effect": "Take the eigenvectors of the covariance of the object's cloud in XY: the eigenvector of the larger eigenvalue is the object's LONG axis, and its perpendicular is the closing-axis normal n. For a top-down quaternion whose finger-closing axis in world XY is (sin(yaw), -cos(yaw)), solve (sin yaw, -cos yaw) = n for yaw = atan2(n_x, -n_y). Derive it from the pinchable band's own cloud, never from the whole object's OBB: a wide base dominates the covariance and rotates the answer. Returns ~-1 deg on all 15 development seeds (band long axis along world x, broad faces facing +/-y) and the pinch then reads full contact.",
