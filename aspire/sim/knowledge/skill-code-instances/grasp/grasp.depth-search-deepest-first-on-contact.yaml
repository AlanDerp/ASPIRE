  "code": "def grasp_bowl():\n    \"\"\"Top-down wedge grasp of the bowl. Returns (grasp_pos, quat, bottom_gap).\n\n    The fingers are driven down inside the bowl and closed twice; the depth is\n    tried at several values because the IK stops short of the commanded height\n    by a varying amount, and a hold is only accepted once the measured gap\n    proves contact and survives a lift.\n    \"\"\"\n    pts = bowl_cloud(get_observation())\n    if pts is None:\n        return None\n    cx, cy = float(np.median(pts[:, 0])), float(np.median(pts[:, 1]))\n    rim_z = float(np.percentile(pts[:, 2], 98))\n    bottom_z = float(np.percentile(pts[:, 2], 2))\n    _log(\"bowl centre (%.3f,%.3f) rim %.3f bottom %.3f\" % (cx, cy, rim_z, bottom_z))\n    # Deepest target first (8/13 dev seeds vs 7/13 for the shallowest-first\n    # order).  The first descent from the standoff always half-travels - the IK\n    # stops 10-20 cm short - so the depth that ends up gripping is whichever is\n    # tried second; the order still matters because it changes the arm's path,\n    # and the landing inside the drawer is knife-edge (see findings.md).\n    for dz in (-0.070, -0.055, -0.040):\n        target = np.array([cx, cy, rim_z + dz])\n        open_gripper()\n        move_tcp(target + np.array([0.0, 0.0, 0.08]), DOWN_QUAT, iters=2)\n        reached = move_tcp(target, DOWN_QUAT, iters=4, tol=0.008)\n        close_gripper()\n        close_gripper()          # a second close wedges the fingers deeper\n        gap = _gap()\n        _log(\"  grasp dz=%+.3f reached=%s gap=%.4f\" % (dz, np.round(reached, 3).tolist(), gap))\n        if gap > AIR_GAP:\n            move_tcp(reached + np.array([0.0, 0.0, 0.09]), DOWN_QUAT, iters=2)\n            held = _gap()\n            _log(\"    lift gap=%.4f\" % held)\n            if held > AIR_GAP:\n                # TCP height minus the bowl's underside = how far the bowl\n                # hangs below the gripper\n                return reached, DOWN_QUAT, float(reached[2] - bottom_z)\n            open_gripper()\n        move_tcp(reached + np.array([0.0, 0.0, 0.11]), DOWN_QUAT, iters=2)\n    return None",
