  "code": "def grasp(brick, quat):\n    \"\"\"Laddered top-down pinch of the carton; True when the grip verifiably holds.\"\"\"\n    z_start = brick[\"top\"] + 0.14\n    for yaw in GRASP_YAWS:\n        q = quat if yaw == 0.0 else topdown(yaw)\n        for frac in GRASP_FRACS:\n            z_grasp = brick[\"bot\"] + frac * brick[\"h\"]\n            open_gripper()\n            goto_pose(np.array([brick[\"cx\"], brick[\"cy\"], z_start]), q)\n            below(brick[\"cx\"], brick[\"cy\"], z_start, z_grasp, q)\n            meas = float(tcp()[2])\n            # the arm stops at a reach-dependent floor; accept only when the pads\n            # actually got down onto the carton\n            if meas > brick[\"top\"] - 0.020:\n                print(\"  grasp yaw=%.0f frac=%.2f stalled high meas=%.3f\"\n                      % (yaw, frac, meas), flush=True)\n                goto_pose(np.array([brick[\"cx\"], brick[\"cy\"], z_start]), q)\n                continue\n            close_gripper()\n            g = gap()\n            if g <= AIR_GAP or g >= GRASP_MAX_GAP:\n                print(\"  grasp yaw=%.0f frac=%.2f empty (gap=%.4f meas=%.3f)\"\n                      % (yaw, frac, g, meas), flush=True)\n                goto_pose(np.array([brick[\"cx\"], brick[\"cy\"], z_start]), q)\n                continue\n            # ladder the lift: one jump to the carry height throws a held object\n            z = meas\n            while z < z_start:\n                z = min(z_start, z + 0.04)\n                goto_pose(np.array([brick[\"cx\"], brick[\"cy\"], z]), q)\n            g2 = gap()\n            print(\"  grasp yaw=%.0f frac=%.2f meas=%.3f gap=%.4f lift=%.4f\"\n                  % (yaw, frac, meas, g, g2), flush=True)\n            if g2 > AIR_GAP:\n                return True\n            open_gripper()          # slipped while lifting: try the next candidate\n    return False",
