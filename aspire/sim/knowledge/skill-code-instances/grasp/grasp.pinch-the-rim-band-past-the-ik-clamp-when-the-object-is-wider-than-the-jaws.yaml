  "code": "if obj is not None:\n    WATCH_Z[0] = float(obj[\"zmax\"])\n    cx, cy, R = float(obj[\"c\"][0]), float(obj[\"c\"][1]), float(obj[\"rmax\"])\n    q = mkq(180.0, 0.0)          # jaws close along y (the pinch axis points at the object)\n    wide = 2.0 * R > 0.078\n    print(\"=== object: R=%.4f wide=%s ===\" % (R, wide))\n\n    if wide:\n        # --- rim wedge: straddle the rim band with the pads sunk as low as is safe.\n        # The rim's outside edge and its inner ramp are only ~8 mm apart at the clamp\n        # floor, but ~18 mm apart 7 mm lower, so sink the pads a few mm above the\n        # support surface: `deep` is the *desired achieved* tool-tip height.\n        yt = cy + 0.945 * R\n        print(\"  rim pinch at y=%.4f\" % yt)\n        zA = CLAMP_Z + 0.002                     # legal pose kept as the fallback\n        tipA = None\n        for z in (0.20, 0.11, 0.05, zA + 0.007):\n            if go([cx, yt, z], q) is None:\n                break\n            tipA = tip_z()\n        deep = float(obj[\"zmax\"]) - 0.0094       # pads ~9 mm below the object's top\n        deep = float(min(max(deep, -0.0035), 0.012))\n        print(\"  desired tip %.4f (object top %.4f)\" % (deep, obj[\"zmax\"]))\n        try:\n            jA = np.asarray(solve_ik(np.array([cx, yt, zA]), q), float)\n            jB = np.asarray(solve_ik(np.array([cx, yt, zA + 0.020]), q), float)\n            slope = (jB - jA) / 0.020            # joints per metre of tip height\n            aim = zA - 0.006                     # the linear extrapolation under-shoots\n            prev_aim, prev_tip = zA, tipA        # the last measured (commanded, achieved) pair\n            for it in range(4):\n                # the extrapolation's real response varies with the arm configuration,\n                # so drive the depth from the measured tip instead of trusting it\n                if move(move_to_joints, jA + slope * (aim - zA)) is None:\n                    break\n                got = tip_z()\n                print(\"  depth iter %d: aim %.4f tip %.4f gap=%.4f\" % (it, aim, got, width()))\n                if got <= deep + 0.0005:\n                    break\n                gain = 1.0\n                if prev_tip is not None and abs(aim - prev_aim) > 2e-4:\n                    gain = (got - prev_tip) / (aim - prev_aim)   # local measured response\n                if not (0.25 <= gain <= 4.0):\n                    gain = 1.0\n                step = min((got - deep) / gain, 0.012)\n                if aim - step < -0.0095:\n                    break\n                prev_aim, prev_tip = aim, got\n                aim -= step\n            if tip_z() < deep - 0.003:           # overshot towards the support surface: back off\n                back = aim + 0.002\n                print(\"  too deep (%.4f), backing off to aim %.4f\" % (tip_z(), back))\n                move(move_to_joints, jA + slope * (back - zA))\n                print(\"  tip now %.4f gap=%.4f\" % (tip_z(), width()))\n        except Exception as e:\n            print(\"  extrapolation failed: %r\" % (e,))\n    else:\n        # --- object fits between the jaws: plain centred pinch at its widest height\n        zpin = max(float(obj[\"zmax\"]) - 0.012, float(obj[\"zmin\"]) + 0.008)\n        print(\"  centred pinch at z=%.4f\" % zpin)\n        for z in (0.24, 0.16, 0.10, zpin + 0.03, zpin):\n            if go([cx, cy, z], q) is None:\n                break\n\n    if BUDGET[0] > 0:\n        move(close_gripper)\n        g = width()\n        print(\"  CLOSED gap=%.4f (open %.4f)\" % (g, JAW_OPEN))\n        if g > 0.004:\n            held = lift_ladder(q, (0.004, 0.008, 0.013, 0.019, 0.027, 0.040, 0.060, 0.090), OBJ)",
