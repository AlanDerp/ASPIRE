  "code": "def grasp(tag, quat, target, bowl):\n    \"\"\"One laddered radial wall pinch.  Returns (drop, off) or None.\"\"\"\n    bx, by = bowl[\"cx\"], bowl[\"cy\"]\n    z_start = bowl[\"top\"] + 0.16\n    tx, ty, tz = target\n    open_gripper()\n    goto_pose(np.array([tx, ty, z_start]), quat)\n    descend_to(tx, ty, tz, quat, tag=tag)\n    meas = tcp()\n    if float(meas[2]) > bowl[\"top\"] + 0.005:\n        print(\"  %s stopped above the bowl (%.3f > %.3f)\" % (tag, meas[2], bowl[\"top\"]),\n              flush=True)\n        goto_pose(np.array([tx, ty, z_start]), quat)\n        return None\n    close_gripper()\n    g = gap()\n    if g <= AIR_GAP:\n        print(\"  %s air (gap=%.4f)\" % (tag, g), flush=True)\n        open_gripper()\n        goto_pose(np.array([tx, ty, z_start]), quat)\n        return None\n    if g >= MAX_GAP:\n        print(\"  %s wedged (gap=%.4f)\" % (tag, g), flush=True)\n        open_gripper()\n        goto_pose(np.array([tx, ty, z_start]), quat)\n        return None\n    lift_z = max(z_start, float(meas[2]) + 0.10)\n    goto_pose(np.array([tx, ty, lift_z]), quat)\n    g2 = gap()\n    if g2 <= AIR_GAP:\n        print(\"  %s slipped on the lift (gap=%.4f)\" % (tag, g2), flush=True)\n        return None\n    # the bowl hangs off the tool by (bowl centre - tool centre) as measured BEFORE the\n    # pinch (a held bowl's mask is contaminated by the gripper's own metal)\n    off = np.clip(np.array([bx - float(meas[0]), by - float(meas[1])]), -0.09, 0.09)\n    drop = float(meas[2]) - bowl[\"base\"]\n    print(\"  %s hold gap=%.4f lift=%.4f gap=%.4f drop=%.3f off=(%+.3f,%+.3f)\"\n          % (tag, g, g2, gap(), drop, off[0], off[1]), flush=True)\n    rgb, d, K, E = observe()\n    n_before = int((np.linalg.norm(bowl[\"pts\"][:, :2] - np.array([bx, by]), axis=1)\n                    < 0.06).sum())\n    if still_on_support(rgb, d, K, E, (bx, by), bowl[\"base\"], n_before):\n        print(\"  %s bowl did not leave its support\" % tag, flush=True)\n        open_gripper()\n        goto_pose(np.array([tx, ty, z_start]), quat)\n        return None\n    return drop, off",
