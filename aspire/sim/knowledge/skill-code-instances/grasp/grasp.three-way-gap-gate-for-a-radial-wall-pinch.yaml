  "goal": "Verify a radial wall pinch of a wide bowl held on a surface other than the table",
  "id": "grasp.three-way-gap-gate-for-a-radial-wall-pinch",
  "kind": "skill-code-instance",
  "observed_effect": "A three-way gate on the measured gripper gap: reject if gap <= AIR_GAP (0.0035, closed on nothing) OR gap >= MAX_GAP (0.030, pads wedged on something rather than holding), then LIFT 0.10 m and re-read the gap, rejecting a drop below AIR_GAP as a slip during the lift. Measure the release drop at the pinch as drop = measured_tcp_z - object_base, so the release height follows the object own base and works unchanged on a raised support. Measured on 15/15 seeds: hold gap 0.0080-0.0083 (0.3 mm spread), lift gap unchanged at 0.0042-0.0043, drop = 0.026 every seed. Air reads ~0.001-0.0013 in this convention, so AIR_GAP = 0.0035 sits a factor of 2 above air and a factor of 2 below a real hold",
