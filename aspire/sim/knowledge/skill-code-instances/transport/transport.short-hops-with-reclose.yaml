  "code": "def carry_to(place):\n    \"\"\"Carry the held bowl to `place` in hops, re-closing at every hop.\n\n    Returns True while the bowl is still held.  A single long transport move\n    shakes a smooth metal bowl out of a friction grip; short hops that re-close\n    the gripper (and re-check the gap) do not.\n    \"\"\"\n    place = np.asarray(place, dtype=np.float64)\n    start = _tcp()\n    lift_z = max(place[2] + 0.12, start[2])\n    waypoints = [np.array([start[0], start[1] + 0.5 * (place[1] - start[1]), lift_z]),\n                 np.array([place[0], place[1], lift_z]),\n                 place]\n    for w in waypoints:\n        if _gap() <= AIR_GAP:                     # already lost before the move\n            return False\n        move_tcp(w, DOWN_QUAT, iters=3)\n        close_gripper()\n        held = _gap()\n        _log(\"  hop\", np.round(w, 3).tolist(), \"gap %.4f\" % held)\n        if held <= AIR_GAP:\n            return False\n    return True",
