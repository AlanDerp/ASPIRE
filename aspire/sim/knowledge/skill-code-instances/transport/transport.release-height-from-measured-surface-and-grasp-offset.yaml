  "code": "def run():\n    obs = get_observation()\n    rgb, depth_img, K, E = cam_data(obs)\n    goto_home_joint_position()\n    print(\"TASK:\", getattr(env.handle, \"task_language\", \"\"), flush=True)\n\n    rack_pts, _ = localize(rgb, depth_img, K, E,\n                           [\"wooden rack\", \"rack\", \"shelf\"],\n                           min_score=0.10, min_pts=50)\n    if rack_pts is None:\n        raise RuntimeError(\"rack not found\")\n    px, py = choose_place_xy(rack_pts)\n    print(f\"rack n={len(rack_pts)} place xy=({px:.3f},{py:.3f})\", flush=True)\n\n    det = detect_bottle(rgb, depth_img, K, E)\n    if det is None:\n        raise RuntimeError(\"bottle not found\")\n    print(f\"bottle base={det['base']:.3f} top={det['top']:.3f} \"\n          f\"axis=({det['bx']:.4f},{det['by']:.4f})\", flush=True)\n\n    held = None\n    for yaw in (0.0, 90.0):\n        q = TOPDOWN if yaw == 0.0 else make_topdown_quat(90.0)\n        for dx in (0.0, -0.008, 0.008, -0.016):\n            o = get_observation()\n            r2, d2, K2, E2 = cam_data(o)\n            det2 = detect_bottle(r2, d2, K2, E2)\n            if det2 is None:\n                continue\n            got = grasp(det2[\"bx\"] + dx, det2[\"by\"], det2[\"gz\"], det2[\"top\"], q)\n            if got is not None:\n                det, held, above = det2, got, got - det2[\"base\"]\n                break\n            goto_home_joint_position()\n            open_gripper()\n        if held is not None:\n            break\n    if held is None:\n        print(\"grasp failed\", flush=True)\n        return\n\n    # carry at a height derived from the TARGET surface, not from the grasp\n    lift = min(0.44, max(held + 0.14, 0.42))\n    move_tcp([det[\"bx\"], det[\"by\"], lift], TOPDOWN, tol=0.030, retries=0)\n    hop_to(px, py, tag=\" (transit)\")\n\n    z_surf = find_rack_top_xz(px, py)\n    if z_surf is None:\n        z_surf = float(np.percentile(rack_pts[:, 2], 90))\n    # release so the bottle's BASE ends up just above the measured surface\n    z_lo = z_surf + above + 0.005\n    print(f\"rack surface at place point z={z_surf:.3f}; releasing at \"\n          f\"{z_lo:.3f}\", flush=True)\n\n    lower_onto(px, py, z_lo)\n    open_gripper()\n    move_tcp([px, py, lift], TOPDOWN, tol=0.060, retries=0)\n    print(\"done\", flush=True)",
