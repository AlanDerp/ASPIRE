  "code": "def held_cloud(rgb, d, K, E, near_xy, z_floor, radius=0.10):\n    \"\"\"The carried payload's own cloud, gated in HEIGHT and in SHAPE.\n\n    A carried object is the only same-class cloud up at carry height, so a\n    z_floor just below the gripper excludes everything resting on the table\n    without needing a table estimate.  The gate must be TIGHT (a fraction of the\n    hang, not a fixed 0.20 m): a decoy can stand 6 cm tall, and a loose floor\n    lets it into the cloud, where the centre estimate splits the difference\n    between payload and decoy.\n\n    A single SAM3 mask can also span BOTH akita bowls when the payload passes\n    over its twin, so a merged blob is rejected by its footprint: two bowls\n    ~10 cm apart give a >0.15 m extent, a single bowl never does.\n    \"\"\"\n    near_xy = np.asarray(near_xy, dtype=np.float64)[:2]\n    for p in HELD_PROMPTS:\n        for m in sorted(segment_sam3_text_prompt(rgb, p) or [], key=lambda x: -float(x[\"score\"]))[:4]:\n            pts = mask_cloud(m, d, K, E)\n            if pts is None or len(pts) < 60:\n                continue\n            sel = pts[(np.linalg.norm(pts[:, :2] - near_xy, axis=1) < radius) & (pts[:, 2] > z_floor)]\n            if len(sel) < 60:\n                continue\n            lo = np.percentile(sel, 2, axis=0)\n            hi = np.percentile(sel, 98, axis=0)\n            w, dp, h = float(hi[0] - lo[0]), float(hi[1] - lo[1]), float(hi[2] - lo[2])\n            if not (0.040 <= w <= 0.150 and 0.040 <= dp <= 0.150):\n                continue                      # merged blob, not one bowl\n            if not (0.004 <= float(lo[2]) and 0.020 <= h <= 0.090):\n                continue\n            # trimmed extent midpoint (not the median, which a residual tail skews)\n            clo = np.percentile(sel, 10, axis=0)\n            chi = np.percentile(sel, 90, axis=0)\n            c = np.array([0.5 * (clo[0] + chi[0]), 0.5 * (clo[1] + chi[1])])\n            return sel, c\n    return None",
