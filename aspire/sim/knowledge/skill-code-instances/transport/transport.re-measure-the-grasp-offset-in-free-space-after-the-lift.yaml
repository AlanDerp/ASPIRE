  "code": "def bowl_near(ref_xy, max_d=0.30, trusted=False, expect_z=None):\n    \"\"\"Nearest screened bowl candidate to ref_xy from a FRESH observation.\"\"\"\n    rgb, d, K, E = observe()\n    best, bd = None, max_d\n    for cd in bowl_candidates(rgb, d, K, E):\n        dd = float(np.linalg.norm(cd[\"c\"] - np.asarray(ref_xy, dtype=np.float64)))\n        ok = is_trustworthy(cd, expect_z)\n        print(\"    bowl c=(%.3f,%.3f) z_lo=%.3f score=%.2f d=%.3f%s\"\n              % (cd[\"c\"][0], cd[\"c\"][1], cd[\"z_lo\"], cd[\"score\"], dd,\n                 \"\" if (not trusted or ok) else \" REJECT\"), flush=True)\n        if trusted and not ok:\n            continue\n        if dd < bd:\n            best, bd = cd, dd\n    return best",
