  "observed_effect": "The false success is exact and silent: seed 64 printed BOWL CENTRED ON PLATE with dist_to_plate_centre = 0.000 and z2 = -0.004 while the run last agentview frame shows the plate EMPTY. The servo reading equalled the plate centre on exactly the two runs that lost the placement (seeds 64 and 57) and sat 5-12 mm away on every run that passed. Gate: FLAT_REJECT = 0.020 against the measured z-extents (plate 0.011 m, cookie box 0.014 m, bowl 0.044 m), applied as continue when percentile(pts z 98) - percentile(pts z 2) < min_h. With the landing gate the false success becomes a retry. Critical counter-evidence: do NOT gate the CARRY SERVO the same way - during the carry the bowl is partly behind the fingers, and a gated pick chose a taller composite mask (bowl over plate) that read err = 0.005 at the first iteration, so the servo stopped early and released 21 mm off-centre (seed 65, reward 0), while the ungated pick on the same code read err = 0.046 and corrected over two hops (reward 1.0). The gate belongs on the landing check only.",
