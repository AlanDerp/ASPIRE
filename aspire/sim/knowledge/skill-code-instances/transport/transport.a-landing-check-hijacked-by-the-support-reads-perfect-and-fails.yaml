  "code": "def bowl_points(rgb, d, K, E, ref_xy=None, radius=0.12, min_h=None):\n    \"\"\"Points of the best bowl mask near `ref_xy`.\n\n    `min_h` rejects a mask that is FLAT in world z.  This matters for every\n    measurement taken over the plate: the plate is a shallow dish that the\n    \"bowl\" prompts happily segment, and its centre coincides with the plate's\n    own centre, so an ungated search for \"a bowl near the plate\" can return the\n    PLATE and report a perfect placement for a bowl that was never carried\n    there (measured on seed 64: the program printed \"BOWL CENTRED ON PLATE\"\n    with a 0.000 m error while the run's last agentview frame shows the plate\n    empty and the bowl still on the table).  The plate's measured z extent is\n    ~0.011 m and the cookie box's ~0.014 m, while the bowl stands 0.044 m\n    upright (0.05-0.07 m on its side), so 0.020 m separates them.\n    \"\"\"\n    for p in BOWL_PROMPTS:\n        masks = segment_sam3_text_prompt(rgb, p)\n        if not masks:\n            continue\n        for m in sorted(masks, key=lambda x: -x[\"score\"])[:4]:\n            pts = mask_to_world_points(m[\"mask\"].astype(np.uint8), d, K, E)\n            if pts is None or len(pts) < 40:\n                continue\n            if min_h is not None:\n                zlo, zhi = np.percentile(pts[:, 2], [2, 98])\n                if float(zhi - zlo) < min_h:\n                    continue\n            if ref_xy is not None:\n                near = np.linalg.norm(pts[:, :2] - np.asarray(ref_xy), axis=1) < radius\n                if near.sum() < 40:\n                    continue\n                pts = pts[near]\n            return pts\n    return None",
