  "code": "def find_tracked_bowl(rgb, d, K, E, anchor_xy):\n    \"\"\"Re-find the bowl being worked on, by *position continuity*.\n\n    Widening windows around the anchor where the bowl was last seen.  The\n    class-prompt candidate list is deliberately not used here: once the bowl\n    sits next to the plate its mask merges with the plate and drops out of the\n    list, so the list would hand back the untouched twin instead.  The anchor is\n    updated to the last measured position after every release, so the program\n    follows the bowl instead of looking only at its original spot.\n    \"\"\"\n    anchor_xy = np.asarray(anchor_xy, dtype=float).reshape(-1)[:2]\n    for radius in (0.10, 0.20, 0.35):\n        pts = bowl_points_near(rgb, d, K, E, anchor_xy, radius=radius)\n        if pts is None or len(pts) < 40:\n            continue\n        bx, by, b_lo, b_hi, pts = bowl_geometry(pts)\n        if math.hypot(bx - anchor_xy[0], by - anchor_xy[1]) > radius:\n            continue\n        return {\"c\": np.array([bx, by, 0.5 * (b_lo + b_hi)]), \"pts\": pts}\n    return None\n\n\ndef bowl_geometry(pts):\n    \"\"\"Robust bowl pose: 2/98-percentile *extent midpoint*, not the median.\n\n    Measured on this scene: the bowl's visible cloud is biased toward the\n    camera by the far inner wall, so its median sits ~2 cm off the true centre\n    (median 0.640 vs extent-midpoint 0.659 on seed 51).  A wall pinch commanded\n    from the median therefore lands *inside* the mouth, where closing the\n    fingers shoves the bowl sideways instead of gripping it.\n    \"\"\"\n    c = np.median(pts, axis=0)\n    m = (np.abs(pts[:, 0] - c[0]) < 0.075) & (np.abs(pts[:, 1] - c[1]) < 0.075)\n    if m.sum() >= 40:\n        pts = pts[m]\n    xlo, xhi = np.percentile(pts[:, 0], [2, 98])\n    ylo, yhi = np.percentile(pts[:, 1], [2, 98])\n    return float(0.5 * (xlo + xhi)), float(0.5 * (ylo + yhi)), \\\n        float(np.percentile(pts[:, 2], 2)), float(np.percentile(pts[:, 2], 98)), pts\n\n\ndef bowl_points_near(rgb, d, K, E, ref_xy, radius=0.12, min_pts=40):\n    \"\"\"Bowl points restricted to a neighbourhood of ref_xy (xy only).\"\"\"\n    ref_xy = np.asarray(ref_xy, dtype=float).reshape(-1)[:2]\n    for p in [\"black bowl\", \"bowl\", \"metal bowl\", \"silver bowl\"]:\n        masks = segment_sam3_text_prompt(rgb, p)\n        if not masks:\n            continue\n        for m in sorted(masks, key=lambda x: -x[\"score\"])[:6]:\n            r, pts = obb_of(m[\"mask\"], d, K, E, min_pts=min_pts)\n            if r is None:\n                continue\n            near = np.linalg.norm(pts[:, :2] - ref_xy, axis=1) < radius\n            if near.sum() < min_pts:\n                continue\n            return pts[near]\n    return None",
