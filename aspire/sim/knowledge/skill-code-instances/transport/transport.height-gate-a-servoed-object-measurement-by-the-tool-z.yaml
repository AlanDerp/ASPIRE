  "code": "def held_bowl_xy(rgb, d, K, E, near_xy, z_tcp, radius=0.13):\n    \"\"\"World XY of the HELD bowl, measured from its own cloud near `near_xy`.\n\n    The window is NOT enough on its own: the decoy bowl of the same class lies\n    on the table ~0.2 m away, and once the tool is carried toward the plate the\n    window catches the decoy's near edge and the median lands between the two\n    (measured: servo locked onto the decoy at (0.690,0.220) and dragged the held\n    bowl to y = -0.075, releasing it 0.13 m off target).  A carried object is\n    the only bowl-shaped cloud up at carry height, so gate on height relative to\n    the CURRENT tool z - that excludes everything resting on the table without\n    needing a table estimate.\n    \"\"\"\n    near_xy = np.asarray(near_xy, dtype=float)[:2]\n    z_floor = float(z_tcp) - 0.20\n    for p in HELD_PROMPTS:\n        masks = segment_sam3_text_prompt(rgb, p)\n        if not masks:\n            continue\n        for m in sorted(masks, key=lambda x: -x[\"score\"])[:4]:\n            pts = mask_to_world_points(m[\"mask\"].astype(np.uint8), d, K, E)\n            if pts is None or len(pts) < 60:\n                continue\n            sel = pts[(np.linalg.norm(pts[:, :2] - near_xy, axis=1) < radius) &\n                      (pts[:, 2] > z_floor)]\n            if len(sel) < 60:\n                continue\n            c = np.median(sel, axis=0)\n            return np.array([float(c[0]), float(c[1])])\n    return None",
