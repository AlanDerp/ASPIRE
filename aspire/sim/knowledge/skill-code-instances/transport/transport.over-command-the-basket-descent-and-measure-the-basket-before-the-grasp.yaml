  "code": "def place(basket, quat):\n    bx, by = float(basket[\"cx\"]), float(basket[\"cy\"])\n    cur = tcp()\n    goto_pose(np.array([cur[0], cur[1], CARRY_Z]), quat)\n    hop_to(bx, by, CARRY_Z, quat)\n    # over-command the descent well below the basket floor: the physical stall, not the\n    # commanded depth, sets the release height and converges the xy.\n    below(bx, by, CARRY_Z, RELEASE_Z, quat)\n    print(\"  release tcp=%s rim=%.3f\" % (np.round(tcp(), 3), basket[\"rim\"]), flush=True)\n    open_gripper()\n    for _ in range(10):\n        get_observation()\n    # A released object leaves the fingers fully open (~0.080).  The test must be\n    # two-sided: `gap() > AIR_GAP` is true after every successful release.\n    g = gap()\n    if AIR_GAP < g < 0.075:\n        print(\"  release blocked gap=%.4f\" % g, flush=True)\n        cur = tcp()\n        below(cur[0], cur[1], cur[2], cur[2] - 0.03, quat)\n        open_gripper()\n        for _ in range(6):\n            get_observation()\n    goto_pose(np.array([bx, by, 0.40]), quat)\n    for _ in range(4):\n        get_observation()",
