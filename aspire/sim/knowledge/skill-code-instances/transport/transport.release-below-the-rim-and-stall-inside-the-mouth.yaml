  "code": "def main():\n    language = str(getattr(env.handle, \"task_language\", \"\"))\n    print(f\"TASK_LANGUAGE: {language}\", flush=True)\n\n    rgb, depth, K, E = cam_obs()\n    basket_xy, rim_z = find_basket(rgb, depth, K, E)      # measured BEFORE the grasp\n    cands = find_can_candidates(rgb, depth, K, E)\n    if basket_xy is None:\n        raise RuntimeError(\"could not localize the basket\")\n    if not cands:\n        raise RuntimeError(\"could not localize any can candidate\")\n\n    sig = target_signature(language)\n    can = pick_target_can(cands, sig)\n    other = [c for c in cands if c is not can]\n    margin = min((can[sig] - c[sig] for c in other), default=float(\"nan\"))\n    print(\n        f\"  TARGET CAN sig={sig} center={np.round(can['center'], 3)} \"\n        f\"zlo={can['zlo']:.3f} zhi={can['zhi']:.3f} {sig}={can[sig]:.1f} \"\n        f\"margin_over_sibling={margin:.1f}\",\n        flush=True,\n    )\n\n    # ---------------- grasp (up to 3 attempts) ----------------\n    base_floor = float(can[\"zlo\"]) + 0.030\n    plans = [\n        (0.0, base_floor),\n        (30.0, base_floor + 0.008),\n        (-30.0, base_floor - 0.006),\n    ]\n    held = False\n    for i, (yaw, floor_z) in enumerate(plans):\n        quat = topdown_quat(yaw)\n        if BASE_OFFSET is None:\n            calibrate(quat)\n        held, g, floor_meas = attempt_grasp(can, quat, floor_z, f\"grasp[{i}]\")\n        if not held:\n            print(f\"  grasp[{i}] rejected on gap; retrying\", flush=True)\n            try:\n                goto_pose(np.array([float(can[\"center\"][0]), float(can[\"center\"][1]),\n                                    float(can[\"zhi\"]) + 0.18]), quat)\n            except Exception:\n                pass\n            continue\n        # lift and confirm by re-localization that the can left the table\n        lift_z = float(can[\"zhi\"]) + 0.20\n        goto_pose(np.array([float(can[\"center\"][0]), float(can[\"center\"][1]), lift_z]), quat)\n        rgb2, depth2, K2, E2 = cam_obs()\n        left, seen = target_left_table(rgb2, depth2, K2, E2, can, sig)\n        if left:\n            print(f\"  grasp[{i}] can still on the table (zlo={seen['zlo']:.3f}); retrying\", flush=True)\n            open_gripper()\n            held = False\n            continue\n        print(f\"  grasp[{i}] held: gap={g:.4f} floor={floor_meas:.4f} yaw={yaw}\", flush=True)\n        break\n\n    if not held:\n        print(\"  all grasp attempts failed; aborting\", flush=True)\n        goto_home_joint_position()\n        return\n\n    # ---------------- carry & place ----------------\n    quat = topdown_quat(0.0)\n    lift_z = float(can[\"zhi\"]) + 0.20\n    goto_pose(np.array([basket_xy[0], basket_xy[1], lift_z]), quat)\n    # Command far below the rim on purpose: the arm stalls inside the mouth and\n    # the can is released there. Do not clamp the target to stay above the rim.\n    descend_to(np.array([basket_xy[0], basket_xy[1], 0.060]), quat, label=\"place\")\n    open_gripper()\n    for _ in range(10):\n        get_observation()\n    g = gap_m()\n    print(f\"  gap after release = {g:.4f}\", flush=True)\n    if GAP_HOLD_LO < g < 0.075:      # two-sided: an open gripper reads ~0.080\n        print(\"  release looks wedged; pressing and re-opening\", flush=True)\n        try:\n            down = tcp_world()\n            down[0], down[1] = basket_xy[0], basket_xy[1]\n            down[2] = max(0.05, down[2] - 0.03)\n            goto_pose(down, quat)\n            open_gripper()\n        except Exception as exc:\n            print(f\"  recovery failed: {type(exc).__name__}\", flush=True)\n\n    # ---------------- verify placement (passive) ----------------\n    up = np.array([basket_xy[0], basket_xy[1], lift_z + 0.05])\n    goto_pose(up, quat)\n    rgb3, depth3, K3, E3 = cam_obs()\n    left, seen = target_left_table(rgb3, depth3, K3, E3, can, sig)\n    print(f\"  post-release: target still on table = {left}\", flush=True)\n\n    goto_home_joint_position()\n    print(\"DONE\", flush=True)",
