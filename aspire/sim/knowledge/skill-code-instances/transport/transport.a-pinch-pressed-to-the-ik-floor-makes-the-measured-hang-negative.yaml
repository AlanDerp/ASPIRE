  "observed_effect": "Evidence: measured on all 15 development seeds -- hand 0.117, fingertip 0.117 - 0.132 = -0.015, slab base 0.002-0.005, so hang = -0.017..-0.019 (NEGATIVE). Release commanded hand z 0.215-0.222 against a rim of 0.141-0.142, with the slab released inside the mouth every time. 'gap after lift' equalled 'gap after close' (0.0388-0.0392) on every seed, so the pinch never slipped before the carry. The sign is not the point; carrying it is: hang is defined so the payload's underside is at hand - FINGERTIP_OFFSET - hang, which holds whether the pads reach past the base or stop above it, so the same three lines serve a tall object (positive hang) and a 15 mm slab (negative hang)",
