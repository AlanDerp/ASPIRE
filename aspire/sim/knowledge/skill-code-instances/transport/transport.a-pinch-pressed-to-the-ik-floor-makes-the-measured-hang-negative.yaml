  "code": "def main():\n    rgb, d, K, E = observe()\n    lang = str(getattr(env.handle, \"task_language\", \"\"))\n    print(\"TASK_LANGUAGE: %r\" % lang, flush=True)\n    target = instruction_target(lang)\n    print(\"  instruction target: %r\" % target, flush=True)\n    spec = TARGET_SPEC.get(target, DEFAULT_SPEC)\n    print(\"  spec: prompts=%s descriptor=%s admit=%s\"\n          % (spec[\"prompts\"], spec[\"descriptor\"].__name__, spec[\"admit\"]), flush=True)\n\n    box = find_box(rgb, d, K, E, spec[\"prompts\"], spec[\"descriptor\"], spec[\"admit\"])\n    if box is None:\n        print(\"  primary screen empty -> relaxed pass\", flush=True)\n        box = find_box(rgb, d, K, E, spec[\"prompts\"], spec[\"descriptor\"], None, relaxed=True)\n    if box is None:\n        raise RuntimeError(\"target box not found\")\n    bx, by = float(box[\"c\"][0]), float(box[\"c\"][1])\n    yaw = box_yaw(box[\"pts\"])\n    print(\"  box c=(%.3f,%.3f) top_z=%.3f bot_z=%.3f yaw=%.1f desc=%.3f\"\n          % (bx, by, box[\"top\"], box[\"bot\"], yaw, box[\"desc\"]), flush=True)\n\n    basket = find_basket(rgb, d, K, E)\n\n    quat = yaw_quat(yaw)\n    hand_grasp = None\n    for attempt, q in enumerate((quat, yaw_quat(yaw + 90.0), yaw_quat(yaw + 45.0))):\n        print(\"  grasp attempt %d\" % attempt, flush=True)\n        goto_pose(cmd_of([bx, by, CARRY_Z]), q)\n        open_gripper()\n        descend(bx, by, q, HAND_FLOOR, tag=\"grasp\")\n        # the stepped descent returns while the arm still lags its last command;\n        # re-command the floor until it really stops moving before pinching\n        prev = float(tcp()[2])\n        for _ in range(8):\n            goto_pose(cmd_of([bx, by, HAND_FLOOR]), q)\n            now = float(tcp()[2])\n            if prev - now < 0.0005:\n                break\n            prev = now\n        print(\"    pressed to hand %.3f\" % float(tcp()[2]), flush=True)\n        close_gripper()\n        g = grip_gap()\n        hand_grasp = float(tcp()[2])\n        print(\"    gap after close = %.4f hand %.3f\" % (g, hand_grasp), flush=True)\n        if AIR_GAP < g < GRASP_MAX_GAP:\n            lift_to(CARRY_Z, q)\n            g2 = grip_gap()\n            print(\"    gap after lift = %.4f\" % g2, flush=True)\n            if g2 > AIR_GAP:\n                break\n        else:\n            lift_to(CARRY_Z, q)\n    else:\n        raise RuntimeError(\"could not grasp the target\")\n\n    hang = (hand_grasp - FINGERTIP_OFFSET) - float(box[\"bot\"])\n    print(\"  carried; hand %.3f fingertip %.3f box bottom %.3f hang %.3f\"\n          % (hand_grasp, hand_grasp - FINGERTIP_OFFSET, box[\"bot\"], hang), flush=True)\n\n    rgb2, d2, K2, E2 = observe()\n    basket = find_basket(rgb2, d2, K2, E2)\n    if basket is None:\n        raise RuntimeError(\"basket not found\")\n    cx, cy, rim = basket[\"cx\"], basket[\"cy\"], basket[\"rim\"]\n    z_under = rim - RELEASE_UNDER_RIM\n    hand_rel = z_under + hang + FINGERTIP_OFFSET\n    print(\"  release: underside %.3f -> hand %.3f (rim %.3f)\" % (z_under, hand_rel, rim),\n          flush=True)\n\n    move_xy(cx, cy, quat, z=CARRY_Z)\n    descend(cx, cy, quat, hand_rel, tag=\"place\")\n    print(\"  at release hand %.3f gap %.4f\" % (float(tcp()[2]), grip_gap()), flush=True)\n    open_gripper()\n    for _ in range(4):\n        get_observation()\n    lift_to(CARRY_Z, quat)\n    for _ in range(3):\n        get_observation()\n    print(\"done\", flush=True)",
