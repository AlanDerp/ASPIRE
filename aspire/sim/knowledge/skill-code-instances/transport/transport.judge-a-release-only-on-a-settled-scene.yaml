  "observed_effect": "open_gripper() costs ~30 sim steps and the payload is in free fall for most of them, so a cloud taken right after it is a measurement of a MOVING object -- and it reads optimistically, because the falling object is already inside the goal footprint's xy while still centimetres above it. Measure, then judge, only after settling: retreat clear, settle (redundant goto_pose at the current pose -- see the settling section), re-segment, and apply a STRICT band to that cloud (dxy <= 0.030, support_surf - 0.025 <= z <= support_surf + 0.035), keeping the wider band (dxy <= 0.045) for the loop-top OBB-centre reading. Measured false positive on seed 53: 'placement check dxy=0.0113 (tol 0.045) z=0.0326 surf=-0.0021 -> ON PLATE' followed by 'bowl verified on the plate -- settling and stopping' and reward=0.0 -- the bowl was still 3 cm above the plate when the check ran. The failure mode is a REJECTED CORRECT PLACEMENT (the program concludes it has placed the object when it has not) or, via the settle-then-strict pair, a correct placement discarded as a miss",
