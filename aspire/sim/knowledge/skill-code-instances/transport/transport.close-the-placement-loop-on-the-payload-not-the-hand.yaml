  "observed_effect": "At high_z (payload base 10 cm above the rim, fully visible in the agentview) the program measures the carried carton's xy with SAM3 + depth, computes err = mouth - carton_xy, clamps the step to MAX_ALIGN_STEP and re-commands, up to 3 iterations, stopping inside ALIGN_TOL (6 mm). Seed 54 converged |err| 0.011 -> 0.005 in two iterations and seed 55 0.009 -> 0.005, both scoring 1.0. Where the identity gate finds no payload the loop is a no-op and the model aim (mouth - off) is used, which also scored 1.0 on seeds 52/53/56-65 - so this is robustness, not the flip",
