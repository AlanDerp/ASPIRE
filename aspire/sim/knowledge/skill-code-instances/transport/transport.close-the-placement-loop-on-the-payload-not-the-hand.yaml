  "code": "# --- place the PAYLOAD, not the hand: closed-loop lateral alignment --------\n# Descend only once the carton itself is centred on the mouth.  Aiming by model\n# alone is not enough: the carton hangs ~0.03 m off the hand axis, and the\n# basket mouth is only ~0.15 m across, so a hand-centred descent puts the carton\n# on the rim.\ncmd = mouth - off\naligned = False\nfor it in range(3):\n    if not go(np.array([cmd[0], cmd[1], high_z]), quat):\n        print(\"  align %d: IK refused at (%.3f,%.3f)\" % (it, cmd[0], cmd[1]), flush=True)\n        break\n    obsa = get_observation()\n    cama = obsa[\"agentview\"]\n    c = find_carried(cama[\"images\"][\"rgb\"], depth_of(cama), cama[\"intrinsics\"],\n                     cama[\"pose_mat\"], cmd, cw, language)\n    if c is None:\n        print(\"  align %d: payload not seen from above the rim\" % it, flush=True)\n        break\n    err = mouth - c[\"xy\"]\n    print(\"  align %d: hand=(%.3f,%.3f) carton=(%.3f,%.3f) err=(%+.3f,%+.3f) |err|=%.3f\"\n          % (it, cmd[0], cmd[1], c[\"xy\"][0], c[\"xy\"][1], err[0], err[1],\n             float(np.linalg.norm(err))), flush=True)\n    if float(np.linalg.norm(err)) <= ALIGN_TOL:\n        aligned = True\n        break\n    cmd = cmd + np.clip(err, -MAX_ALIGN_STEP, MAX_ALIGN_STEP)\nprint(\"  aligned=%s  final hand=(%.3f,%.3f)\" % (aligned, cmd[0], cmd[1]), flush=True)",
