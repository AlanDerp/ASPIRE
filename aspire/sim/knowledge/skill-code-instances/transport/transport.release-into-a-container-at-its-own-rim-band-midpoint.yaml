  "code": "if ok:\n    obs2, rgb2, d2, K2, E2 = observe()\n    basket = None\n    for bp in [\"basket\", \"woven basket\", \"wicker basket\", \"bin\"]:\n        masks = segment_sam3_text_prompt(rgb2, bp)\n        if not masks:\n            continue\n        best = max(masks, key=lambda x: float(x[\"score\"]))\n        if float(best[\"score\"]) < 0.4:\n            continue\n        pts = mask_to_world_points(best[\"mask\"].astype(np.uint8), d2, K2, E2)\n        if pts is None or len(pts) < 200:\n            continue\n        zhi = float(np.percentile(pts[:, 2], 98))\n        rim = pts[pts[:, 2] > zhi - 0.030]\n        if len(rim) < 30:\n            continue\n        cx = 0.5 * (float(np.percentile(rim[:, 0], 2)) + float(np.percentile(rim[:, 0], 98)))\n        cy = 0.5 * (float(np.percentile(rim[:, 1], 2)) + float(np.percentile(rim[:, 1], 98)))\n        basket = (cx, cy, zhi)\n        print(f\"  [basket] {bp!r} score={float(best['score']):.3f} rim_mid=({cx:.3f},{cy:.3f}) \"\n              f\"rim_z={zhi:.3f} cloud_median={np.round(np.median(pts, axis=0), 3).tolist()}\", flush=True)\n        break\n    if basket is None:\n        print(\"BASKET NOT FOUND\", flush=True)\n    else:\n        cx, cy, rim_z = basket\n        move([cx, cy, CARRY_Z], quat)\n        z = CARRY_Z\n        while z > DROP_Z:\n            z = max(DROP_Z, z - 0.025)\n            move([cx, cy, z], quat)\n        prev = float(eef()[2])\n        for _ in range(10):\n            move([cx, cy, DROP_Z], quat)\n            cur = float(eef()[2])\n            if prev - cur < 0.0008:\n                break\n            prev = cur\n        print(f\"  [place] release eef_z={float(eef()[2]):.3f} rim_z={rim_z:.3f} width={grip_width():.3f}\",\n              flush=True)\n        open_gripper()\n        move([cx, cy, CARRY_Z], quat)",
