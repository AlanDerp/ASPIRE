  "observed_effect": "Guard the running estimate by CONTINUITY, not by plausibility. The loop keeps a previous accepted centre `est`; a new measurement whose centre is more than 0.030 m from it is rejected (print, then `continue` -- hold position, do NOT chase it, do NOT release on it), and `est` is updated only with accepted measurements. This is the complement of localize.physical-sanity-gate-on-a-segmentation-of-a-held-object: that gate is per-measurement and static (absolute bands, expected depth), and a mask that has MERGED with a neighbouring object passes every one of those bands while jumping in position -- a distinction the worker that found this states explicitly. Compare against the previous ACCEPTED estimate, not against the goal and not against a size/shape band. Measured: the unguarded loop chased est=(0.752,0.166), a 54 mm jump, and released at tcp_z=0.062 (seed 59, reward 0.0); with the guard the same seed rejects the bad mask four times (place[16..19]: base jumped up 0.0185 -> reject), holds position, releases centred on the plate (xy_off=0.0089, base=0.0037, ext_z=0.045) and scores 1.0. Companion rule in the same loop: a SINGLE missing mask is not a reason to let go -- count consecutive dropouts and break only at `miss >= 3`, and reject upward base jumps > 0.015. That half has weaker evidence (no dev seed required it; it is the safe behaviour when the payload really does disappear at close range) and is recorded as a rule, not as a measured win. HONEST STATUS OF THE WHOLE CHANGE: NOT flagged `improved`. The task initial_code.py scored 12/15 on dev (failing 56, 59, 61) and this shipped program scored 11/15 on its first replay (failing 53, 56, 58, 61), with seed 58 flipping to pass on a byte-identical rerun and seed 53 passing under initial_code.py and failing here on a numerically identical trajectory. The guard fixes its two target seeds (59, 61) but the net dev delta is inside run-to-run noise, so the value of this instance is the MECHANISM (a merged mask that no plausibility gate can catch) and the two seeds it demonstrably repaired, not a sweep-level gain.",
