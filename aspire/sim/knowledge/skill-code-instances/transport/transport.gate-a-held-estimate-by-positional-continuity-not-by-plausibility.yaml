  "code": "def main():\n    counters = {\"hops\": 0, \"closes\": 0}\n    language = str(getattr(env.handle, \"task_language\", \"\"))\n    print(\"LANGUAGE: %r\" % language, flush=True)\n\n    rgb, dep, K, E = observe()\n    stove = find_stove(rgb, dep, K, E)\n    cabinet = find_cabinet(rgb, dep, K, E)\n    plate = find_plate(rgb, dep, K, E)\n    print(\"stove=%s\" % (None if stove is None else np.round(stove[\"c\"], 3).tolist()), flush=True)\n    print(\"cabinet=%s\" % (None if cabinet is None else np.round(cabinet[\"c\"], 3).tolist()), flush=True)\n    print(\"plate=%s top=%.4f r=%.4f\" % (None if plate is None else np.round(plate[\"c\"], 3).tolist(),\n                                        -1 if plate is None else plate[\"top\"],\n                                        -1 if plate is None else plate[\"r\"]), flush=True)\n\n    cands = bowl_candidates(rgb, dep, K, E)\n    for c in cands:\n        print(\"  bowl cand c=(%.3f,%.3f,%.3f) z=[%.3f,%.3f] ext=%s n=%d s=%.3f %r\"\n              % (c[\"c\"][0], c[\"c\"][1], c[\"c\"][2], c[\"lo\"][2], c[\"hi\"][2],\n                 np.round(c[\"ext\"], 3).tolist(), c[\"n\"], c[\"score\"], c[\"prompt\"]), flush=True)\n    if not cands:\n        raise RuntimeError(\"no bowl candidates\")\n    if plate is None:\n        raise RuntimeError(\"no plate\")\n\n    # -------- which support does the runtime instruction name?\n    tall = None\n    if \"stove\" in language:\n        sup, tall_support = stove, False\n    elif \"cabinet\" in language and \"top\" not in language:\n        sup, tall_support = cabinet, True\n    elif plate is not None and \"on the plate\" in language:\n        sup, tall_support = plate, False\n    else:\n        sup, tall_support = None, False\n    if sup is None:\n        bowl = max(cands, key=lambda c: c[\"n\"])\n        print(\"  no support named; falling back to the largest candidate\", flush=True)\n    else:\n        bowl, how = pick_on_support(cands, sup, tall_support)\n        print(\"  target via %s: c=(%.3f,%.3f,%.3f)\" % (how, bowl[\"c\"][0], bowl[\"c\"][1], bowl[\"c\"][2]),\n              flush=True)\n\n    goal_xy = np.asarray(plate[\"c\"][:2], dtype=np.float64)\n    g = grasp_bowl(bowl, goal_xy, counters)\n    if g is None:\n        print(\"GRASP FAILED\", flush=True)\n        return\n\n    # -------- carry to above the plate at a height clear of the cabinet\n    counter_hop = hop_to(float(tcp()[0]), float(tcp()[1]), CARRY_Z, g[\"q\"])\n    hop_to(float(goal_xy[0]), float(goal_xy[1]), CARRY_Z, g[\"q\"])\n\n    # -------- servo the PAYLOAD (not the tool) over the plate centre\n    q = g[\"q\"]\n    est = None\n    for k in range(4):\n        rgb2, d2, K2, E2 = observe()\n        cur = tcp()\n        near = cur[:2] if est is None else est\n        m = points_near(rgb2, d2, K2, E2, HELD_PROMPTS, near, 0.11 if est is None else 0.10,\n                        float(cur[2]) - 0.13)\n        if m is None:\n            print(\"  servo[%d]: no held measurement\" % k, flush=True)\n            break\n        new = m[\"c\"][:2]\n        # Track the payload by position continuity: a mask that jumps is a bad\n        # mask, and chasing it drags the payload off the target.\n        if est is not None and float(np.linalg.norm(new - est)) > 0.030:\n            print(\"  servo[%d]: measurement jumped %.3f -> reject\"\n                  % (k, float(np.linalg.norm(new - est))), flush=True)\n            continue\n        est = new\n        err = goal_xy - est\n        nn = float(np.linalg.norm(err))\n        print(\"  servo[%d] est=(%.3f,%.3f) err=%.4f\" % (k, est[0], est[1], nn), flush=True)\n        if nn < 0.010:\n            break\n        step = err * min(1.0, 0.030 / max(nn, 1e-6))\n        goto_pose(np.array([cur[0] + step[0], cur[1] + step[1], CARRY_Z]), q)\n\n    # -------- descend until the payload's OWN base reaches the plate surface\n    rest_z = float(plate[\"top\"]) + 0.002\n    z_cap = float(plate[\"top\"]) + 0.030\n    est = None\n    stall = 0\n    miss = 0\n    base_prev = None\n    z_prev = None\n    for k in range(20):\n        rgb3, d3, K3, E3 = observe()\n        cur = tcp()\n        m = points_near(rgb3, d3, K3, E3, HELD_PROMPTS, cur[:2] if est is None else est,\n                        0.11 if est is None else 0.10, float(cur[2]) - 0.13)\n        if m is None:\n            # A single dropout is not a reason to let go from this height.\n            miss += 1\n            print(\"  place[%d]: no held measurement (%d)\" % (k, miss), flush=True)\n            if miss >= 3:\n                break\n            continue\n        miss = 0\n        new = m[\"c\"][:2]\n        if est is not None and float(np.linalg.norm(new - est)) > 0.030:\n            print(\"  place[%d]: measurement jumped %.3f -> reject\"\n                  % (k, float(np.linalg.norm(new - est))), flush=True)\n            continue\n        est = new\n        base_z = float(m[\"lo\"][2])\n        if base_prev is not None and base_z > base_prev + 0.015:\n            print(\"  place[%d]: base jumped up %.4f -> reject\" % (k, base_z - base_prev),\n                  flush=True)\n            continue\n        base_prev = base_z\n        err = goal_xy - est\n        nn = float(np.linalg.norm(err))\n        print(\"  place[%d] est=(%.3f,%.3f) base=%.4f tcp_z=%.3f err=%.4f\"\n              % (k, est[0], est[1], base_z, cur[2], nn), flush=True)\n        if base_z <= rest_z + 0.008:\n            break\n        if float(cur[2]) <= z_cap + 0.001:\n            break\n        if z_prev is not None and float(cur[2]) > z_prev - 0.002:\n            stall += 1\n            if stall >= 3:\n                break\n        else:\n            stall = 0\n        z_prev = float(cur[2])\n        step = err * min(1.0, 0.014 / max(nn, 1e-6)) if nn >= 0.002 else np.zeros(2)\n        dz = float(np.clip(base_z - rest_z, 0.004, 0.030))\n        goto_pose(np.array([cur[0] + step[0], cur[1] + step[1],\n                            max(float(cur[2]) - dz, z_cap)]), q)\n\n    open_gripper()\n    for _ in range(3):                      # a command buys sim time; an observation does not\n        p = tcp()\n        goto_pose(np.array([p[0], p[1], p[2]]), q)\n    h = tcp()\n    goto_pose(np.array([h[0], h[1], CARRY_Z]), q)\n    print(\"RELEASED at plate xy=%s\" % np.round(goal_xy, 3).tolist(), flush=True)\n\n    # -------- verify (perception only -- costs no sim steps)\n    rgb4, d4, K4, E4 = observe()\n    rest = points_near(rgb4, d4, K4, E4, BOWL_PROMPTS, goal_xy, 0.10,\n                       float(plate[\"top\"]) - 0.030, need=60, size_band=(0.040, 0.150))\n    if rest is None:\n        print(\"VERIFY: payload not found near the plate\", flush=True)\n    else:\n        dxy = rest[\"c\"][:2] - goal_xy\n        print(\"VERIFY: payload c=(%.3f,%.3f) base=%.4f (plate top %.4f) xy_off=%.4f \"\n              \"dir=(%+.3f,%+.3f) ext=%s\"\n              % (rest[\"c\"][0], rest[\"c\"][1], rest[\"lo\"][2], plate[\"top\"],\n                 float(np.linalg.norm(dxy)), dxy[0], dxy[1],\n                 np.round(rest[\"ext\"], 3).tolist()), flush=True)",
