  "code": "def carry_and_place(grip, plate):\n    \"\"\"Servo the HELD object over the plate using its own measured centre.\"\"\"\n    quat = grip[\"quat\"]\n    place = np.asarray(plate[\"c\"], dtype=np.float64)\n    surf_top = float(plate[\"top\"])\n\n    rgb, d, K, E = observe()\n    now = tcp()\n    held = held_cloud(rgb, d, K, E, now[:2], now[2] - 0.12)\n    if held is not None and float(np.linalg.norm(held[1][:2] - now[:2])) < 0.10:\n        sel, est = held\n        off = np.asarray(est[:2]) - now[:2]\n        hang = float(now[2] - np.percentile(sel[:, 2], 2))\n        print(\"  carried: tcp=(%.3f,%.3f,%.3f) bowl=(%.3f,%.3f) off=(%+.3f,%+.3f) hang=%.3f\"\n              % (now[0], now[1], now[2], est[0], est[1], off[0], off[1], hang), flush=True)\n    else:\n        # `off` is ALWAYS \"bowl centre minus TCP\", so the TCP target is place - off.\n        # pinch_off was stored as exactly that offset at grasp time; a rigid grasp\n        # keeps it, so this branch is a valid model of the load, not a guess.\n        off = np.asarray(grip[\"pinch_off\"], dtype=np.float64)\n        hang = max(0.025, float(grip[\"gz\"]) - float(grip[\"bowl_lo\"]))\n        print(\"  carried: measurement rejected, using pinch offset %s hang=%.3f\"\n              % (np.round(off, 3).tolist(), hang), flush=True)\n\n    release_xy = np.array([place[0] - off[0], place[1] - off[1]])\n    print(\"  release col=(%.3f,%.3f) plate=(%.3f,%.3f) surf_top=%.3f\"\n          % (release_xy[0], release_xy[1], place[0], place[1], surf_top), flush=True)\n\n    c = tcp()\n    hop_to(release_xy[0], release_xy[1], max(c[2], surf_top + hang + 0.16), quat, step=0.035)\n\n    # one closed-loop correction from a fresh measurement; a large \"error\" means the\n    # measurement latched onto clutter, not that the payload is that far off\n    rgb, d, K, E = observe()\n    now = tcp()\n    held = held_cloud(rgb, d, K, E, now[:2], now[2] - 0.12)\n    if held is not None and float(np.linalg.norm(held[1][:2] - now[:2])) < 0.10:\n        est = held[1]\n        err = place - np.asarray(est[:2])\n        print(\"  post-carry err=(%+.3f,%+.3f)\" % (err[0], err[1]), flush=True)\n        if 0.015 < float(np.linalg.norm(err)) < 0.060:\n            hop_to(now[0] + err[0], now[1] + err[1], now[2], quat, step=0.025)\n            release_xy = tcp_xy()\n\n    # descend until the payload touches the surface (touchdown guard stops it)\n    width = grip[\"width\"]\n    for dz in (0.10, 0.04, 0.02, 0.010, 0.005, 0.002):\n        go(np.array([release_xy[0], release_xy[1], surf_top + hang + dz]), quat)\n        if aperture_raw() > width + SLIP_DELTA:\n            break\n    got = tcp()\n    open_gripper()\n    for _ in range(3):\n        get_observation()\n    print(\"  released at tcp=(%.3f,%.3f,%.3f)\" % (got[0], got[1], got[2]), flush=True)\n    retreat(quat, 0.15)",
