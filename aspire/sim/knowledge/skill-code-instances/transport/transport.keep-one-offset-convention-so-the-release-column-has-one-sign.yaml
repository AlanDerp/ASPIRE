  "goal": "Compute the release column for a payload pinched off-centre, so the payload centre lands on the target rather than a payload-width away from it.",
  "id": "transport.keep-one-offset-convention-so-the-release-column-has-one-sign",
  "kind": "skill-code-instance",
  "observed_effect": "Hold one convention everywhere: off == payload_centre - tcp (a measured vector whose sign is part of the measurement), and release_xy == place - off unconditionally. Because payload_centre = tcp + off, commanding tcp = place - off centres the payload whichever side of the object the pinch sat on, so no per-grasp-type sign exists anywhere in the code. Measured: the fallback branch negated the stored offset and then subtracted, giving place + off against the measured branch place - off; release column 0.774 vs plate centre 0.712, payload landed 2*|off| = 12.4 cm past the target perched on the rim (reward 0.000). With one convention the column is 0.651 and the payload lands at r = 0.009-0.014 m on 15/15 dev seeds.",
