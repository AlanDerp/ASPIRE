  "code": "def servo_bowl_over(place, z, quat, max_iter=5, tol=0.006, hop=0.030):\n    \"\"\"Hop the tool axis until the HELD bowl's measured centre sits over `place`.\n\n    This is the closed loop that makes the release accurate.  Two things are\n    being corrected at once and neither is knowable in advance: the tool axis\n    does not attain commanded lateral poses (seed 51 stalled ~6 cm short while\n    goto_pose reported success), and the bowl's hang from a radial wall pinch\n    changes with every grasp (measured +0.040 m on one grasp, +0.085 m on the\n    next, on the same bowl).  Servoing on the bowl's own measured XY is\n    independent of both.\n\n    The measuring window is centred on the previous estimate rather than on the\n    tool axis, so the bowl is not clipped by the window edge and the median is\n    not biased toward whichever side happens to fall inside it.\n    \"\"\"\n    est = None\n    for k in range(max_iter):\n        rgb, d, K, E = observe()\n        cur = tcp_xy()\n        m = measure_bowl(rgb, d, K, E, cur if est is None else est,\n                         radius=0.13 if est is None else 0.10)\n        if m is None:\n            print(f\"    servo[{k}]: bowl not measurable\", flush=True)\n            return est\n        est = m[0]\n        err = np.asarray(place, dtype=float)[:2] - est\n        n = float(np.linalg.norm(err))\n        print(f\"    servo[{k}] bowl=({est[0]:.3f},{est[1]:.3f}) err={n:.3f}\", flush=True)\n        if n < tol:\n            return est\n        step = err * min(1.0, hop / max(n, 1e-6))\n        nxt = np.array([cur[0] + step[0], cur[1] + step[1], z])\n        if not reachable(nxt, quat):\n            print(\"    servo hop unreachable\", flush=True)\n            return est\n        goto_pose(nxt, quat)\n    return est",
