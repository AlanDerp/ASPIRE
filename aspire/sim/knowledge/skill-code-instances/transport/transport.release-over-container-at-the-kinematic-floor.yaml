  "code": "def run():\n    print(\"TASK_LANGUAGE:\", getattr(env.handle, \"task_language\", \"\"), flush=True)\n\n    rgb, d, K, E = view()\n    bas = find_basket(rgb, d, K, E) or find_basket(rgb, d, K, E, relax=True)\n    if bas is None:\n        raise RuntimeError(\"basket not localized\")\n    print(\"  basket c=(%.3f,%.3f) rim_z=%.4f span=%s n=%d prompt=%r\"\n          % (bas[\"cx\"], bas[\"cy\"], bas[\"rim_z\"], np.round(bas[\"span\"], 3).tolist(),\n             bas[\"n\"], bas[\"prompt\"]), flush=True)\n\n    pick = None\n    for na in (1, 2):\n        pick = attempt(rgb, d, K, E, na)\n        if pick is not None:\n            break\n    if pick is None:\n        print(\"  no grasp after retries\", flush=True)\n        return\n\n    # re-observe the basket from the high carry pose; fall back to the pre-grasp measurement\n    rgb2, d2, K2, E2 = view()\n    bas2 = find_basket(rgb2, d2, K2, E2) or find_basket(rgb2, d2, K2, E2, relax=True)\n    if bas2 is not None:\n        bas = bas2\n    print(\"  release over c=(%.3f,%.3f) rim_z=%.4f\" % (bas[\"cx\"], bas[\"cy\"], bas[\"rim_z\"]),\n          flush=True)\n\n    q = pick[\"q\"]\n    bx, by, rim_z, hang = bas[\"cx\"], bas[\"cy\"], bas[\"rim_z\"], pick[\"hang\"]\n    carry_z = rim_z + 0.20\n    cur = tcp()\n    goto_or_fail([cur[0], cur[1], max(carry_z, cur[2])], q)\n    for f in (0.5, 1.0):                          # lateral transfer at carry height\n        goto_or_fail([cur[0] + f * (bx - cur[0]), cur[1] + f * (by - cur[1]), carry_z], q)\n\n    rel_z = rim_z - 0.030 - hang                  # aim the box's underside below the rim\n    descend_to(bx, by, rel_z, q, tag=\"place\")\n    press_to_clamp(bx, by, rel_z, q, iters=4, tag=\"place\")\n    tz = float(tcp()[2])\n    print(\"  over mouth tcp z=%.4f gap=%.4f\" % (tz, gap()), flush=True)\n    if gap() <= AIR_GAP:\n        print(\"  object already lost - not releasing\", flush=True)\n        goto_or_fail([bx, by, rim_z + 0.22], q)\n        return\n    open_gripper()\n    for _ in range(3):\n        get_observation()                         # let physics settle before the predicate\n    goto_or_fail([bx, by, rim_z + 0.22], q)",
