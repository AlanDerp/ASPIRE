  "code": "def find_flat_top(pw, res=0.015, max_slope=0.35, z_lo=0.10, z_hi=0.45,\n                  min_cells=18, xr=(0.10, 0.72), yr=(-0.58, 0.50)):\n    \"\"\"Highest large, locally-horizontal surface in a world point cloud.\"\"\"\n    q = pw[np.isfinite(pw).all(axis=1)]\n    q = q[q[:, 2] > -0.02]\n    if len(q) < 500:\n        return None\n    x0 = np.floor(q[:, 0].min() / res) * res\n    y0 = np.floor(q[:, 1].min() / res) * res\n    ix = np.clip(((q[:, 0] - x0) / res).astype(int), 0, 4000)\n    iy = np.clip(((q[:, 1] - y0) / res).astype(int), 0, 4000)\n    nx, ny = int(ix.max()) + 2, int(iy.max()) + 2\n    top = np.full((nx, ny), -9.0)\n    cnt = np.zeros((nx, ny), dtype=int)\n    np.maximum.at(top, (ix, iy), q[:, 2])\n    np.add.at(cnt, (ix, iy), 1)\n    top[top == -9.0] = np.nan\n\n    flat = np.zeros((nx, ny), dtype=bool)\n    for i in range(1, nx - 1):\n        for j in range(1, ny - 1):\n            z = top[i, j]\n            if not np.isfinite(z) or cnt[i, j] < 6:\n                continue\n            if not (z_lo <= z <= z_hi):\n                continue\n            if not np.isfinite(top[i - 1:i + 2, j - 1:j + 2]).all():\n                continue\n            gx = (top[i + 1, j] - top[i - 1, j]) / (2.0 * res)\n            gy = (top[i, j + 1] - top[i, j - 1]) / (2.0 * res)\n            if abs(gx) <= max_slope and abs(gy) <= max_slope:\n                flat[i, j] = True\n\n    seen = np.zeros_like(flat)\n    best = None\n    for si, sj in np.argwhere(flat):\n        if seen[si, sj]:\n            continue\n        stack = [(si, sj)]\n        seen[si, sj] = True\n        comp = []\n        while stack:\n            i, j = stack.pop()\n            comp.append((i, j))\n            for di, dj in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n                a, b = i + di, j + dj\n                if 0 <= a < nx and 0 <= b < ny and flat[a, b] and not seen[a, b]:\n                    seen[a, b] = True\n                    stack.append((a, b))\n        if len(comp) < min_cells:\n            continue\n        xs = np.array([x0 + i * res + res / 2.0 for i, _ in comp])\n        ys = np.array([y0 + j * res + res / 2.0 for _, j in comp])\n        zs = np.array([top[i, j] for i, j in comp])\n        cx, cy = float(np.median(xs)), float(np.median(ys))\n        if not (xr[0] <= cx <= xr[1] and yr[0] <= cy <= yr[1]):\n            continue\n        if best is None or float(np.max(zs)) > best[0]:\n            best = (float(np.max(zs)), cx, cy, float(np.max(zs)))\n    if best is None:\n        return None\n    return np.array([best[1], best[2], best[3]], dtype=np.float64)",
