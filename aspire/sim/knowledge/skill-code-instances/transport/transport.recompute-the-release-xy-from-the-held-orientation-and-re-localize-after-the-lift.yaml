  "goal": "Release into a container from a tilted grasp by recomputing the pad xy offset from the held orientation and re-localizing the container after the lift",
  "id": "transport.recompute-the-release-xy-from-the-held-orientation-and-re-localize-after-the-lift",
  "kind": "skill-code-instance",
  "observed_effect": "The pad-to-command offset is R @ [0, 0, PAD_FROM_EEF] and its horizontal part grows with tilt, so a constant offset copied from a top-down pinch is wrong; recomputing per release keeps the object inside a 0.15 m mouth. Re-localizing the basket after the lift is correct here because pickup (x ~0.763) and basket (x ~0.60) are far apart in frame, unlike the _swap alphabet-soup case where the carried can dragged the basket centroid 8.7 cm. 15/15 dev and 50/50 held-out",
