  "code": "def place_in_basket(hold):\n    rgb, d, K, E = obs_frames()\n    bk = find_basket(rgb, d, K, E)\n    if bk is None:\n        print(\"  basket not localized\", flush=True)\n        return False\n    q = hold[\"quat\"]\n    off = (quat_R(q) @ np.array([0.0, 0.0, PAD_FROM_EEF]))[:2]   # pads relative to the eef drive\n    mx, my = float(bk[\"mouth\"][0]) - float(off[0]), float(bk[\"mouth\"][1]) - float(off[1])\n    rim = float(bk[\"rim\"])\n    go(np.array([mx, my, max(float(eef_point()[2]), rim + 0.24)]), q)\n    go(np.array([mx, my, rim + 0.06]), q)\n    go(np.array([mx, my, rim - 0.020]), q)          # pads just inside the mouth\n    p = pad_point()\n    print(\"  release: pads=(%.3f,%.3f,%.3f) mouth=(%.3f,%.3f) rim=%.3f aperture=%.4f\"\n          % (p[0], p[1], p[2], bk[\"mouth\"][0], bk[\"mouth\"][1], rim, raw_w()), flush=True)\n    open_gripper()\n    print(\"  aperture after release %.4f\" % raw_w(), flush=True)\n    return True",
