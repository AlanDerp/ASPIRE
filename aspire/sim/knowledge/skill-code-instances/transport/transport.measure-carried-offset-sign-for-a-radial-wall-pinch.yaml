  "observed_effect": "release_xy = place + off + shift with off = clip([obj_xy - tcp_xy], +/-0.08) taken from the live pinch geometry. The SIGN is scene-specific and must be MEASURED, not inherited: releasing once onto bare table showed the object came to rest on the SAME side as the pinch (+0.041 m ~ +Rw). The goal-swap template used place - off and released 5 cm past the plate, so the object slid off and the failure presents as 'rolled off the plate', not as an offset bug. Flipping to place + off took seed 51 from 0.0 to 1.0 and all of seeds 51-65 landed 0.002-0.007 m from the commanded point. The same attempt() routine also carries the grasp-width verification (air grasp at the pinch, slip re-read after the lift, carry, and descent)",
