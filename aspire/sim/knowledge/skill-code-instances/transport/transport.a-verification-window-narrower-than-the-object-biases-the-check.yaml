  "code": "def placed_on_plate(rgb, d, K, E, place_xy, plate_top, r_bowl):\n    \"\"\"Bowl points near the goal XY *and* resting at the plate surface height.\n\n    Known bias, not fixed here: the window (`radius = r_bowl + 0.04`, centred on\n    the goal cell) is narrower than the landed bowl, so it keeps only the bowl's\n    near half and the median lands on the window side of the bowl.  Measured on\n    seeds 51-65 the offset is the same +0.017 m every time (this check = the\n    true landing error + 0.017), which makes the 0.035 m tolerance behave like\n    0.018 m: a bowl that rests more than 1.8 cm from the goal cell is reported\n    \"not placed\" and re-placed, and the re-place - the release column shifted\n    past the arm's x-wall - drags the bowl off the plate.  That is what killed\n    seeds 58/60/62/65.  Widening the window does *not* fix it (measured: the\n    wider window then takes in the gripper's fingers, which sit one bowl radius\n    towards the wrist, and the bias flips to -0.030 m), so the bias is left\n    as-is and its effect is kept out of the way by landing the bowl accurately\n    (see the descent step in `attempt`).\n    \"\"\"\n    pts = bowl_points_near(rgb, d, K, E, place_xy, radius=max(0.07, r_bowl + 0.04))\n    if pts is None:\n        return False\n    c = np.median(pts, axis=0)\n    zlo = float(np.percentile(pts[:, 2], 2))\n    dist = math.hypot(c[0] - place_xy[0], c[1] - place_xy[1])\n    print(f\"  place check n={len(pts)} centre=({c[0]:.3f},{c[1]:.3f},{c[2]:.3f}) \"\n          f\"z2={zlo:.3f} dist={dist:.3f} (plate_top={plate_top:.3f})\", flush=True)\n    return dist < PLACE_TOL and (plate_top - 0.03) < zlo < (plate_top + 0.07)",
