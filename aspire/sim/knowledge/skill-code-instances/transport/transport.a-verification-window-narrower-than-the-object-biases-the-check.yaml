  "observed_effect": "Documented defect, not a fix. The window r_win = max(0.07, r_obj + 0.04) = 0.089 m is narrower than the landed 0.102 m bowl, so it keeps the bowl near half and the median lands on the window side: measured check = true landing error + 0.017 m on 15/15 development seeds (seed 60 landed 0.019, check 0.036; seed 65 landed 0.022, check 0.039). That turns the intended 0.035 m tolerance into an effective 0.018 m and fabricated the not-placed verdicts behind seeds 58, 60, 62 and 65. The naive repair was measured and falsified: widening to r_obj + 0.09 lets the gripper fingers, which sit one object radius toward the wrist, into the cloud and flips the bias to -0.030 m, which is worse - so it was not shipped. Usable rule: measure the bias against a known-good placement before trusting the check tolerance; the offset is stable in magnitude but its SIGN is not.",
