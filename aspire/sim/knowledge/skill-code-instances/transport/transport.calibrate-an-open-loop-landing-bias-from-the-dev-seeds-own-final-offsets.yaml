  "observed_effect": "The 15 dev seeds landed at a mean (bowl - plate) offset of (+0.012, -0.019) m with the same sign on every seed (x +0.001..+0.024, y -0.007..-0.038) against a ~1 cm placement tolerance (plate rim 0.065 m vs bowl rim 0.054 m), so a 2 cm biased landing perched the bowl on the rim. Commanding place_xy = goal_xy + (-0.012, +0.019) moved the landed distance from a 2.3 cm mean to a 5 mm median and took dev seeds 3/15 -> 15/15 (14/15 in an identical repeat sweep; combined 29/30). PRECONDITION: the loop is open, so the constant is the only thing acting on the offset. On pick_up_the_black_bowl_in_the_top_drawer_of_the_wooden_cabinet the same kind of residual (0.0217 m) was halved by a constant LAND_BIAS and changed NO outcome (15/15 either way), because that loop closes on the payload own measured base. So a constant bias is fatal on an open loop and only a margin on a closed one - measure which you have before shipping it, and state the precondition",
