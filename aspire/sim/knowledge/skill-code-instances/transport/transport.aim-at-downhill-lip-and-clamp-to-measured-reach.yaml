  "code": "def choose_place_xy(rack_pts, x_lo=0.58, x_hi=0.70, inset=0.012):\n    \"\"\"Aim at the rack's top surface near its downhill (front) lip.\n\n    The top of this rack is a plane that varies only with y: high at the back,\n    low at the front.  The front lip is therefore both the lowest and the\n    nearest part of the top - the shortest drop and the easiest reach.  x is\n    clamped to a band the arm can hold a top-down pose over; the arm cannot\n    carry a top-down pose past y ~ -0.19 at all, so the uphill end of the rack\n    is not a candidate.\n    \"\"\"\n    z_hi = float(np.percentile(rack_pts[:, 2], 98.0))\n    band = rack_pts[rack_pts[:, 2] > z_hi - 0.09]\n    if len(band) < 20:\n        band = rack_pts\n    y_front = float(np.percentile(band[:, 1], 97.0))\n    lip = band[band[:, 1] > y_front - 0.03]\n    if len(lip) < 5:\n        lip = band\n    x = float(np.clip(np.median(lip[:, 0]), x_lo, x_hi))\n    return x, y_front - inset",
