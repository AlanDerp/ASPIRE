  "observed_effect": "Isolate the support's top band, take its extreme along the slope axis as the downhill lip, inset by 0.012 so the object's centre sits just inside the lip, and clamp the lateral aim to a band measured by a reach PROBE (not by solve_ik's willingness to return a solution). On the rack the top runs z=0.299 at y=-0.30 to z=0.236 at y=-0.18 (slope only in y) and a top-down pose cannot pass y ~ -0.19; retargeting from (0.561,-0.202) to (0.700,-0.191) moved the arm's floor at the place point from 6 cm above the surface to 1 cm above it, and 15/15 seeds then released inside that 1 cm",
