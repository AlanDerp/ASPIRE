  "code": "def main():\n    obs = get_observation()\n    st = bowl_state(obs)\n    if st is None:\n        raise RuntimeError(\"bowl not found\")\n    base_zmax = st[\"zmax\"]\n    print(\"bowl %s score=%.3f xy=%s rim_z=%.3f zmax=%.3f\"\n          % (st[\"info\"][\"prompt\"], st[\"info\"][\"score\"], np.round(st[\"xy\"], 3),\n             st[\"rim_z\"], base_zmax), flush=True)\n\n    rgb, di, K, E = view(obs)\n    cam_xy = np.asarray(E, dtype=np.float64)[:2, 3]\n    v_cam = cam_xy - st[\"xy\"]\n    cam_phi = float(np.degrees(np.arctan2(v_cam[1], v_cam[0])))\n    phi0 = grasp_direction(rgb, di, K, E, st[\"info\"][\"mask\"], st[\"xy\"], cam_phi)\n    print(\"phi0=%.1f (cam_phi=%.1f)\" % (phi0, cam_phi), flush=True)\n\n    # ---------------- 1. grasp the bowl's shell ---------------- #\n    tcp = quat = None\n    for k, dphi in enumerate((0.0, 90.0, 180.0, 270.0, 45.0, 225.0)):\n        obs = get_observation()\n        st = bowl_state(obs)\n        if st is None:\n            continue\n        c, rim_z = st[\"xy\"], st[\"rim_z\"]\n        gz = rim_z - 0.014\n        r_g = shell_radius(st[\"pts\"], c, gz, 0.014)\n        if r_g is None:\n            r_g = shell_radius(st[\"pts\"], c, rim_z - 0.006, 0.012)\n        if r_g is None:\n            r_g = 0.045\n        if k >= 4:\n            r_g *= 0.88\n        phi = phi0 + dphi\n        d = np.array([np.cos(np.radians(phi)), np.sin(np.radians(phi))])\n        cand = np.array([c[0] + r_g * d[0], c[1] + r_g * d[1], gz])\n        q = make_topdown_quat(phi + 90.0)      # closing axis radial to the bowl\n        print(\"try %d phi=%.0f gz=%.3f r_g=%.4f tcp=%s\"\n              % (k, phi, gz, r_g, np.round(cand, 3)), flush=True)\n        open_gripper()\n        goto_pose(cand, q, z_approach=0.09)\n        close_gripper()\n        w = gripper_norm(get_observation())\n        up = np.array([cand[0], cand[1], cand[2] + 0.16])\n        goto_pose(up, q)\n        st2 = bowl_state(get_observation())\n        zmax = st2[\"zmax\"] if st2 is not None else -9.0\n        print(\"   gripper=%.4f bowl_zmax=%.3f (was %.3f)\" % (w, zmax, base_zmax), flush=True)\n        if zmax > base_zmax + 0.04:\n            tcp, quat = cand, q\n            break\n        open_gripper()\n        goto_pose(np.array([cand[0], cand[1], cand[2] + 0.10]), q)\n    if tcp is None:\n        raise RuntimeError(\"no grasp acquired\")\n    offset = float(st[\"pts\"][:, 2].min()) - tcp[2]   # bowl bottom relative to fingertip\n    print(\"GRASPED tcp=%s offset=%.3f\" % (np.round(tcp, 3), offset), flush=True)\n\n    # ---------------- 2. cabinet top target ---------------- #\n    obs2 = get_observation()\n    rgb2, d2, K2, E2 = view(obs2)\n    top = cabinet_top(rgb2, d2, K2, E2)\n    if top is None:\n        raise RuntimeError(\"cabinet not found\")\n    z_top, tx, ty = top[\"z\"], top[\"x\"], top[\"y\"]\n    print(\"cabinet %s score=%.3f z_top=%.3f target=(%.3f, %.3f) n_top=%d\"\n          % (top[\"prompt\"], top[\"score\"], z_top, tx, ty, top[\"n\"]), flush=True)\n\n    # transit height must clear the *top* of the cabinet, not just the grasp height\n    transit_z = z_top + CLEARANCE - offset\n    place_z = z_top + RELEASE_GAP - offset\n    cur = wrist(obs2)[2]\n    print(\"offset=%.3f transit_tcp_z=%.3f place_tcp_z=%.3f\" % (offset, transit_z, place_z),\n          flush=True)\n\n    # ---------------- 3. transport above the surface, then set down ---------------- #\n    cur_xy = np.asarray(obs2[\"robot_cartesian_pos\"], dtype=np.float64).reshape(-1)[:3]\n    if cur < transit_z:\n        goto_pose(np.array([cur_xy[0], cur_xy[1], transit_z + 0.1]), quat)\n    else:\n        goto_pose(np.array([cur_xy[0], cur_xy[1], cur + 0.06]), quat)\n    goto_pose(np.array([tx, ty, transit_z]), quat)\n    goto_pose(np.array([tx, ty, place_z]), quat)\n    open_gripper()\n    for _ in range(3):\n        get_observation()\n    goto_pose(np.array([tx, ty, transit_z]), quat)\n    for _ in range(4):\n        get_observation()",
