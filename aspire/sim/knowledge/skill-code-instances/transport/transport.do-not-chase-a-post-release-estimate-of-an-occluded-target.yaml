  "code": "def placed(plate, ref_xy):\n    \"\"\"Placement check: bowl points near ref_xy resting at plate height.\n\n    The plate is a free body: the descent and the bowl's landing can shove it, so the\n    check re-measures where the plate ACTUALLY is now instead of trusting the pose read\n    before the carry (a bowl dropped on the plate centre of a plate that has since slid\n    2 cm is not on the plate any more).\n    \"\"\"\n    rgb, d, K, E = observe()\n    got = bowl_near(rgb, d, K, E, ref_xy, tol=0.12)\n    if got is None:\n        print(\"  place check: no bowl found near the plate\", flush=True)\n        return False, None\n    c, _, pts = got\n    cur = find_plate(rgb, d, K, E)\n    pcx, pcy, ptop = plate[\"cx\"], plate[\"cy\"], plate[\"top\"]\n    if cur is not None:\n        print(\"  (plate re-segmented after release: (%.3f,%.3f) vs pre-carry \"\n              \"(%.3f,%.3f) - the mask centre is dragged away from the bowl that \"\n              \"occludes it, so the PRE-CARRY pose is used for the check)\"\n              % (cur[\"cx\"], cur[\"cy\"], pcx, pcy), flush=True)\n    zlo = float(np.percentile(pts[:, 2], 2))\n    zext = float(np.percentile(pts[:, 2], 98)) - zlo\n    dist = float(np.hypot(c[0] - pcx, c[1] - pcy))\n    ok = dist < PLACE_OK and (ptop - 0.030) < zlo < (ptop + 0.070)\n    print(\"  place check n=%d centre=(%.3f,%.3f) zlo=%.3f zext=%.3f plate=(%.3f,%.3f) \"\n          \"moved=%+.3f dist=%.3f -> %s\"\n          % (len(pts), c[0], c[1], zlo, zext, pcx, pcy,\n             float(np.hypot(pcx - plate[\"cx\"], pcy - plate[\"cy\"])), dist, ok), flush=True)\n    return ok, c",
