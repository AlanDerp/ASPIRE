  "goal": "Verify a placement against an unbiased target pose, and refuse a correction derived from an occluded re-segmentation",
  "id": "transport.do-not-chase-a-post-release-estimate-of-an-occluded-target",
  "kind": "skill-code-instance",
  "observed_effect": "Verify the placement against the target pose measured BEFORE the carry (the only unbiased one) and treat any post-release re-segmentation as report-only -- never as control input and never as the pass/fail test. Chasing the biased estimate is actively harmful: a nudge term toward the artefactual shove pushed an already-good placement off centre and tipped the bowl onto the plate rim (seed 56, bowl z-extent 0.054 vs 0.044 flat), taking the sweep to 14/15. With both the nudge and the SHOVE feed-forward DELETED, placement is 15/15 with the bowl flat every seed. The artefact is repeatable, which is exactly what makes it tempting -- repeatability is not evidence of truth when the measurement is occluded by your own payload",
  "provenance": {
    "partition": "development"
  },
