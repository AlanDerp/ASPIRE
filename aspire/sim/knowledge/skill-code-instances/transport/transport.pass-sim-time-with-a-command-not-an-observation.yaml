  "observed_effect": "settle(quat, repeats) = N redundant goto_pose(tcp_pos(), quat) calls at the CURRENT pose. This is the inverse of the 'perception costs no sim steps' rule: because get_observation() / segment_sam3_* / mask_to_world_points advance no sim steps, a loop of observations cannot damp a pendulum -- only a COMMAND buys sim time. Measured: the held bowl was off_from_goal 0.0045 immediately before open_gripper() and 0.0416 immediately after, i.e. the fingers opened on a moving payload; with settle() before the open, after the release, and between the small post-release hops the transient disappears. This CORRECTS the pre-existing transport.md section 'Physics Settling After Release', which prescribed an open_gripper() then for _ in range(3): get_observation() loop. Contrast localize.perception-costs-no-sim-steps, which uses the same fact to make closed loops cheap",
