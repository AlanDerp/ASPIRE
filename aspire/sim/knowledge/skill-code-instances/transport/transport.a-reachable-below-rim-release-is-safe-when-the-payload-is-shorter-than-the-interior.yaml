  "goal": "Scope the 'a reachable deep release is fatal' reading to payloads whose height is comparable to or exceeds the container's interior depth: with a payload SHORTER than the interior, a reachable below-rim release is safe, so reachability is a proxy for the payload-to-depth ratio and not an independent cause",
  "id": "transport.a-reachable-below-rim-release-is-safe-when-the-payload-is-shorter-than-the-interior",
  "kind": "skill-code-instance",
  "observed_effect": "On libero_object_task/pick_up_the_tomato_sauce_and_place_it_in_the_basket an 0.110 m bottle (goal zlo 0.003-0.004, zhi 0.113) is released into a basket whose rim reads 0.141-0.142 and whose floor is near 0.012, i.e. interior depth ~0.13 m -- the payload is SHORTER than the interior. Shipped rule rel_z = rim - RELEASE_UNDER_RIM + hang with RELEASE_UNDER_RIM 0.040 and hang 0.089-0.090 (captured at the pinch, before any lift) commanded tcp z 0.190-0.192, putting the payload BASE 0.101-0.102 = exactly 4.0 cm below the rim, which the arm REACHED (no place-stall printed) on 10 of 15 seeds and stalled on 5 (seeds 57,58,59,60,62). BOTH cases scored 1.0: reward 1.000 task_completed 1 on 15/15. So this is a reachable below-rim release that is safe, which the existing butter entry's final paragraph calls unsafe. The contrast that reconciles them is payload_height / interior_depth: 0.110/0.13 here (safe, base 4.0 cm below rim) against the 0.143 m carton in a ~0.135 m basket on libero_object_task/pick_up_the_butter_... (fatal at base 7.0 cm below rim). Because the bottle is pinched high (GRASP_FRAC 0.78) its hang is 0.089, so the TOOL stays at z 0.190, well above the 0.141 rim, while the payload base goes 4 cm inside -- the quantity to derive is the payload base, not the tool height. This instance does NOT resolve whether the reachability wording or the payload ratio is the operative variable; it establishes only that a short payload with a reachable deep release is not the butter-shaped hazard",
