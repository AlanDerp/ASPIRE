  "code": "def main():\n    obs = get_observation()\n    language = getattr(env.handle, \"task_language\", \"\")\n    print(\"=\" * 72, flush=True)\n    print(\"TASK_LANGUAGE: %r\" % (language,), flush=True)\n    print(\"=\" * 72, flush=True)\n\n    cam = obs[\"agentview\"]\n    rgb = cam[\"images\"][\"rgb\"]\n    depth = _depth(cam[\"images\"][\"depth\"])\n    K = cam[\"intrinsics\"]\n    E = cam[\"pose_mat\"]\n\n    goal = find_goal(rgb, depth, K, E, language)\n    if goal is None:\n        raise RuntimeError(\"no goal candidate survived the screen\")\n    basket = find_basket(rgb, depth, K, E)\n    if basket is None:\n        raise RuntimeError(\"no basket candidate survived the screen\")\n    print(\"  GOAL   ctr=(%.3f,%.3f) zlo=%.3f zhi=%.3f ext=%.3f/%.3f/%.3f desc=%+.3f\"\n          % (goal[\"cx\"], goal[\"cy\"], goal[\"zlo\"], goal[\"zhi\"], goal[\"ext\"][0],\n             goal[\"ext\"][1], goal[\"ext\"][2], goal[\"col\"][\"desc\"]), flush=True)\n    print(\"  BASKET rim=%.3f mouth=(%.3f,%.3f) fp=%.3f x %.3f\"\n          % (basket[\"rim\"], basket[\"mx\"], basket[\"my\"], basket[\"wid\"], basket[\"dep\"]),\n          flush=True)\n\n    quat = make_topdown_quat(0.0)\n    goto_home_joint_position()\n\n    # ---- pick: pinch HIGH on the bottle's own z-range -----------------------\n    pts = goal[\"pts\"]\n    zlo = float(np.percentile(pts[:, 2], 2))\n    zhi = float(np.percentile(pts[:, 2], 98))\n    for frac in (0.30, 0.45, 0.55, 0.65, 0.75, 0.82, 0.90):\n        zz = zlo + frac * (zhi - zlo)\n        sl = pts[np.abs(pts[:, 2] - zz) < 0.012]\n        if len(sl) >= 8:\n            e = np.percentile(sl, 98, axis=0) - np.percentile(sl, 2, axis=0)\n            print(\"    profile frac=%.2f z=%.3f n=%3d ext=(%.3f,%.3f)\"\n                  % (frac, zz, len(sl), e[0], e[1]), flush=True)\n\n    high_z = max(goal[\"zhi\"] + 0.14, basket[\"rim\"] + CARRY_CLEAR)\n    # The first entry is the shipped grasp; the rest only ever run after a failed\n    # hold, so the passing path is unchanged.\n    GRASP_LADDER = [(0.0, GRASP_FRAC), (0.0, 0.62), (90.0, GRASP_FRAC)]\n    grip = None\n    for yaw, frac in GRASP_LADDER:\n        quat = make_topdown_quat(yaw)\n        z_grasp = zlo + frac * (zhi - zlo)\n        band = pts[np.abs(pts[:, 2] - z_grasp) < 0.022]\n        if band.shape[0] < 20:\n            band = pts\n        bxy = (0.5 * (np.percentile(band, 2, axis=0)[:2]\n                      + np.percentile(band, 98, axis=0)[:2]))\n        print(\"  PINCH yaw=%.0f frac=%.2f z_grasp=%.3f xy=(%.3f,%.3f) band_n=%d\"\n              % (yaw, frac, z_grasp, bxy[0], bxy[1], band.shape[0]), flush=True)\n        move_tcp([bxy[0], bxy[1], high_z], quat, \"approach\")\n        meas_z = ladder_z(bxy[0], bxy[1], high_z, z_grasp, quat, \"descent\")\n        print(\"  descent stopped at tcp z=%.3f (target %.3f, object top %.3f)\"\n              % (meas_z, z_grasp, zhi), flush=True)\n        close_gripper()\n        o = get_observation()\n        gap_close = aperture(o)\n        tcp_pinch = float(tcp_xyz(o, quat)[2])\n        print(\"  close gap=%.4f tcp_z=%.3f\" % (gap_close, tcp_pinch), flush=True)\n        if gap_close <= AIR_GAP or gap_close >= GRASP_MAX_GAP:\n            print(\"  GRASP REJECTED gap=%.4f\" % gap_close, flush=True)\n            open_gripper()\n            continue\n        hang = tcp_pinch - zlo\n        print(\"  hang = tcp_pinch %.3f - object base %.3f = %.3f\"\n              % (tcp_pinch, zlo, hang), flush=True)\n        # ladder the lift: one jump throws a held object\n        top_z = max(zhi, z_grasp) + 0.16\n        ladder_z(bxy[0], bxy[1], tcp_pinch, top_z, quat, \"lift\", step=LIFT_STEP)\n        o = get_observation()\n        gap_lift = aperture(o)\n        print(\"  gap after lift=%.4f (after close %.4f) delta=%+.4f\"\n              % (gap_lift, gap_close, gap_lift - gap_close), flush=True)\n        if gap_lift <= AIR_GAP or gap_lift > gap_close + 0.03:\n            print(\"  GRIP LOST during lift\", flush=True)\n            open_gripper()\n            continue\n        grip = dict(bxy=bxy, hang=hang, tcp_pinch=tcp_pinch, gap_close=gap_close,\n                    gap_lift=gap_lift, top_z=top_z)\n        break\n    if grip is None:\n        raise RuntimeError(\"all grasp candidates failed\")\n    bxy, hang = grip[\"bxy\"], grip[\"hang\"]\n\n    # ---- carry: re-localize the basket, fly above the rim, descend ----------\n    o2 = get_observation()\n    cam2 = o2[\"agentview\"]\n    b2 = find_basket(cam2[\"images\"][\"rgb\"], _depth(cam2[\"images\"][\"depth\"]),\n                     cam2[\"intrinsics\"], cam2[\"pose_mat\"])\n    if b2 is not None:\n        basket = b2\n    rim = float(basket[\"rim\"])\n    mx, my = float(basket[\"mx\"]), float(basket[\"my\"])\n    transit_z = rim + CARRY_CLEAR + hang\n    ladder_z(bxy[0], bxy[1], float(tcp_xyz(get_observation(), quat)[2]), transit_z,\n             quat, \"raise\", step=LIFT_STEP)\n    print(\"  transit at tcp z=%.3f (payload base %.3f, rim %.3f)\"\n          % (transit_z, transit_z - hang, rim), flush=True)\n    move_tcp([mx, my, transit_z], quat, \"lateral\")\n    o = get_observation()\n    print(\"  over basket tcp=(%.3f,%.3f,%.3f) gap=%.4f\"\n          % (tcp_xyz(o, quat)[0], tcp_xyz(o, quat)[1], tcp_xyz(o, quat)[2],\n             aperture(o)), flush=True)\n\n    rel_z = rim - RELEASE_UNDER_RIM + hang\n    stopped = ladder_z(mx, my, float(tcp_xyz(get_observation(), quat)[2]), rel_z,\n                       quat, \"place\", step=0.020, max_iter=10)\n    print(\"  release: commanded tcp z=%.3f payload base %.3f (rim %.3f) stopped %.3f\"\n          % (rel_z, rel_z - hang, rim, stopped), flush=True)\n    if aperture(get_observation()) <= AIR_GAP:\n        print(\"  GRIP LOST before release\", flush=True)\n        raise RuntimeError(\"grip lost before release\")\n    open_gripper()\n    settle(4)\n    print(\"  gap after release=%.4f\" % aperture(get_observation()), flush=True)\n    ladder_z(mx, my, float(tcp_xyz(get_observation(), quat)[2]), transit_z,\n             quat, \"retreat\", step=LIFT_STEP, max_iter=6)\n    print(\"  DONE\", flush=True)",
