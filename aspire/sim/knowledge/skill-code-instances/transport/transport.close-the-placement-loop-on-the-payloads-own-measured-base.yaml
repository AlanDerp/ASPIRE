  "code": "def place_on_target(goal_xy, plate_top, quat, max_iter=24, z_cap=None):\n    \"\"\"Descend until the HELD object's OWN measured base reaches the plate, re-centring\n    laterally as it goes.\n\n    The hang offset is not a constant: a rim pinch lets the payload swing by about one\n    pendulum length, and it changes again as the tool drops towards the surface, so a\n    release height pre-computed from the carry-height offset releases in mid-air or\n    presses the object into the plate.  Close the loop on the object's own cloud with a\n    plate-relative floor instead, and step down by only as much as the measured\n    clearance allows.\n    \"\"\"\n    rest_z = float(plate_top) + 0.002\n    z_floor = float(plate_top) + 0.004\n    if z_cap is None:\n        z_cap = float(plate_top) + 0.032     # never wedge the tool through the object\n    est, stall, z_prev = None, 0, None\n    for k in range(max_iter):\n        rgb, d, K, E = view()\n        cur = tcp_pos()\n        cl = held_cluster(rgb, d, K, E, cur[:2] if est is None else est, z_floor,\n                          0.13 if est is None else 0.11)\n        if cl is None:\n            print(\"  place[%d] no held-object measurement\" % k, flush=True)\n            break\n        cxy, zlo, _n = cl\n        est = cxy\n        err = np.asarray(goal_xy, dtype=np.float64)[:2] - cxy\n        n = float(np.linalg.norm(err))\n        print(\"  place[%d] held=(%.3f,%.3f) base=%.3f err=%.4f ztcp=%.3f\"\n              % (k, cxy[0], cxy[1], zlo, n, cur[2]), flush=True)\n        if zlo <= rest_z + 0.008:\n            print(\"  place[%d] object base is at the plate -> release here\" % k, flush=True)\n            break\n        if float(cur[2]) <= z_cap + 0.001:\n            print(\"  place[%d] tool at its floor for this object -> release here\" % k, flush=True)\n            break\n        if z_prev is not None and float(cur[2]) > z_prev - 0.002:\n            stall += 1\n            if stall >= 3:\n                print(\"  place[%d] tool stopped descending -> release here\" % k, flush=True)\n                break\n        else:\n            stall = 0\n        z_prev = float(cur[2])\n        step = err * min(1.0, 0.014 / max(n, 1e-6))\n        if n < 0.002:\n            step = np.zeros(2)\n        dz = float(np.clip(zlo - rest_z, 0.004, HOP))\n        nz = max(float(cur[2]) - dz, z_cap)\n        goto_pose(np.array([cur[0] + step[0], cur[1] + step[1], nz]), quat)\n    return est",
