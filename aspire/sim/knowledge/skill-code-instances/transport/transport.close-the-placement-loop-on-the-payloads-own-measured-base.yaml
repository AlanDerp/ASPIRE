  "observed_effect": "Close the placement loop on the HELD object's OWN measured base instead of a precomputed release height: each iteration segments the payload cloud near the previous estimate above an ABSOLUTE floor (plate top + 0.004, since at release height a tool-relative gate admits the plate and the plate is the larger cloud), takes the 5th percentile of its z as the object's base, and steps the tool down by clip(base - rest_z, 0.004, HOP) with a lateral correction capped at 0.014 m. Stop on base within 8 mm of the support, on the tool's kinematic floor, or after 3 non-descending iterations. Seed 52 landing error 6.7 cm -> 1.3 cm and seed 53 4.5 cm -> 1.2 cm, where the same grasp measured the hang sign flipping (-0.008,-0.052) at the pinch vs (+0.030,+0.046) at the landing in seed 51",
