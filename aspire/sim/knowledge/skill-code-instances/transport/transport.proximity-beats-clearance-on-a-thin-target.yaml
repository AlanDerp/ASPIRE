  "code": "def choose_places(cloud, pcx, pcy, plate_top, r_bowl, h_bowl, tol=0.04):\n    \"\"\"Rank release spots over the plate for a bowl of radius `r_bowl`.\n\n    Each 1 cm grid cell gets a circular footprint of the *bowl's* radius; the\n    lowest obstacle inside that footprint above the plate surface is the cell's\n    clearance (1.0 = nothing at all).  Cells the bowl cannot descend through are\n    dropped, and of the rest the one *closest to the plate centre* wins: the goal\n    test for a plain object \"On\" predicate only accepts a few centimetres of\n    offset, so proximity matters far more than extra head-room.\n    \"\"\"\n    need = h_bowl + 0.04\n    cands = []\n    for dx in np.arange(-tol, tol + 1e-6, 0.01):\n        for dy in np.arange(-tol, tol + 1e-6, 0.01):\n            gx, gy = pcx + dx, pcy + dy\n            # circular footprint: a square one also sweeps up geometry that the\n            # bowl itself would never touch (e.g. a table edge or the arm)\n            m = np.hypot(cloud[:, 0] - gx, cloud[:, 1] - gy) < r_bowl\n            col = cloud[m]\n            above = col[col[:, 2] > plate_top + 0.02]\n            clear = 1.0 if len(above) == 0 else float(above[:, 2].min() - plate_top)\n            score = (clear >= need, -math.hypot(dx, dy))\n            cands.append((score, float(gx), float(gy), clear))\n    cands.sort(key=lambda c: c[0], reverse=True)\n    out = []\n    for sc, gx, gy, cl in cands:\n        if all(math.hypot(gx - ox, gy - oy) > 0.02 for ox, oy, _ in out):\n            out.append((gx, gy, cl))\n    return out[:6]",
