  "code": "def carry_and_place(q, grasp, plate, cab):\n    \"\"\"Transit above the tallest obstacle, then a closed-loop descent onto the\n    plate's own measured surface, releasing when the PAYLOAD's base arrives.\"\"\"\n    # `goto_pose` commands the grip site; `robot_cartesian_pos[2]` reads 0.112 m\n    # higher, and the xy of the two agree for a top-down tool.  So the grip site is\n    # tcp_z - 0.112 and the payload's own base is what the release has to land.\n    hang = float(grasp[\"zr\"]) - float(grasp[\"base\"])          # nominal, from the pinch\n    cur = tcp()\n    grip_z = float(cur[2]) - GZ\n    print(\"  hang=%.3f nominal (cmd zip %.3f - base %.3f); grip_z=%.3f\"\n          % (hang, grasp[\"zr\"], grasp[\"base\"], grip_z), flush=True)\n\n    off_pinch = np.asarray(grasp[\"off\"], dtype=float)[:2]      # exact by construction\n    off = off_pinch\n    rgb, d, K, E = view()\n    # Below the payload's own base: the old 0.09 window sat a few mm under its rim\n    # and returned a thin visible ARC of it, whose bounding box is half a payload\n    # away from the payload's axis.\n    hb = held_bowl(rgb, d, K, E, cur[:2], grip_z - 0.11, 0.13)\n    if hb is not None:\n        off_air = np.clip(np.array([hb[\"c\"][0] - cur[0], hb[\"c\"][1] - cur[1]]), -0.08, 0.08)\n        # The pinch offset is exact: the tool was commanded to the wall at a measured\n        # radius from the axis.  The free-space read-back is not -- a partial mask\n        # moves its bounding-box centre by up to a payload radius, which shows up as a\n        # ~10 cm error in the release target.  ADOPT the measurement only where the two\n        # agree; a disagreement means the mask, not the grasp, is wrong.\n        agree = float(np.linalg.norm(off_air - off_pinch))\n        if agree < 0.020:\n            off = off_air\n        # The payload slips a little deeper into the jaws as it takes load, so the\n        # nominal hang is an over-estimate; adopt the measured one when it is sane.\n        h_cand = grip_z - float(hb[\"lo\"][2])\n        if 0.002 < h_cand < 0.090:\n            hang = h_cand\n        print(\"  air offset=(%.3f,%.3f) vs pinch=(%.3f,%.3f) d=%.3f h_cand=%.3f hang=%.3f\"\n              % (off_air[0], off_air[1], off_pinch[0], off_pinch[1], agree, h_cand, hang),\n              flush=True)\n    else:\n        print(\"  air measure failed; pinch offset=(%.3f,%.3f)\" % (off[0], off[1]),\n              flush=True)\n    hang = float(np.clip(hang, 0.004, 0.090))\n\n    place = np.array([plate[\"c\"][0], plate[\"c\"][1]])\n    release_xy = np.array([place[0] - off[0], place[1] - off[1]])\n    obstacle_top = max(float(cab[\"top\"]) if cab is not None else -1.0, float(plate[\"top\"]))\n    transit_z = obstacle_top + CLEAR_ABOVE + hang\n    rest_z = float(plate[\"top\"]) + PLACE_CLEAR\n    rel_z = rest_z + hang\n    print(\"  release_xy=(%.3f,%.3f) transit_z=%.3f rel_z=%.3f\"\n          % (release_xy[0], release_xy[1], transit_z, rel_z), flush=True)\n\n    # rise clear of the tallest obstacle in the path, then move laterally\n    cur = tcp()\n    if (float(cur[2]) - GZ) < transit_z:\n        goto_pose(np.array([cur[0], cur[1], transit_z]), q)\n        _charge(\"pose\")\n    cur = tcp()\n    for f in (0.5, 1.0):\n        goto_pose(np.array([cur[0] + f * (release_xy[0] - cur[0]),\n                            cur[1] + f * (release_xy[1] - cur[1]), transit_z]), q)\n        _charge(\"pose\")\n    if raw_w() < AIR_W:\n        print(\"  grip lost during transit; NOT releasing\", flush=True)\n        return False\n\n    # coarse open-loop ladder in grip-site space, then a short closed loop on the\n    # payload's own base.  The ladder stops a little above the release height; the\n    # loop finishes the last few millimetres and trims the lateral error.\n    cur = tcp()                                # re-read AFTER the lateral moves\n    z0 = gripz()\n    # stop well ABOVE the plate: the loop below needs its first look at the payload\n    # taken clear of the z-gate, or the measured base saturates at the gate and the\n    # payload is released from ~2 cm, where it bounces away from a 12 cm plate\n    floor_z = rel_z + 0.060\n    n = int(math.ceil((z0 - floor_z) / HOP))\n    for i in range(1, max(0, n) + 1):\n        if spent() > 820 or raw_w() < AIR_W:\n            break\n        goto_pose(np.array([cur[0], cur[1], max(z0 - i * HOP, floor_z)]), q)\n        _charge(\"pose\")\n    print(\"  coarse ladder -> gripz=%.3f (floor %.3f)\" % (gripz(), floor_z), flush=True)\n    if raw_w() < AIR_W:\n        print(\"  grip lost during the descent; NOT releasing\", flush=True)\n        return False\n\n    # Closed loop on the payload's OWN base and centre.  The payload swings on the\n    # jaws after the carry, so the single free-space offset measurement above is not\n    # accurate enough to place a 10 cm bowl on a 12 cm plate in one shot: converge on\n    # the plate here, where the geometry that decides the landing is the geometry\n    # being measured.  A settle between looks damps the swing before it is sampled.\n    z_floor = float(plate[\"top\"]) + 0.004     # keeps the plate's own cloud out\n    drop = 0.002          # release a couple of mm clear: set down, not pressed in\n    rel_z_rel = rel_z + drop\n    est = None\n    base_z = 1.0\n    for k in range(6):\n        if spent() > 900 or raw_w() < AIR_W:\n            break\n        cur = tcp()\n        settle(q, 1)\n        rgb, d, K, E = view()\n        hb = held_bowl(rgb, d, K, E, cur[:2] if est is None else est,\n                       z_floor, 0.13 if est is None else 0.11)\n        if hb is None:\n            print(\"  payload measurement lost at k=%d\" % k, flush=True)\n            break\n        est = hb[\"c\"]\n        base_z = float(hb[\"lo\"][2])\n        gz = gripz()\n        if k == 0:\n            # the payload slips deeper into the jaws as it takes load, so re-derive\n            # how far its base hangs below the grip site here, in free space\n            h_est = float(np.clip(gz - base_z, 0.004, 0.090))\n            if 0.004 < h_est < 0.090:\n                hang = h_est\n                rel_z = rest_z + hang\n            print(\"  hang re-measured in free space: %.3f -> rel_z=%.3f\" % (hang, rel_z),\n                  flush=True)\n        err = place - est\n        nerr = float(np.linalg.norm(err))\n        rel_z_rel = rel_z + drop\n        print(\"  servo[%d] gripz=%.3f obj=(%.3f,%.3f) base_z=%.3f err=%.4f\"\n              % (k, gz, est[0], est[1], base_z, nerr), flush=True)\n        if nerr <= 0.004 and base_z <= rest_z + 0.010:\n            break\n        # Damp the fine phase.  The estimate carries a couple of mm of mask noise,\n        # and a full-gain step taken on a noisy reading RANDOM-WALKS the payload\n        # instead of converging on it, which is exactly the quantity the landing\n        # depends on.  Big errors still move at full speed.\n        fine = nerr < 0.010\n        gain = 0.6 if fine else 1.0\n        cap = 0.010 if fine else 0.030\n        step = err * (gain * min(1.0, cap / max(nerr, 1e-6)))\n        # Taper the LAST few cm of the descent: the approach velocity at the contact\n        # is what decides whether the payload is set down or knocked down.  The loop\n        # must also never go below the release height -- pressing the payload into\n        # the support and lifting it back out is not a placement.\n        dzmax = 0.030 if base_z > rest_z + 0.030 else 0.010\n        dz = float(np.clip(base_z - rest_z - 0.004, 0.0, dzmax))\n        goto_pose(np.array([cur[0] + step[0], cur[1] + step[1],\n                            max(gz - dz, rel_z_rel)]), q)\n        _charge(\"pose\")\n    print(\"  descent done: gripz=%.3f rel_z=%.3f rel_rel=%.3f base(last)=%.3f\"\n          % (gripz(), rel_z, rel_z_rel, base_z), flush=True)\n\n    # The loop above stops on a MEASURED base height, and that measurement carries\n    # a few mm of noise, so the height at which the payload is let go was the least\n    # controlled quantity in the whole program -- on marginal seeds the same code\n    # landed or missed on a 3 mm change.  Command the release height ABSOLUTELY and\n    # close on the grip-site height (the servo lands a few mm short of its command),\n    # then let the payload FALL the last few mm instead of pressing it into the\n    # support: a free drop absorbs the residual height error, and the jaws are no\n    # longer in loaded contact with the support when they open, so they cannot drag\n    # the payload sideways as they retract.\n    for _ in range(3):\n        if spent() > 880:\n            break\n        cur = tcp()\n        settle(q, 1)\n        gz = gripz()\n        if gz >= rel_z_rel - 0.001:\n            break\n        goto_pose(np.array([cur[0], cur[1], rel_z_rel + (rel_z_rel - gz)]), q)\n        _charge(\"pose\")\n    settle(q, 1)\n    print(\"  release at gripz=%.3f (cmd %.3f, drop %.3f)\" % (gripz(), rel_z_rel, drop),\n          flush=True)\n    if raw_w() < AIR_W:\n        print(\"  nothing between the pads at the release point; NOT opening\", flush=True)\n        return False\n    open_gripper()\n    _charge(\"grip\")\n    settle(q, 2)          # let the payload land and come to rest before the episode ends\n    print(\"  after release: gripz=%.3f\" % gripz(), flush=True)\n    cur = tcp()\n    goto_pose(np.array([cur[0], cur[1], (float(cur[2]) - GZ) + 0.12]), q)\n    _charge(\"pose\")\n    return True",
