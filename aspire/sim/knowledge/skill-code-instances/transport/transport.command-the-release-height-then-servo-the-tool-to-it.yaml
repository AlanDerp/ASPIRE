  "observed_effect": "The release height is the last quantity in a pick-and-place that a closed descent loop does NOT control: the loop stops when the MEASURED payload base reaches the support, and that measurement carries a few mm of mask noise, so with the un-closed version the tool released 1-6 mm below its own command on all 15 dev seeds (rel_z - gripz = +0.006,+0.005,-0.004,+0.002,-0.002,+0.004,+0.005,+0.002,+0.005,+0.006,+0.002,+0.003,+0.005,+0.001,+0.003) -- pressing the payload into the plate by a random amount. Three parts, all inside carry_and_place. (1) CLAMP: the commanded z is max(gz - dz, rel_z_rel), so the loop can never go below the release height; pressing the payload in and lifting it back out is not a placement. (2) TAPER: dzmax = 0.030 above rest_z+0.030 else 0.010, bounding the approach velocity at contact -- a free drop from 8 mm bounced the bowl 24.7 mm off centre and regressed seed 51 to 0.0 with everything else identical. (3) SERVO: a separate 3-iteration loop commands the release height ABSOLUTELY in grip-site space and closes on the MEASURED grip site with an integral term (target = rel_z_rel + (rel_z_rel - gz)), because the joint servo lands short of its own command. Measured: seed 63 released at gripz=0.060 (cmd 0.061) instead of 0.005 low and went 0.0 -> 1.0. The release is then 2 mm clear (drop = 0.002) so the payload is SET DOWN and falls the last couple of mm instead of being pressed in. VARIANCE -- DO NOT READ A SINGLE SWEEP AS THIS CODE PROPERTY: two full 15-seed dev sweeps of this shipped program scored 14/15 (fail 53) and 12/15 (fail 53, 55, 64), i.e. 26/30, and the same seeds 53/55/64 flip between draws. The 3 mm of release height the closure removes is the same 3 mm that flips marginal seeds, so a per-seed swing is expected and the closure must be judged by mechanism plus the printed achieved-vs-commanded height, not by score. development_outcomes.successes lists the 12 seeds that passed in BOTH draws.",
