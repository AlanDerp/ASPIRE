  "code": "def bowl_on_plate(plate):\n    \"\"\"Closed-loop placement check from perception only: a bowl-shaped cloud whose\n    centre is over the plate's footprint and whose underside sits ON the plate\n    surface (+7 mm) rather than on the table (-5 mm).\"\"\"\n    rgb, d, K, E = observe()\n    for c in dedupe(bowl_candidates(rgb, d, K, E, BOWL_PROMPTS)):\n        r = float(np.linalg.norm(c[\"c\"] - plate[\"c\"]))\n        if r < 0.075 and float(c[\"lo\"][2]) > float(plate[\"top\"]) - 0.006:\n            print(\"  VERIFIED on plate: c=(%.3f,%.3f) r=%.3f zlo=%.3f\"\n                  % (c[\"c\"][0], c[\"c\"][1], r, c[\"lo\"][2]), flush=True)\n            return c\n    return None",
