  "kind": "skill-code-instance",
  "observed_effect": "On seed 51 the initial program placed the bowl correctly at (0.709, 0.196) and then, because the loop only ended on a counter, re-carried and grabbed the ramekin instead. Adding a perception-only check that looks for a bowl-shaped cloud whose centre is within 0.075 m of the plate centre and whose underside sits above plate_top - 0.006 m makes the loop exit immediately after the verified placement (log line VERIFIED on plate: c=(0.709,0.196) r=0.006) with no second carry. Seeds 51-65 all scored 1.0 on the re-measured shipped revision. The check is perception-only: it reads the same bowl and plate candidates the rest of the program uses and takes no ground-truth input.",
