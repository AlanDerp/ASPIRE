  "observed_effect": "Returning the pads to the measured pad z at the close is bias-free: at that instant the payload's underside rested on the support, so that height IS the destination surface to within its thickness and no depth percentile survives in the release target. Seeds 51-65: release-pad_z spread across the 15 seeds fell 30.5 mm -> 8.1 mm; reverse travel below the pinch (release_pad_z - close_pad_z), a 29 mm bimodality on seeds 56/64/65 {0.0351-0.0362 m vs 0.0057-0.0063 m on the other 12}, collapsed to 6 mm {0.0138-0.0143 vs 0.0075-0.0076}; maximum finger slide past an already-landed payload fell 36 mm -> 14 mm; payload base z after release within +-1.7 mm on all 15, before and after. No seed flipped -- reward was 1.0 on all 15 both before and after, so this is a variance reduction, not a reward fix",
