  "code": "def attempt(bottle_frac, plate):\n    rgb, dep, K, E = cam()\n    b = find_bottle(rgb, dep, K, E)\n    if b is None:\n        return \"miss\"\n    axis, z_pinch, R, zlo, zhi = cylinder_axis(b[\"pts\"], bottle_frac)\n    print(\"  pinch target: axis=(%.4f,%.4f) z=%.4f R=%.4f\" % (axis[0], axis[1], z_pinch, R), flush=True)\n\n    open_gripper()\n    move_pads([axis[0], axis[1], APPROACH_PAD_Z], tag=\"approach\")\n    z_got = descend(axis, APPROACH_PAD_Z, z_pinch, 0.015, tag=\"grasp\")\n    if z_got > zhi + 0.020:\n        print(\"  pads stalled above the object top (%.4f > %.4f)\" % (z_got, zhi), flush=True)\n        open_gripper()\n        return \"air\"\n\n    close_gripper()\n    g_close = gap()\n    z_pinch_achieved = float(pad_pos()[2])\n    print(\"  close: pad_z=%.4f gap=%.4f\" % (z_pinch_achieved, g_close), flush=True)\n    if g_close <= AIR_GAP or g_close >= GRASP_MAX_GAP:\n        print(\"  rejected close (gap %.4f)\" % g_close, flush=True)\n        open_gripper()\n        return \"air\"\n\n    # lift as a ladder, re-reading the gap: an unchanged gap is the hold test\n    z = z_pinch_achieved\n    for _ in range(6):\n        z = min(CARRY_PAD_Z, z + 0.040)\n        move_pads([axis[0], axis[1], z], tag=\"lift\")\n        g = gap()\n        print(\"  lift pad_z=%.4f gap=%.4f\" % (float(pad_pos()[2]), g), flush=True)\n        if g <= AIR_GAP or g > g_close + 0.03:\n            print(\"  lost it on the lift (gap %.4f)\" % g, flush=True)\n            open_gripper()\n            return \"slip\"\n        if z >= CARRY_PAD_Z - 1e-9:\n            break\n\n    # re-observe the plate AFTER the lift (the payload does not occlude it)\n    p2 = find_plate(*cam())\n    if p2 is not None:\n        plate = p2\n    px, py = float(plate[\"c\"][0]), float(plate[\"c\"][1])\n    print(\"  plate target=(%.4f,%.4f) surface=%.4f well=%.4f r=%.4f\"\n          % (px, py, plate[\"surface\"], plate[\"well\"], plate[\"r\"]), flush=True)\n\n    carry_lateral([px, py], CARRY_PAD_Z, tag=\"transit\")\n    t = pad_pos()\n    print(\"  over plate: pads=(%.4f,%.4f,%.4f) err=%.4f\"\n          % (t[0], t[1], t[2], float(np.hypot(t[0] - px, t[1] - py))), flush=True)\n\n    # Release: the object hangs (z_pinch_achieved - base) below the pads, and its\n    # base sat exactly on the table at the pinch.  Putting the pads back at the\n    # pinch height therefore puts the base back at table level, which is the\n    # plate's own surface to within the plate's thickness.  This is bias-free -\n    # it needs no depth percentile, so the camera's base-reading noise cancels.\n    z_release = z_pinch_achieved - 0.003\n    z_landed = descend([px, py], CARRY_PAD_Z, z_release, 0.012,\n                       tag=\"release\", touchdown=g_close)\n    print(\"  release: pad_z=%.4f (pinch %.4f) gap=%.4f\"\n          % (z_landed, z_pinch_achieved, gap()), flush=True)\n    open_gripper()\n    for _ in range(3):\n        get_observation()\n    print(\"  after release gap=%.4f\" % gap(), flush=True)\n\n    # report only - never gate control on a post-release segmentation\n    pb = find_bottle(*cam())\n    pf = find_plate(*cam())\n    if pb is not None and pf is not None:\n        bb = np.median(pb[\"pts\"], axis=0)\n        d = float(np.hypot(bb[0] - pf[\"c\"][0], bb[1] - pf[\"c\"][1]))\n        print(\"  CHECK bottle=(%.4f,%.4f) plate=(%.4f,%.4f) dist=%.4f bottle_zlo=%.4f well=%.4f\"\n              % (bb[0], bb[1], pf[\"c\"][0], pf[\"c\"][1], d,\n                 float(np.percentile(pb[\"pts\"][:, 2], 2)), pf[\"well\"]), flush=True)\n    move_pads([px, py, min(CARRY_PAD_Z, float(pad_pos()[2]) + 0.12)], tag=\"retreat\")\n    return \"placed\"",
