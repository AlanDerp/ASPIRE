{
  "schema_version": 1,
  "title": "Upward abstraction under skill-code library growth",
  "hypotheses": {
    "H1": {
      "claim": "Principle trees reduce active retrieval surface growth beyond canonical deduplication.",
      "refutation": "Principle count grows with code instances or descent still exposes nearly all leaves."
    },
    "H2": {
      "claim": "Task performance degrades no faster than the canonical-skill baseline as the library grows.",
      "refutation": "The advantage disappears at scale or abstraction increases negative transfer."
    },
    "H3": {
      "claim": "Canonicalization and principle trees reduce actor-visible redundancy.",
      "refutation": "Duplicates merely move upward into canonical skills or principles."
    },
    "H4": {
      "claim": "The forest localizes conflicts and invalidation work.",
      "refutation": "High-level hubs enlarge blast radius or conceal unsupported principles."
    },
    "H5": {
      "claim": "Explicit exception gates reduce negative transfer.",
      "refutation": "Removing exception and counterevidence gates has no adverse effect, or the gates fail to block violations."
    },
    "H6": {
      "claim": "Any gain over canonical retrieval is not explained by shorter summaries alone.",
      "refutation": "Summary trees match principle trees, or overlay adds no cross-capability benefit."
    }
  },
  "treatments": {
    "A": "flat-code",
    "B": "canonical-skill",
    "C": "summary-tree",
    "D": "principle-tree",
    "E": "forest-overlay-graph",
    "F": "principle-tree-without-exceptions"
  },
  "library_scales": [1, 4, 16, 64],
  "seeds": [11, 29, 47],
  "token_budget": 2400,
  "fixed_artifacts": {
    "model_id": null,
    "prompt_hash": null,
    "task_split_hash": null,
    "checkpoint_map_hash": null,
    "execution_config_hash": null,
    "job_catalog_hash": null
  },
  "primary_baseline": "B",
  "required_separations": ["development", "held-out", "organic", "synthetic"],
  "evaluation_partitions": {
    "organic": ["held-out", "adversarial", "maintenance"],
    "synthetic": ["held-out", "adversarial", "maintenance"]
  },
  "decision_rules": {
    "task_noninferiority_margin": 0.03,
    "principle_recall_at_8_min": 0.9,
    "operational_skill_recall_margin": 0.03,
    "unsupported_principle_escape_max": 0,
    "exception_hard_violation_escape_max": 0,
    "shadow_fallback_rate_max": 0.1,
    "compile_latency_p95_ms_max": 300,
    "claim_min_independent_tasks": 2,
    "claim_min_task_families": 2,
    "claim_min_advantage_scales": 2,
    "total_cost_weights": {
      "compute_minute": 0.1,
      "model_1k_tokens": 0.01,
      "monetary_unit": 1.0
    },
    "claim_requires_slope_comparison": true
  },
  "status": "preregistered-engineering-draft",
  "note": "Freeze model identifiers, task split, corpus hashes, checkpoints and seeds before execution. Organic and synthetic results must be reported separately."
}
