schema_version: 1
cli_input_required:
  - reviewer
  - reviewed_at
  - when
  - decision
  - invariant
  - falsifiers
  - counterexample_report
  - leave_one_family_out_report
exception_rule: record at least one exception or an explicit empty-exception review
stored_artifacts:
  proposal: immutable principle proposal revision and content hash
  counterexample: proposals/principle-counterexample/<content-hash>.yaml
  leave_one_family_out: proposals/principle-lofo/<content-hash>.yaml
  review: proposals/principle-review/<content-hash>.yaml
promotion_event_required:
  - subject
  - version
  - principle_hash
  - candidate_version
  - candidate_hash
  - review_artifact_hash
  - checkpoint_id
replay_rule: proposal plus review must reproduce the exact candidate, and that candidate must reproduce the exact promoted principle
counterexample_rule: review accepts only the current deterministic development search result for the exact proposal
failure_rule: missing, altered, non-canonical, or mismatched evidence makes the principle actor-invisible
revision_selection:
  - A newer proposal or candidate does not shadow the newest promoted revision.
  - A newer unpromoted validated, deprecated, or blocked claim suppresses the logical id and triggers canonical fallback.
workflow:
  - principle propose from a frozen canonical-skill repetition audit
  - principle counterexamples against development evidence
  - principle finalize-lofo for every declared task family
  - principle review, which internalizes all three content-addressed artifacts
  - principle promote, which replays candidate evidence before writing a validated revision
